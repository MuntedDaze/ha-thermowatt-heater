      rates_set: '{{ (states(''input_number.em_peak_rate'') | float(0)) > 0 and (states(''input_number.em_off_peak_rate'') | float(0)) > 0 and (states(''input_number.em_feed_in_rate'') | float(0)) > 0 }}'
      monitored: '19'
      tariff_matches_controller: |-
        {% set c = states('sensor.thermann_shadow_current_tariff') %}
        {{ c == states('sensor.em_tariff_period') if c in ['peak', 'off_peak', 'shoulder'] else none }}
  - name: EM monitoring quality
    unique_id: em_monitoring_quality
    state: |-
      {% set ns = namespace(missing=[], stale=[], core=0) %}
      {% for e, label, age, core in [('sensor.goodwe_inverter_meter_active_power', 'Grid power', 300, 1), ('sensor.goodwe_inverter_meter_total_energy_import', 'Grid import energy', 0, 1), ('sensor.goodwe_inverter_meter_total_energy_export', 'Grid export energy', 0, 1), ('sensor.goodwe_inverter_house_consumption', 'House power', 300, 1), ('sensor.goodwe_inverter_pv_power', 'Solar power', 300, 1), ('sensor.dryer_current_consumption', 'Dryer power', 1800, 0), ('sensor.dryer_today_s_consumption', 'Dryer energy', 0, 0), ('sensor.washing_machine_current_consumption', 'Washing machine power', 1800, 0), ('sensor.washing_machine_today_s_consumption', 'Washing machine energy', 0, 0), ('sensor.dishwasher_current_consumption', 'Dishwasher power', 1800, 0), ('sensor.dishwasher_today_s_consumption', 'Dishwasher energy', 0, 0), ('sensor.server_current_consumption', 'Server power', 1800, 0), ('sensor.server_today_s_consumption', 'Server energy', 0, 0), ('sensor.network_cupboard_current_consumption', 'Network cupboard power', 1800, 0), ('sensor.network_cupboard_today_s_consumption', 'Network cupboard energy', 0, 0), ('sensor.jrig_current_consumption', 'Jrig power', 1800, 0), ('sensor.jrig_today_s_consumption', 'Jrig energy', 0, 0), ('sensor.garage_current_consumption', 'Garage power', 1800, 0), ('sensor.garage_today_s_consumption', 'Garage energy', 0, 0)] %}
      {% set s = states[e] %}
      {% if s is none or s.state in ['unavailable', 'unknown', ''] %}
      {% set ns.missing = ns.missing + [label] %}{% set ns.core = ns.core + core %}
      {% elif age > 0 and (now() - (s.last_reported | default(s.last_updated))).total_seconds() > age %}
      {% set ns.stale = ns.stale + [label] %}{% set ns.core = ns.core + core %}
      {% endif %}
      {% endfor %}
      {{ (100 * (19 - (ns.missing | count) - (ns.stale | count)) / 19) | round(1) }}
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:gauge
