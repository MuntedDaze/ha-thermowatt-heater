        name: Solar power
        secondary_info: last-updated
      - entity: sensor.goodwe_inverter_today_s_pv_generation
        name: Solar energy
        secondary_info: last-updated
      - entity: sensor.goodwe_inverter_house_consumption
        name: House power
        secondary_info: last-updated
  - type: grid
    cards:
    - type: heading
      heading: Circuits and appliances
      heading_style: title
      icon: mdi:power-plug
    - type: entities
      title: Freshness
      entities:
      - entity: sensor.dryer_current_consumption
        name: Dryer
        secondary_info: last-updated
      - entity: sensor.washing_machine_current_consumption
        name: Washing machine
        secondary_info: last-updated
      - entity: sensor.dishwasher_current_consumption
        name: Dishwasher
        secondary_info: last-updated
