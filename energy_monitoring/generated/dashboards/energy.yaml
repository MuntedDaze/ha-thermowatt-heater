  - type: grid
    cards:
    - type: markdown
      content: These are Home Assistant's own Energy cards. They stay empty until the Energy dashboard is configured (README, step 5).
    - type: energy-date-selection
      grid_options:
        columns: full
    - type: energy-distribution
      link_dashboard: true
      grid_options:
        columns: full
    - type: energy-usage-graph
      grid_options:
        columns: full
    - type: energy-solar-graph
      grid_options:
        columns: full
    - type: energy-sources-table
      grid_options:
        columns: full
    - type: energy-devices-graph
      grid_options:
        columns: full
    column_span: 4
- title: Health
  path: health
  icon: mdi:heart-pulse
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Monitoring health
      heading_style: title
      icon: mdi:heart-pulse
    - type: tile
      entity: sensor.em_monitoring_health
      name: Status
    - type: tile
      entity: sensor.em_monitoring_quality
      name: Sources reporting
    - type: markdown
      content: |-
        {% set missing = state_attr('sensor.em_monitoring_health', 'missing') or [] %}
        {% set stale = state_attr('sensor.em_monitoring_health', 'stale') or [] %}
        **Missing or unavailable:** {{ missing | join(', ') if missing else 'none' }}

        **Stale:** {{ stale | join(', ') if stale else 'none' }}

        **Tariff rates set:** {{ 'yes' if state_attr('sensor.em_monitoring_health', 'rates_set') else 'NO: costs are not being counted' }}

        **Untracked residual:** {{ state_attr('sensor.em_untracked_power', 'raw_residual_w') }} W (persistently negative means a load is counted twice)
  - type: grid
    cards:
    - type: heading
      heading: Core meters
      heading_style: title
      icon: mdi:meter-electric
    - type: entities
      title: Freshness
      entities:
