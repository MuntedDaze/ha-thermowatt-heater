    - type: tile
      entity: sensor.thermann_shadow_simulated_completion
      icon: mdi:clock-check-outline
    - type: tile
      entity: sensor.thermann_shadow_planning_deadline
      icon: mdi:flag-checkered
    - type: tile
      entity: sensor.thermann_shadow_off_peak_fallback_start
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.thermann_shadow_heating_time_estimate
      icon: mdi:timer-outline
    - type: tile
      entity: sensor.thermann_shadow_mixed_tank_energy_estimate
      icon: mdi:lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_plan_cost_estimate
      icon: mdi:cash
    - type: tile
      entity: sensor.thermann_shadow_recommended_energy_source
      icon: mdi:solar-power
  - type: grid
    cards:
    - type: heading
      heading: Energy & prices
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_pv
      icon: mdi:solar-power
    - type: tile
      entity: sensor.thermann_shadow_measured_house_load
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_export
      icon: mdi:transmission-tower-export
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_import
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.thermann_shadow_current_tariff
      icon: mdi:tag-outline
    - type: tile
      entity: sensor.thermann_shadow_current_import_price
      icon: mdi:currency-usd
    - type: tile
      entity: sensor.thermann_shadow_forecast_net_surplus
      icon: mdi:weather-sunny
    - type: tile
      entity: sensor.thermann_shadow_forecast_usable_solar_before_deadline
      icon: mdi:solar-panel
    - type: markdown
      content: '### Heat now or later?

        Whole remaining cycle at full 3 kW: **now {{ states(''sensor.thermann_shadow_continuous_cycle_cost_now'')
        }} AUD** · best later **{{ states(''sensor.thermann_shadow_continuous_cycle_cost_later'') }} AUD**
        · benefit of now **{{ states(''sensor.thermann_shadow_benefit_of_heating_now'') }} AUD**.


        Costs include imported electricity **and foregone solar feed-in**. Partial solar counts: 2 kW
        surplus + 1 kW import is cheaper than 3 kW off-peak grid. Forecasts are uncertain; comfort wins
        over small savings.'
  - type: grid
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: history-graph
      title: Bottom temperature · 24 h
      hours_to_show: 24
      entities:
      - sensor.thermann_shadow_bottom_temperature
      - sensor.thermann_shadow_reported_target
    - type: history-graph
      title: Solar, house and grid · 12 h (kW)
      hours_to_show: 12
      entities:
      - sensor.thermann_shadow_measured_pv
      - sensor.thermann_shadow_measured_house_load
      - sensor.thermann_shadow_measured_signed_grid
- title: Settings
  path: settings
  icon: mdi:cog
  cards:
  - type: markdown
    content: '# Hot-water preferences

      **Local shadow settings only.** These controls and the integration''s Configure dialog edit **one**
      saved configuration. Changes are validated together (an invalid change saves nothing), recalculate
      locally at once and never contact Thermann, restart the heater or change the native Schedule or
      T-Comfort. Recommended values are experimental starting points, not manufacturer limits.'
  - type: entities
    title: Comfort
    icon: mdi:home-thermometer
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_morning_comfort_threshold
    - time.thermann_shadow_morning_deadline
    - number.thermann_shadow_afternoon_storage_target
    - time.thermann_shadow_afternoon_comfort_preference
    - number.thermann_shadow_heating_time_allowance
  - type: markdown
    content: "### Comfort — current, recommended and original values\n\n**Morning comfort threshold**\
      \ — current **{{ states('number.thermann_shadow_morning_comfort_threshold') }} °C** · recommended\
      \ & original **40 °C** · *restored by Restore*  \nBottom-sensor decision threshold; NEVER a heater\
      \ setpoint or hygiene temperature.\n\n**Morning deadline** — current **{{ states('time.thermann_shadow_morning_deadline')\
      \ }}** · recommended & original **07:00** · *restored by Restore*  \nHobart local time, independent\
      \ of tariff boundaries; before noon.\n\n**Afternoon storage target** — current **{{ states('number.thermann_shadow_afternoon_storage_target')\
      \ }} °C** · recommended & original **70 °C** · *restored by Restore*  \nSelected model target is\
      \ never silently reduced. 65–70°C is a planning range, not a newly qualified command limit.\n\n\
      **Afternoon comfort preference** — current **{{ states('time.thermann_shadow_afternoon_comfort_preference')\
      \ }}** · recommended & original **16:00** · *restored by Restore*  \nHobart local. Weekday storage\
      \ deadline follows actual evening tariff peak; this preference remains visible separately.\n\n**Heating\
      \ time allowance** — current **{{ states('number.thermann_shadow_heating_time_allowance') }} min**\
      \ · recommended & original **30 min** · *restored by Restore*  \nExtra full-power model minutes\
      \ when heat is required. Uncalibrated; comfort overrides optional dwell."
  - type: entities
    title: Solar & Forecasting
    icon: mdi:solar-power
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_minimum_useful_net_surplus
    - number.thermann_shadow_solar_headroom
    - switch.thermann_shadow_use_published_forecasts
    - number.thermann_shadow_forecast_uncertainty_margin
    - number.thermann_shadow_extra_forecast_household_load
  - type: markdown
    content: "### Solar & Forecasting — current, recommended and original values\n\n**Minimum useful net\
      \ surplus** — current **{{ states('number.thermann_shadow_minimum_useful_net_surplus') }} kW** ·\
      \ recommended & original **0.1 kW** · *restored by Restore*  \nPartial solar can be worthwhile.\
      \ Economic comparison must also pass; never a variable-power command.\n\n**Solar headroom** — current\
      \ **{{ states('number.thermann_shadow_solar_headroom') }} kW** · recommended & original **0.3 kW**\
      \ · *restored by Restore*  \nDeduct from measured surplus for uncertain household loads.\n\n**Use\
      \ published forecasts** — current **{{ states('switch.thermann_shadow_use_published_forecasts')\
      \ }}** · recommended & original **Off** · *restored by Restore*  \nOptional local PV AND household-load\
      \ forecasts with generation timestamps; missing forecasts never delay fallback.\n\n**Forecast uncertainty\
      \ margin** — current **{{ states('number.thermann_shadow_forecast_uncertainty_margin') }}** · recommended\
      \ & original **0.25** · *restored by Restore*  \nFraction: reduce PV and increase household load.\
      \ 0.25 means 25%; never guaranteed surplus.\n\n**Extra forecast household load** — current **{{\
      \ states('number.thermann_shadow_extra_forecast_household_load') }} kW** · recommended & original\
      \ **0.3 kW** · *restored by Restore*  \nAdditional allowance for competing appliances, beyond forecast\
      \ demand."
  - type: entities
    title: Heating Cycles
    icon: mdi:sync
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_solar_start_qualification
    - number.thermann_shadow_economic_loss_grace_period
    - number.thermann_shadow_minimum_optional_cycle
    - number.thermann_shadow_minimum_optional_cycle_gap
    - number.thermann_shadow_minimum_economic_switching_benefit
  - type: markdown
    content: "### Heating Cycles — current, recommended and original values\n\n**Solar start qualification**\
      \ — current **{{ states('number.thermann_shadow_solar_start_qualification') }} min** · recommended\
      \ & original **10 min** · *restored by Restore*  \nSustained economic advantage on fresh observations\
      \ before a SIMULATED optional start.\n\n**Economic loss grace period** — current **{{ states('number.thermann_shadow_economic_loss_grace_period')\
      \ }} min** · recommended & original **20 min** · *restored by Restore*  \nSustained cost disadvantage\
      \ before a SIMULATED optional stop; short clouds do not stop a cycle.\n\n**Minimum optional cycle**\
      \ — current **{{ states('number.thermann_shadow_minimum_optional_cycle') }} min** · recommended\
      \ & original **30 min** · *restored by Restore*  \nSIMULATION ONLY. Comfort, data gates, owner intervention\
      \ and protections override dwell.\n\n**Minimum optional cycle gap** — current **{{ states('number.thermann_shadow_minimum_optional_cycle_gap')\
      \ }} min** · recommended & original **30 min** · *restored by Restore*  \nSIMULATION ONLY. Comfort\
      \ can start sooner. No physical On/resume contract is qualified.\n\n**Minimum economic switching\
      \ benefit** — current **{{ states('number.thermann_shadow_minimum_economic_switching_benefit') }}\
      \ AUD** · recommended & original **0.1 AUD** · *restored by Restore*  \nWhole remaining-cycle AUD\
      \ advantage, not cents/kWh. Experimental $0.10 may deliberately suppress small savings."
  - type: entities
    title: Advanced
    icon: mdi:tune
    show_header_toggle: false
    state_color: true
    entities:
    - switch.thermann_shadow_pause_shadow_planning
    - switch.thermann_shadow_meter_sign_and_units_verified
    - switch.thermann_shadow_tariff_contract_verified
    - switch.thermann_shadow_positive_grid_means_import
    - select.thermann_shadow_tariff_clock
    - select.thermann_shadow_tariff_periods_mode
    - switch.thermann_shadow_use_peak_periods_on_weekends
    - number.thermann_shadow_off_peak_import_price
    - number.thermann_shadow_peak_import_price
    - number.thermann_shadow_shoulder_import_price
    - number.thermann_shadow_export_compensation
    - number.thermann_shadow_maximum_forecast_generation_age
    - number.thermann_shadow_recent_export_scenario_horizon
    - number.thermann_shadow_maximum_cloud_poll_age
    - number.thermann_shadow_maximum_power_reading_age
    - number.thermann_shadow_expected_native_target
    - select.thermann_shadow_native_schedule_clock_reference
    - switch.thermann_shadow_native_clock_checked
    - number.thermann_shadow_t_comfort_reference
    - text.thermann_shadow_native_clock_check_date
    - time.thermann_shadow_peak_morning_start
    - time.thermann_shadow_peak_morning_end
    - time.thermann_shadow_peak_evening_start
    - time.thermann_shadow_peak_evening_end
  - type: markdown
    content: "### Advanced — current, recommended and original values\n\n**Pause shadow planning** — current\
      \ **{{ states('switch.thermann_shadow_pause_shadow_planning') }}** · recommended & original **Off**\
      \ · *kept by Restore*  \nPauses only hypothetical decisions; native Schedule continues.\n\n**Meter\
      \ sign and units verified** — current **{{ states('switch.thermann_shadow_meter_sign_and_units_verified')\
      \ }}** · recommended & original **On** · *kept by Restore*  \nOwner verification, not an optimisation\
      \ preference. Restore recommendations preserves this flag.\n\n**Tariff contract verified** — current\
      \ **{{ states('switch.thermann_shadow_tariff_contract_verified') }}** · recommended & original **On**\
      \ · *kept by Restore*  \nOwner confirmation of rates, periods and clock. Restore preserves this\
      \ flag.\n\n**Positive grid means import** — current **{{ states('switch.thermann_shadow_positive_grid_means_import')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nOFF means export-positive HK1000.\
      \ Never change without a load test; restore preserves direction.\n\n**Tariff clock** — current **{{\
      \ states('select.thermann_shadow_tariff_clock') }}** · recommended & original **standard** · *kept\
      \ by Restore*  \nConfirmed Aurora 93 uses standard (fixed AEST UTC+10), automatically one hour later\
      \ in Hobart summer.\n\n**Tariff periods mode** — current **{{ states('select.thermann_shadow_tariff_periods_mode')\
      \ }}** · recommended & original **aurora_93** · *kept by Restore*  \naurora_93 uses editable weekday\
      \ peak times below; custom retains advanced weekly JSON periods in Configure.\n\n**Use peak periods\
      \ on weekends** — current **{{ states('switch.thermann_shadow_use_peak_periods_on_weekends') }}**\
      \ · recommended & original **Off** · *kept by Restore*  \nOFF for confirmed Aurora 93, all weekend\
      \ off-peak.\n\n**Off-peak import price** — current **{{ states('number.thermann_shadow_off_peak_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh from your\
      \ contract; includes all grid energy in the 3kW scenario.\n\n**Peak import price** — current **{{\
      \ states('number.thermann_shadow_peak_import_price') }} AUD/kWh** · recommended & original **0.361878\
      \ AUD/kWh** · *kept by Restore*  \nAUD/kWh; actual clock boundaries affect every candidate minute.\n\
      \n**Shoulder import price** — current **{{ states('number.thermann_shadow_shoulder_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nUsed only by custom\
      \ weekly periods with shoulder entries.\n\n**Export compensation** — current **{{ states('number.thermann_shadow_export_compensation')\
      \ }} AUD/kWh** · recommended & original **0.09276 AUD/kWh** · *kept by Restore*  \nForegone feed-in\
      \ revenue counts as a cost of solar self-consumption.\n\n**Maximum forecast generation age** — current\
      \ **{{ states('number.thermann_shadow_maximum_forecast_generation_age') }} min** · recommended &\
      \ original **120 min** · *restored by Restore*  \nRequire real generation time; republishing an\
      \ old forecast does not freshen it.\n\n**Recent-export scenario horizon** — current **{{ states('number.thermann_shadow_recent_export_scenario_horizon')\
      \ }} min** · recommended & original **15 min** · *restored by Restore*  \nBounded assumption for\
      \ current export, never a daily forecast or guaranteed solar.\n\n**Maximum cloud poll age** — current\
      \ **{{ states('number.thermann_shadow_maximum_cloud_poll_age') }} min** · recommended & original\
      \ **45 min** · *restored by Restore*  \nOnly local freshness gate; does not alter bridge polling\
      \ or issue refresh requests.\n\n**Maximum power reading age** — current **{{ states('number.thermann_shadow_maximum_power_reading_age')\
      \ }} s** · recommended & original **120 s** · *restored by Restore*  \nMissing/stale observations\
      \ reset economic holds; no cloud calls.\n\n**Expected native target** — current **{{ states('number.thermann_shadow_expected_native_target')\
      \ }} °C** · recommended & original **70 °C** · *kept by Restore*  \nReference only. Different observed\
      \ mode/target latches intervention; never sets the heater.\n\n**Native schedule clock reference**\
      \ — current **{{ states('select.thermann_shadow_native_schedule_clock_reference') }}** · recommended\
      \ & original **local** · *kept by Restore*  \nReference only; never adjusts the device clock or\
      \ native Schedule.\n\n**Native clock checked** — current **{{ states('switch.thermann_shadow_native_clock_checked')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nOwner observation only; restore preserves\
      \ this verification.\n\n**T-Comfort reference** — current **{{ states('number.thermann_shadow_t_comfort_reference')\
      \ }} °C** · recommended & original **10 °C** · *kept by Restore*  \nReference only; 10°C is not\
      \ a useful comfort reserve. Never changes T-Comfort.\n\n**Native clock check date** — current **{{\
      \ states('text.thermann_shadow_native_clock_check_date') }}** · recommended & original **blank /\
      \ unknown** · *kept by Restore*  \nOwner check date YYYY-MM-DD, blank if unknown; reference only.\n\
      \n**Peak morning start** — current **{{ states('time.thermann_shadow_peak_morning_start') }}** ·\
      \ recommended & original **07:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort\
      \ time. Must be increasing: morning start/end, evening start/end.\n\n**Peak morning end** — current\
      \ **{{ states('time.thermann_shadow_peak_morning_end') }}** · recommended & original **10:00** ·\
      \ *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end.\n\n**Peak evening start** — current **{{ states('time.thermann_shadow_peak_evening_start')\
      \ }}** · recommended & original **16:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak evening end**\
      \ — current **{{ states('time.thermann_shadow_peak_evening_end') }}** · recommended & original **21:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end."
  - type: markdown
    content: '### Advanced weekly periods

      Edit in **Configure** (no YAML). Custom tariff periods apply only in custom tariff mode; native
      periods are references, never device writes.

      {% for name, item in (state_attr(''sensor.thermann_shadow_controller'',''advanced_form_settings'')
      or {}).items() %}

      - **{{ name }}** · {{ ''changed from recommended'' if item.changed_from_recommended else ''recommended
      & original'' }}

      {% endfor %}'
  - type: button
    name: Configure mappings & weekly periods
    icon: mdi:cog-outline
    tap_action:
      action: navigate
      navigation_path: /config/integrations/integration/thermann_shadow
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      entity: button.thermann_shadow_restore_recommended_preferences
      name: Restore recommended
      icon: mdi:restore
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_restore_recommended_preferences
        confirmation:
          text: Restore recommended comfort, solar, cycle and freshness preferences? The tariff contract,
            entity mappings, verifications, meter direction, pause state and native references are kept.
            You can undo this once. No heater command is sent.
    - type: button
      entity: button.thermann_shadow_undo_last_restore
      name: Undo last restore
      icon: mdi:undo-variant
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_undo_last_restore
        confirmation:
          text: Put back the preferences replaced by the last restore?
- title: Diagnostics
  path: diagnostics
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: '## Shadow mode

      **Commands disabled · control capable: {{ state_attr(''sensor.thermann_shadow_controller'',''control_capable'')
      }} · extra cloud requests: {{ state_attr(''sensor.thermann_shadow_controller'',''additional_cloud_requests'')
      }}**. Physical heating is **unverified**; simulated cycles never prove element power.'
  - type: entities
    title: Measured inputs (actual)
    entities:
    - sensor.thermann_shadow_bottom_temperature
    - sensor.thermann_shadow_reported_target
    - sensor.thermann_shadow_measured_signed_grid
    - sensor.thermann_shadow_derived_net_export
    - sensor.thermann_shadow_measured_pv
    - sensor.thermann_shadow_measured_house_load
    - sensor.thermann_shadow_cloud_health
    - sensor.thermann_shadow_status_age
    - sensor.thermann_shadow_observed_request_attempts
    - sensor.thermann_shadow_observed_requests_per_hour
  - type: entities
    title: Forecast and simulation (estimates)
    entities:
    - sensor.thermann_shadow_forecast_age
    - sensor.thermann_shadow_forecast_net_surplus
    - sensor.thermann_shadow_simulated_cycle_state
    - sensor.thermann_shadow_simulated_cycle_count
    - sensor.thermann_shadow_simulated_stop_count
    - sensor.thermann_shadow_suppressed_switching_episodes
    - sensor.thermann_shadow_simulated_session_cost
    - sensor.thermann_shadow_scenario_cost_difference
    - sensor.thermann_shadow_modelled_energy_shortfall
    - sensor.thermann_shadow_latest_continuous_heating_start
    - sensor.thermann_shadow_comfort_deadline
    - sensor.thermann_shadow_configured_afternoon_peak
    - sensor.thermann_shadow_controller
  - type: entities
    title: Native heater references
    entities:
    - sensor.thermann_shadow_reported_schedule_window
    - sensor.thermann_shadow_t_comfort_reference
    - sensor.thermann_shadow_device_clock_check
  - type: markdown
    content: '### Forecast

      {% set f = state_attr(''sensor.thermann_shadow_controller'',''forecast'') or {} %}- Source: **{{
      f.source }}** · load basis: {{ f.load_basis }}

      - Age: {{ f.age_minutes }} min · intervals: {{ f.intervals }}

      - Measured PV (15-min mean): {{ f.measured_pv_average_kw }} kW · error vs forecast: {{ f.pv_error_kw
      }} kW

      - Correction now: {{ f.pv_correction_now }} (fades to none after {{ f.pv_correction_fades_to_none_after_hours
      }} h; never increases PV)

      ### Simulated cycle

      {% set c = state_attr(''sensor.thermann_shadow_controller'',''cycle'') or {} %}{% for key, value
      in c.items() %}- {{ key }}: {{ value }}

      {% endfor %}'
  - type: markdown
    content: '### Reasons

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''reasons'') or [] %}- {{ item }}

      {% endfor %}### Warnings and assumptions

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''warnings'') or [] %}- {{ item
      }}

      {% endfor %}### Hypothetical windows (local time)

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''windows'') or [] %}- {{ as_timestamp(item.start)
      | timestamp_custom(''%a %H:%M'') }} → {{ as_timestamp(item.end) | timestamp_custom(''%H:%M'') }}
      · {{ item.source }}

      {% endfor %}

      Native clock: compare manually with Hobart {{ now().strftime(''%a %d %b %H:%M'') }} after DST changes.
      Tariff 93 stays fixed AEST. 30-minute cloud polls can include status→refresh→replay (3 attempts);
      the planner adds zero requests.'
