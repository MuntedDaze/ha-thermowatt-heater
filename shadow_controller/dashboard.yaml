title: Thermann Hot Water
views:
- title: Hot Water
  path: thermann-shadow
  icon: mdi:water-boiler
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Automatic control
      icon: mdi:robot
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.thermann_shadow_automatic_control_state'') %}{% set kind =
        {''fault_locked'':''error'',''owner_override'':''warning'',''confirming'':''info'',''disabled'':''info''}.get(s,
        ''success'') %}<ha-alert alert-type="{{ kind }}"><b>{{ s | replace(''_'', '' '') | upper }}</b>
        — {{ states(''sensor.thermann_shadow_automatic_control_reason'') | replace(''_'', '' '') }}</ha-alert>

        {{ state_attr(''sensor.thermann_shadow_automatic_control_state'', ''recovery_guidance'') or ''''
        }}


        {% set missing = state_attr(''switch.thermann_shadow_automatic_heater_control'', ''commissioning_missing'')
        %}{% if missing %}Commissioning still needed: {{ missing | join('', '') | replace(''_'', '' '')
        }}. The controller cannot send any command until these are done.{% endif %}'
    - type: tile
      entity: switch.thermann_shadow_automatic_heater_control
      icon: mdi:robot
      name: Automatic heater control
    - type: entities
      title: Controller status
      show_header_toggle: false
      entities:
      - sensor.thermann_shadow_automatic_control_state
      - sensor.thermann_shadow_automatic_control_reason
      - sensor.thermann_shadow_thermann_mode
      - sensor.thermann_shadow_thermann_target
      - sensor.thermann_shadow_next_intended_action
      - sensor.thermann_shadow_next_heating_start
      - sensor.thermann_shadow_next_heating_stop
      - sensor.thermann_shadow_last_command
      - sensor.thermann_shadow_last_command_result
      - sensor.thermann_shadow_last_command_time
      - sensor.thermann_shadow_commands_in_last_24_hours
      - sensor.thermann_shadow_cloud_requests_in_last_24_hours
      - sensor.thermann_shadow_controller_fault
    - type: button
      entity: button.thermann_shadow_hold_heater_owner_override
      name: Hold heater
      icon: mdi:hand-back-left
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_hold_heater_owner_override
        confirmation:
          text: 'Hold: automatic control will send NO further commands until you press Resume. The heater
            stays in its current mode; change it yourself in the Thermann app.'
    - type: button
      entity: button.thermann_shadow_resume_automatic_control
      name: Resume control
      icon: mdi:play-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_resume_automatic_control
        confirmation:
          text: Resume automatic control? It first re-reads the heater from a NEW bridge status and only
            continues if the heater is in Schedule or Manual at 70 °C.
    - type: button
      entity: button.thermann_shadow_acknowledge_controller_fault
      name: Acknowledge fault
      icon: mdi:check-decagram
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_acknowledge_controller_fault
        confirmation:
          text: Acknowledge the fault? Check the Thermann app first. The controller re-inspects the heater
            from a new status; nothing is re-sent.
  - type: grid
    cards:
    - type: heading
      heading: Right now
      icon: mdi:water-boiler
    - type: markdown
      text_only: true
      content: '{% set code = states(''sensor.thermann_shadow_decision_code'') %}{% set kind = {"heat_now_cheapest":
        "success", "heat_now_saving_too_small": "success", "heat_now_comfort_fallback": "warning", "native_heating_economical":
        "success", "native_heating_costlier_than_waiting": "warning", "wait_cheaper_later": "info", "flexible_no_cost_difference":
        "info", "no_heating_needed": "success", "insufficient_time": "error", "data_unavailable": "error",
        "owner_review_required": "warning", "paused": "info"}.get(code, ''info'') %}{% set icon = {"heat_now_cheapest":
        "mdi:solar-power-variant", "heat_now_saving_too_small": "mdi:solar-power", "heat_now_comfort_fallback":
        "mdi:transmission-tower", "native_heating_economical": "mdi:water-boiler", "native_heating_costlier_than_waiting":
        "mdi:water-boiler-alert", "wait_cheaper_later": "mdi:weather-sunny", "flexible_no_cost_difference":
        "mdi:clock-outline", "no_heating_needed": "mdi:check-circle-outline", "insufficient_time": "mdi:clock-alert-outline",
        "data_unavailable": "mdi:lan-disconnect", "owner_review_required": "mdi:account-alert-outline",
        "paused": "mdi:pause-circle-outline"}.get(code, ''mdi:water-boiler'') %}

        <ha-alert alert-type="{{ kind }}"><h1><ha-icon icon="{{ icon }}"></ha-icon> {{ states(''sensor.thermann_shadow_recommendation'')
        }}</h1>{{ state_attr(''sensor.thermann_shadow_controller'',''decision_explanation'') or ''Waiting
        for fresh heater and meter readings.'' }}</ha-alert>


        {% if is_state(''switch.thermann_shadow_automatic_heater_control'', ''on'') %}**Automatic control
        is ON.** The controller follows this plan: Manual 70 °C permits heating, the empty Schedule parks
        it; the Thermann thermostat decides when the element runs.{% else %}**Planner only.** Automatic
        control is off, so no heater command is sent.{% endif %}'
    - type: gauge
      entity: sensor.thermann_shadow_bottom_temperature
      name: Tank reading (T_Avg)
      min: 10
      max: 75
      severity:
        red: 10
        yellow: 42
        green: 60
    - type: tile
      entity: sensor.thermann_shadow_heater_element_state
      icon: mdi:heat-wave
    - type: tile
      entity: sensor.thermann_shadow_heater_state_confidence
      icon: mdi:help-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_morning_readiness
      icon: mdi:weather-sunset-up
    - type: tile
      entity: sensor.thermann_shadow_afternoon_readiness
      icon: mdi:water-thermometer
    - type: tile
      entity: sensor.thermann_shadow_morning_ready_deadline
      icon: mdi:alarm
    - type: tile
      entity: sensor.thermann_shadow_afternoon_ready_deadline
      icon: mdi:alarm
  - type: grid
    cards:
    - type: heading
      heading: Heat now or later?
      icon: mdi:scale-balance
    - type: tile
      entity: sensor.thermann_shadow_continuous_cycle_cost_now
      icon: mdi:cash-fast
    - type: tile
      entity: sensor.thermann_shadow_continuous_cycle_cost_later
      icon: mdi:cash-check
    - type: tile
      entity: sensor.thermann_shadow_saving_by_waiting
      icon: mdi:piggy-bank-outline
    - type: tile
      entity: sensor.thermann_shadow_decision_confidence
      icon: mdi:shield-check-outline
    - type: tile
      entity: sensor.thermann_shadow_hypothetical_heating_start
      icon: mdi:play-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_simulated_completion
      icon: mdi:clock-check-outline
    - type: tile
      entity: sensor.thermann_shadow_native_schedule_predicted_cost
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.thermann_shadow_native_schedule_extra_cost_vs_best_plan
      icon: mdi:calendar-alert
    - type: markdown
      content: 'Costs are the **extra** electricity cost of heating, including **foregone feed-in**, for
        the same required energy. The 3 kW element is never treated as variable power; the real heater''s
        load is removed from household demand once. *Start and completion are hypothetical: the native
        Schedule controls the heater.*'
  - type: grid
    cards:
    - type: heading
      heading: Energy & tariff
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_pv_ac_output
      icon: mdi:solar-power
    - type: tile
      entity: sensor.thermann_shadow_base_household_load_excluding_hot_water
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_hypothetical_solar_surplus_if_heater_off
      icon: mdi:solar-panel
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_export
      icon: mdi:transmission-tower-export
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_import
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.thermann_shadow_current_tariff
      icon: mdi:tag-outline
    - type: tile
      entity: sensor.thermann_shadow_current_tariff_rate
      icon: mdi:currency-usd
    - type: tile
      entity: sensor.thermann_shadow_next_tariff_change
      icon: mdi:timer-outline
    - type: tile
      entity: sensor.thermann_shadow_forecast_net_surplus
      icon: mdi:weather-sunny
    - type: tile
      entity: sensor.thermann_shadow_forecast_age
      icon: mdi:update
  - type: grid
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: history-graph
      title: Tank reading and heater state · 24 h
      hours_to_show: 24
      entities:
      - sensor.thermann_shadow_bottom_temperature
      - sensor.thermann_shadow_heater_element_state
    - type: history-graph
      title: Solar, house and grid · 12 h (kW)
      hours_to_show: 12
      entities:
      - sensor.thermann_shadow_measured_pv_ac_output
      - sensor.thermann_shadow_measured_house_load
      - sensor.thermann_shadow_base_household_load_excluding_hot_water
      - sensor.thermann_shadow_measured_signed_grid
- title: Settings
  path: settings
  icon: mdi:cog
  cards:
  - type: markdown
    content: '# Hot-water preferences

      **Local shadow settings only.** These controls and the integration''s Configure dialog edit **one**
      saved configuration. Changes are validated together (an invalid change saves nothing), recalculate
      locally at once and never contact Thermann, restart the heater or change the native Schedule or
      T-Comfort. Recommended values are experimental starting points, not manufacturer limits.'
  - type: entities
    title: Comfort
    icon: mdi:home-thermometer
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_morning_comfort_threshold
    - time.thermann_shadow_morning_deadline
    - switch.thermann_shadow_use_earlier_weekday_shower_time
    - time.thermann_shadow_weekday_shower_ready_time
    - number.thermann_shadow_expected_morning_hot_water_use
    - number.thermann_shadow_afternoon_storage_target
    - time.thermann_shadow_afternoon_comfort_preference
    - number.thermann_shadow_heating_time_allowance
  - type: markdown
    content: "### Comfort — current, recommended and original values\n\n**Morning comfort threshold**\
      \ — current **{{ states('number.thermann_shadow_morning_comfort_threshold') }} °C** · recommended\
      \ **42 °C** · original **40 °C** · *restored by Restore*  \nRequired reading (T_Avg) before the\
      \ morning peak starts: 07:00 standard time, 08:00 daylight time on weekdays. A planning threshold,\
      \ NEVER a heater setpoint or hygiene temperature.\n\n**Morning deadline** — current **{{ states('time.thermann_shadow_morning_deadline')\
      \ }}** · recommended **08:00** · original **07:00** · *restored by Restore*  \nWeekend (no-peak)\
      \ morning ready time, Hobart local, before noon. Weekdays use the actual morning peak start automatically.\n\
      \n**Use earlier weekday shower time** — current **{{ states('switch.thermann_shadow_use_earlier_weekday_shower_time')\
      \ }}** · recommended & original **Off** · *restored by Restore*  \nON makes weekday mornings ready\
      \ by the shower time below if it is earlier than the peak start. Never later.\n\n**Weekday shower-ready\
      \ time** — current **{{ states('time.thermann_shadow_weekday_shower_ready_time') }}** · recommended\
      \ & original **07:00** · *restored by Restore*  \nHobart local, before noon. Only used when the\
      \ switch above is ON.\n\n**Expected morning hot-water use** — current **{{ states('number.thermann_shadow_expected_morning_hot_water_use')\
      \ }} °C** · recommended & original **10 °C** · *restored by Restore*  \nReading drop assumed for\
      \ morning showers when planning the afternoon target. An assumption (about 11 °C was seen on 11\
      \ Nov), not a measurement.\n\n**Afternoon storage target** — current **{{ states('number.thermann_shadow_afternoon_storage_target')\
      \ }} °C** · recommended & original **70 °C** · *restored by Restore*  \nSelected model target is\
      \ never silently reduced. 65–70°C is a planning range, not a newly qualified command limit.\n\n\
      **Afternoon comfort preference** — current **{{ states('time.thermann_shadow_afternoon_comfort_preference')\
      \ }}** · recommended & original **16:00** · *restored by Restore*  \nWeekend (no-peak) afternoon\
      \ ready time, Hobart local, after noon. Weekdays use the evening peak start automatically: 16:00\
      \ standard time, 17:00 daylight time.\n\n**Heating time allowance** — current **{{ states('number.thermann_shadow_heating_time_allowance')\
      \ }} min** · recommended & original **30 min** · *restored by Restore*  \nExtra full-power model\
      \ minutes when heat is required. Uncalibrated; comfort overrides optional dwell."
  - type: entities
    title: Solar & Forecasting
    icon: mdi:solar-power
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_minimum_useful_net_surplus
    - number.thermann_shadow_solar_headroom
    - switch.thermann_shadow_use_published_forecasts
    - number.thermann_shadow_forecast_uncertainty_margin
    - number.thermann_shadow_extra_forecast_household_load
    - number.thermann_shadow_inverter_ac_output_limit
    - select.thermann_shadow_household_load_basis
  - type: markdown
    content: "### Solar & Forecasting — current, recommended and original values\n\n**Minimum useful net\
      \ surplus** — current **{{ states('number.thermann_shadow_minimum_useful_net_surplus') }} kW** ·\
      \ recommended & original **0.1 kW** · *restored by Restore*  \nPartial solar can be worthwhile.\
      \ Economic comparison must also pass; never a variable-power command.\n\n**Solar headroom** — current\
      \ **{{ states('number.thermann_shadow_solar_headroom') }} kW** · recommended & original **0.3 kW**\
      \ · *restored by Restore*  \nDeduct from measured surplus for uncertain household loads.\n\n**Use\
      \ published forecasts** — current **{{ states('switch.thermann_shadow_use_published_forecasts')\
      \ }}** · recommended & original **Off** · *restored by Restore*  \nOptional local PV AND household-load\
      \ forecasts with generation timestamps; missing forecasts never delay fallback.\n\n**Forecast uncertainty\
      \ margin** — current **{{ states('number.thermann_shadow_forecast_uncertainty_margin') }}** · recommended\
      \ & original **0.25** · *restored by Restore*  \nFraction: reduce PV and increase household load.\
      \ 0.25 means 25%; never guaranteed surplus.\n\n**Extra forecast household load** — current **{{\
      \ states('number.thermann_shadow_extra_forecast_household_load') }} kW** · recommended & original\
      \ **0.3 kW** · *restored by Restore*  \nAdditional allowance for competing appliances, beyond forecast\
      \ demand.\n\n**Inverter AC output limit** — current **{{ states('number.thermann_shadow_inverter_ac_output_limit')\
      \ }} kW** · recommended & original **5 kW** · *restored by Restore*  \nCombined AC limit of the\
      \ single GoodWe inverter for BOTH arrays; forecasts above it are clipped.\n\n**Household load basis**\
      \ — current **{{ states('select.thermann_shadow_household_load_basis') }}** · recommended & original\
      \ **measured_only** · *restored by Restore*  \nmeasured_only: de-embedded measured base load (heater\
      \ removed). measured_then_published also uses the published load forecast after 2 h; today's EMHASS\
      \ load includes heater cycles."
  - type: entities
    title: Heating Cycles
    icon: mdi:sync
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_solar_start_qualification
    - number.thermann_shadow_economic_loss_grace_period
    - number.thermann_shadow_minimum_optional_cycle
    - number.thermann_shadow_minimum_optional_cycle_gap
    - number.thermann_shadow_minimum_economic_switching_benefit
    - number.thermann_shadow_minimum_saving_to_recommend_waiting
  - type: markdown
    content: "### Heating Cycles — current, recommended and original values\n\n**Solar start qualification**\
      \ — current **{{ states('number.thermann_shadow_solar_start_qualification') }} min** · recommended\
      \ & original **10 min** · *restored by Restore*  \nSustained economic advantage on fresh observations\
      \ before a SIMULATED optional start.\n\n**Economic loss grace period** — current **{{ states('number.thermann_shadow_economic_loss_grace_period')\
      \ }} min** · recommended & original **20 min** · *restored by Restore*  \nSustained cost disadvantage\
      \ before a SIMULATED optional stop; short clouds do not stop a cycle.\n\n**Minimum optional cycle**\
      \ — current **{{ states('number.thermann_shadow_minimum_optional_cycle') }} min** · recommended\
      \ & original **30 min** · *restored by Restore*  \nSIMULATION ONLY. Comfort, data gates, owner intervention\
      \ and protections override dwell.\n\n**Minimum optional cycle gap** — current **{{ states('number.thermann_shadow_minimum_optional_cycle_gap')\
      \ }} min** · recommended & original **30 min** · *restored by Restore*  \nSIMULATION ONLY. Comfort\
      \ can start sooner. No physical On/resume contract is qualified.\n\n**Minimum economic switching\
      \ benefit** — current **{{ states('number.thermann_shadow_minimum_economic_switching_benefit') }}\
      \ AUD** · recommended & original **0.1 AUD** · *restored by Restore*  \nFUTURE CONTROL ONLY: minimum\
      \ benefit per heater switch. The 0.4.0 advisor uses the per-kWh waiting threshold instead.\n\n**Minimum\
      \ saving to recommend waiting** — current **{{ states('number.thermann_shadow_minimum_saving_to_recommend_waiting')\
      \ }} AUD/kWh** · recommended & original **0.05 AUD/kWh** · *restored by Restore*  \nWaiting is only\
      \ recommended if it saves at least this much per kWh that would otherwise be heated now (first minimum\
      \ cycle; 0.05 = 7.5 c for 30 min) and the comfort fallback stays viable. Solar later vs off-peak\
      \ grid now is 7.7 c/kWh."
  - type: entities
    title: Controller
    icon: mdi:robot
    show_header_toggle: false
    state_color: true
    entities:
    - text.thermann_shadow_controller_command_topic
    - switch.thermann_shadow_empty_schedule_park_confirmed
    - switch.thermann_shadow_bridge_commands_qualified_t3
    - number.thermann_shadow_minimum_heating_period
    - number.thermann_shadow_minimum_rest_period
    - number.thermann_shadow_maximum_commands_per_day
    - number.thermann_shadow_command_confirmation_timeout
    - number.thermann_shadow_cloud_request_budget_per_day
    - number.thermann_shadow_execution_latency_reserve
    - text.thermann_shadow_notification_service
  - type: markdown
    content: "### Controller — current, recommended and original values\n\n**Controller command topic**\
      \ — current **{{ states('text.thermann_shadow_controller_command_topic') }}** · recommended & original\
      \ **blank / unknown** · *kept by Restore*  \nCommissioning: the Thermowatt MQTT mode command topic\
      \ for your heater, exactly as written in the commissioning runbook (Stage B). Blank = the controller\
      \ can never command.\n\n**Empty Schedule park confirmed** — current **{{ states('switch.thermann_shadow_empty_schedule_park_confirmed')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nCommissioning Stage C: ON only after\
      \ you have saved an EMPTY weekly programme in the Thermann app (all days, no heating times) and\
      \ recorded the old one. Schedule is then the parked state.\n\n**Bridge commands qualified (T3)**\
      \ — current **{{ states('switch.thermann_shadow_bridge_commands_qualified_t3') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nCommissioning Stage B: ON only after the supervised\
      \ T3 test showed the bridge's Manual:70 and Auto reproduce the app results. Requires Thermowatt\
      \ add-on 1.3.9 or later.\n\n**Minimum heating period** — current **{{ states('number.thermann_shadow_minimum_heating_period')\
      \ }} min** · recommended & original **30 min** · *restored by Restore*  \nShortest time Manual (heating\
      \ permitted) is kept before parking, unless the thermostat has already stopped the element.\n\n\
      **Minimum rest period** — current **{{ states('number.thermann_shadow_minimum_rest_period') }} min**\
      \ · recommended & original **30 min** · *restored by Restore*  \nShortest time parked before heating\
      \ is permitted again.\n\n**Maximum commands per day** — current **{{ states('number.thermann_shadow_maximum_commands_per_day')\
      \ }}** · recommended & original **6** · *restored by Restore*  \nRolling 24 h limit on mode commands.\
      \ A typical day needs 2 (one heating period) or 4 (morning and afternoon). The last 2 are reserved\
      \ for a comfort start and its park.\n\n**Command confirmation timeout** — current **{{ states('number.thermann_shadow_command_confirmation_timeout')\
      \ }} min** · recommended & original **65 min** · *restored by Restore*  \nIf no status confirms\
      \ a command within this time, automatic control locks until you acknowledge. At least one poll interval\
      \ plus margin.\n\n**Cloud request budget per day** — current **{{ states('number.thermann_shadow_cloud_request_budget_per_day')\
      \ }}** · recommended & original **220** · *restored by Restore*  \nNo command is sent once the bridge's\
      \ local request count over 24 h reaches this. Normal 30-minute polling uses about 150/day.\n\n**Execution\
      \ latency reserve** — current **{{ states('number.thermann_shadow_execution_latency_reserve') }}\
      \ min** · recommended & original **30 min** · *restored by Restore*  \nCommands are sent only right\
      \ after a bridge poll. Comfort deadlines are planned this much earlier so a 30-minute command delay\
      \ cannot cause a miss.\n\n**Notification service** — current **{{ states('text.thermann_shadow_notification_service')\
      \ }}** · recommended & original **blank / unknown** · *kept by Restore*  \nOptional notify service\
      \ name, e.g. mobile_app_phone (without notify.). Blank = Home Assistant notifications only."
  - type: entities
    title: Advanced
    icon: mdi:tune
    show_header_toggle: false
    state_color: true
    entities:
    - number.thermann_shadow_assumed_standing_heat_loss
    - switch.thermann_shadow_pause_shadow_planning
    - switch.thermann_shadow_meter_sign_and_units_verified
    - switch.thermann_shadow_tariff_contract_verified
    - switch.thermann_shadow_positive_grid_means_import
    - select.thermann_shadow_tariff_clock
    - select.thermann_shadow_tariff_periods_mode
    - switch.thermann_shadow_use_peak_periods_on_weekends
    - number.thermann_shadow_off_peak_import_price
    - number.thermann_shadow_peak_import_price
    - number.thermann_shadow_shoulder_import_price
    - number.thermann_shadow_export_compensation
    - number.thermann_shadow_maximum_forecast_generation_age
    - number.thermann_shadow_recent_export_scenario_horizon
    - number.thermann_shadow_maximum_cloud_poll_age
    - number.thermann_shadow_maximum_power_reading_age
    - number.thermann_shadow_expected_native_target
    - select.thermann_shadow_native_schedule_clock_reference
    - switch.thermann_shadow_native_clock_checked
    - number.thermann_shadow_t_comfort_reference
    - text.thermann_shadow_native_clock_check_date
    - time.thermann_shadow_peak_morning_start
    - time.thermann_shadow_peak_morning_end
    - time.thermann_shadow_peak_evening_start
    - time.thermann_shadow_peak_evening_end
  - type: markdown
    content: "### Advanced — current, recommended and original values\n\n**Assumed standing heat loss**\
      \ — current **{{ states('number.thermann_shadow_assumed_standing_heat_loss') }} °C/h** · recommended\
      \ & original **0.2 °C/h** · *restored by Restore*  \nReading drop per hour with no use or heating.\
      \ Not yet measured for this tank.\n\n**Pause shadow planning** — current **{{ states('switch.thermann_shadow_pause_shadow_planning')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nPauses only hypothetical decisions;\
      \ native Schedule continues.\n\n**Meter sign and units verified** — current **{{ states('switch.thermann_shadow_meter_sign_and_units_verified')\
      \ }}** · recommended & original **On** · *kept by Restore*  \nOwner verification, not an optimisation\
      \ preference. Restore recommendations preserves this flag.\n\n**Tariff contract verified** — current\
      \ **{{ states('switch.thermann_shadow_tariff_contract_verified') }}** · recommended & original **On**\
      \ · *kept by Restore*  \nOwner confirmation of rates, periods and clock. Restore preserves this\
      \ flag.\n\n**Positive grid means import** — current **{{ states('switch.thermann_shadow_positive_grid_means_import')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nOFF means export-positive HK1000.\
      \ Never change without a load test; restore preserves direction.\n\n**Tariff clock** — current **{{\
      \ states('select.thermann_shadow_tariff_clock') }}** · recommended & original **standard** · *kept\
      \ by Restore*  \nConfirmed Aurora 93 uses standard (fixed AEST UTC+10), automatically one hour later\
      \ in Hobart summer.\n\n**Tariff periods mode** — current **{{ states('select.thermann_shadow_tariff_periods_mode')\
      \ }}** · recommended & original **aurora_93** · *kept by Restore*  \naurora_93 uses editable weekday\
      \ peak times below; custom retains advanced weekly JSON periods in Configure.\n\n**Use peak periods\
      \ on weekends** — current **{{ states('switch.thermann_shadow_use_peak_periods_on_weekends') }}**\
      \ · recommended & original **Off** · *kept by Restore*  \nOFF for confirmed Aurora 93, all weekend\
      \ off-peak.\n\n**Off-peak import price** — current **{{ states('number.thermann_shadow_off_peak_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh from your\
      \ contract; includes all grid energy in the 3kW scenario.\n\n**Peak import price** — current **{{\
      \ states('number.thermann_shadow_peak_import_price') }} AUD/kWh** · recommended & original **0.361878\
      \ AUD/kWh** · *kept by Restore*  \nAUD/kWh; actual clock boundaries affect every candidate minute.\n\
      \n**Shoulder import price** — current **{{ states('number.thermann_shadow_shoulder_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nUsed only by custom\
      \ weekly periods with shoulder entries.\n\n**Export compensation** — current **{{ states('number.thermann_shadow_export_compensation')\
      \ }} AUD/kWh** · recommended & original **0.09276 AUD/kWh** · *kept by Restore*  \nForegone feed-in\
      \ revenue counts as a cost of solar self-consumption.\n\n**Maximum forecast generation age** — current\
      \ **{{ states('number.thermann_shadow_maximum_forecast_generation_age') }} min** · recommended &\
      \ original **120 min** · *restored by Restore*  \nRequire real generation time; republishing an\
      \ old forecast does not freshen it.\n\n**Recent-export scenario horizon** — current **{{ states('number.thermann_shadow_recent_export_scenario_horizon')\
      \ }} min** · recommended & original **15 min** · *restored by Restore*  \nBounded assumption for\
      \ current export, never a daily forecast or guaranteed solar.\n\n**Maximum cloud poll age** — current\
      \ **{{ states('number.thermann_shadow_maximum_cloud_poll_age') }} min** · recommended & original\
      \ **45 min** · *restored by Restore*  \nOnly local freshness gate; does not alter bridge polling\
      \ or issue refresh requests.\n\n**Maximum power reading age** — current **{{ states('number.thermann_shadow_maximum_power_reading_age')\
      \ }} s** · recommended & original **120 s** · *restored by Restore*  \nMissing/stale observations\
      \ reset economic holds; no cloud calls.\n\n**Expected native target** — current **{{ states('number.thermann_shadow_expected_native_target')\
      \ }} °C** · recommended & original **70 °C** · *kept by Restore*  \nReference only. Different observed\
      \ mode/target latches intervention; never sets the heater.\n\n**Native schedule clock reference**\
      \ — current **{{ states('select.thermann_shadow_native_schedule_clock_reference') }}** · recommended\
      \ & original **local** · *kept by Restore*  \nReference only; never adjusts the device clock or\
      \ native Schedule.\n\n**Native clock checked** — current **{{ states('switch.thermann_shadow_native_clock_checked')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nOwner observation only; restore preserves\
      \ this verification.\n\n**T-Comfort reference** — current **{{ states('number.thermann_shadow_t_comfort_reference')\
      \ }} °C** · recommended & original **10 °C** · *kept by Restore*  \nReference only; 10°C is not\
      \ a useful comfort reserve. Never changes T-Comfort.\n\n**Native clock check date** — current **{{\
      \ states('text.thermann_shadow_native_clock_check_date') }}** · recommended & original **blank /\
      \ unknown** · *kept by Restore*  \nOwner check date YYYY-MM-DD, blank if unknown; reference only.\n\
      \n**Peak morning start** — current **{{ states('time.thermann_shadow_peak_morning_start') }}** ·\
      \ recommended & original **07:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort\
      \ time. Must be increasing: morning start/end, evening start/end.\n\n**Peak morning end** — current\
      \ **{{ states('time.thermann_shadow_peak_morning_end') }}** · recommended & original **10:00** ·\
      \ *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end.\n\n**Peak evening start** — current **{{ states('time.thermann_shadow_peak_evening_start')\
      \ }}** · recommended & original **16:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak evening end**\
      \ — current **{{ states('time.thermann_shadow_peak_evening_end') }}** · recommended & original **21:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end."
  - type: markdown
    content: '### Advanced weekly periods

      Edit in **Configure** (no YAML). Custom tariff periods apply only in custom tariff mode; native
      periods are references, never device writes.

      {% for name, item in (state_attr(''sensor.thermann_shadow_controller'',''advanced_form_settings'')
      or {}).items() %}

      - **{{ name }}** · {{ ''changed from recommended'' if item.changed_from_recommended else ''recommended
      & original'' }}

      {% endfor %}'
  - type: button
    name: Configure mappings & weekly periods
    icon: mdi:cog-outline
    tap_action:
      action: navigate
      navigation_path: /config/integrations/integration/thermann_shadow
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      entity: button.thermann_shadow_restore_recommended_preferences
      name: Restore recommended
      icon: mdi:restore
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_restore_recommended_preferences
        confirmation:
          text: Restore recommended comfort, solar, cycle and freshness preferences? The tariff contract,
            entity mappings, verifications, meter direction, pause state and native references are kept.
            You can undo this once. No heater command is sent.
    - type: button
      entity: button.thermann_shadow_undo_last_restore
      name: Undo last restore
      icon: mdi:undo-variant
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_undo_last_restore
        confirmation:
          text: Put back the preferences replaced by the last restore?
- title: Diagnostics
  path: diagnostics
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: '## Shadow mode

      **Commands disabled · control capable: {{ state_attr(''sensor.thermann_shadow_controller'',''control_capable'')
      }} · extra cloud requests: {{ state_attr(''sensor.thermann_shadow_controller'',''additional_cloud_requests'')
      }}**. Physical heating is estimated, never commanded.'
  - type: markdown
    content: '### Heater state evidence

      {% set h = state_attr(''sensor.thermann_shadow_controller'',''heater_state'') or {} %}- State **{{
      h.state }}** ({{ h.confidence }}) · basis: {{ (h.basis or []) | join('', '') }}

      - WaterHeaterSts raw {{ h.status_raw }} (bit 0 = {{ h.status_bit0 }}; {{ h.status_semantics }})

      - Last 3 kW load step: {{ h.last_load_step }} at {{ h.last_load_step_at }}

      {% set l = state_attr(''sensor.thermann_shadow_controller'',''load'') or {} %}- Base load {{ l.base_low_kw
      }}–{{ l.base_high_kw }} kW (median {{ l.base_p50_kw }}); meter suspect: {{ l.meter_suspect_pre_commissioning_signature
      }}'
  - type: markdown
    content: '### Goals and strategies

      {% for g in state_attr(''sensor.thermann_shadow_controller'',''goals'') or [] %}- {{ g.kind }}:
      {{ g.target_c }} °C by {{ as_timestamp(g.deadline) | timestamp_custom(''%a %H:%M'') }} ({{ g.basis
      }})

      {% endfor %}| Strategy | Start | Cost | Solar |

      |---|---|---:|---:|

      {% for name, p in (state_attr(''sensor.thermann_shadow_controller'',''strategies'') or {}).items()
      %}| {{ name }} | {{ as_timestamp(p.start) | timestamp_custom(''%H:%M'') if p.start else ''—'' }}
      | ${{ p.cost_aud }} | {{ (p.solar_share * 100) | round(0) }}% |

      {% endfor %}'
