    - sensor.thermann_shadow_device_clock_check
  - type: markdown
    content: '## Reasons & warnings

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''reasons'')
      or [] %}

      - {{ item }}

      {% endfor %}

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''warnings'')
      or [] %}

      - {{ item }}

      {% endfor %}

      ### Simulated cycle / forecast

      `{{ state_attr(''sensor.thermann_shadow_controller'',''cycle'') }}`


      `{{ state_attr(''sensor.thermann_shadow_controller'',''forecast'') }}`


      Physical heating is **unverified**. Session counters/ideal energy reset on restart
      or changed preferences; prevented-switching episodes are not a measured command
      saving. No simulation restores or switches the heater. 30-minute cloud polls
      can include status→refresh→replay (3 attempts); 48 cycles does not mean 48 HTTP
      requests or a known quota. The planner adds zero requests.'
  - type: markdown
    content: '### Hypothetical windows

      {% for item in state_attr(''sensor.thermann_shadow_controller'',''windows'')
      or [] %}

      - {{ item.start }} → {{ item.end }} UTC · {{ item.source }}

      {% endfor %}

      Native clock: compare manually with Hobart {{ now().strftime(''%a %d %b %H:%M'')
      }} after DST changes. Tariff 93 remains fixed AEST. T-Comfort 10°C is not a
      usable comfort reserve. Neither Schedule permission nor simulated heating proves
      element power.'
