title: Hot Water
views:
- title: Hot Water
  path: thermann-shadow
  icon: mdi:water-boiler
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Automatic control
      icon: mdi:robot
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.thermann_shadow_automatic_control_state'') %}{% set kind =
        {''fault_locked'':''error'',''owner_override'':''warning'',''confirming'':''info'',''disabled'':''info''}.get(s,
        ''success'') %}<ha-alert alert-type="{{ kind }}"><b>{{ s | replace(''_'', '' '') | upper }}</b>
        — {{ states(''sensor.thermann_shadow_automatic_control_reason'') | replace(''_'', '' '') }}</ha-alert>

        {{ state_attr(''sensor.thermann_shadow_automatic_control_state'', ''recovery_guidance'') or ''''
        }}


        {% set missing = state_attr(''switch.thermann_shadow_automatic_heater_control'', ''commissioning_missing'')
        %}{% if missing %}Commissioning still needed: {{ missing | join('', '') | replace(''_'', '' '')
        }}. The controller cannot send any command until these are done.{% endif %}'
    - type: tile
      entity: switch.thermann_shadow_automatic_heater_control
      icon: mdi:robot
      name: Automatic heater control
    - type: entities
      title: Controller status
      show_header_toggle: false
      entities:
      - sensor.thermann_shadow_automatic_control_state
      - sensor.thermann_shadow_automatic_control_reason
      - sensor.thermann_shadow_thermann_mode
      - sensor.thermann_shadow_thermann_target
      - sensor.thermann_shadow_next_intended_action
      - sensor.thermann_shadow_next_heating_start
      - sensor.thermann_shadow_next_heating_stop
      - sensor.thermann_shadow_last_command
      - sensor.thermann_shadow_last_command_result
      - sensor.thermann_shadow_last_command_time
      - sensor.thermann_shadow_commands_in_last_24_hours
      - sensor.thermann_shadow_cloud_requests_in_last_24_hours
      - sensor.thermann_shadow_controller_fault
    - type: entities
      title: Holiday (dates take effect at 00:00 Hobart)
      show_header_toggle: false
      entities:
      - sensor.thermann_shadow_hot_water_operating_mode
      - date.thermann_shadow_holiday_departure_date
      - date.thermann_shadow_holiday_return_date
      - button.thermann_shadow_cancel_holiday_mode
      - sensor.thermann_shadow_guest_mode_ends
    - type: button
      entity: button.thermann_shadow_hold_heater_owner_override
      name: Hold heater
      icon: mdi:hand-back-left
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_hold_heater_owner_override
        confirmation:
          text: 'Hold: automatic control will send NO further commands until you press Resume. The heater
            stays in its current mode; change it yourself in the Thermann app.'
    - type: button
      entity: button.thermann_shadow_resume_automatic_control
      name: Resume control
      icon: mdi:play-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_resume_automatic_control
        confirmation:
          text: Resume automatic control? It first re-reads the heater from a NEW bridge status and only
            continues if the heater is OFF, Manual 45 °C or Manual 70 °C.
    - type: button
      entity: button.thermann_shadow_acknowledge_controller_fault
      name: Acknowledge fault
      icon: mdi:check-decagram
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_acknowledge_controller_fault
        confirmation:
          text: Acknowledge the fault? Check the Thermann app first. The controller re-inspects the heater
            from a new status; nothing is re-sent.
  - type: grid
    cards:
    - type: heading
      heading: Right now
      icon: mdi:water-boiler
    - type: markdown
      text_only: true
      content: '{% set code = states(''sensor.thermann_shadow_decision_code'') %}{% set kind = {"storage_cheapest_now":
        "success", "storage_until_peak": "success", "storage_latest_start": "warning", "storage_target_may_be_missed":
        "error", "storage_waiting_for_cheaper_window": "info", "storage_paused_for_cheaper_window": "info",
        "storage_target_reached": "success", "storage_within_thermostat_band": "success", "peak_no_grid_heating":
        "info", "peak_ahead_no_qualified_solar": "info", "peak_solar_qualified": "success", "peak_solar_continues":
        "success", "peak_solar_withdrawn": "warning", "peak_meter_unavailable": "error", "peak_command_reserved":
        "info", "solar_opportunity": "success", "solar_opportunity_continues": "success", "solar_opportunity_ended":
        "info", "baseline": "info", "owner_override": "warning", "heater_state_not_controlled": "warning",
        "holiday": "info", "12hr_override": "info", "command_spacing": "info"}.get(code, ''info'') %}{%
        set icon = {"storage_cheapest_now": "mdi:water-boiler", "storage_until_peak": "mdi:water-boiler",
        "storage_latest_start": "mdi:transmission-tower", "storage_target_may_be_missed": "mdi:clock-alert-outline",
        "storage_waiting_for_cheaper_window": "mdi:weather-sunny", "storage_paused_for_cheaper_window":
        "mdi:pause-circle-outline", "storage_target_reached": "mdi:check-circle-outline", "storage_within_thermostat_band":
        "mdi:thermometer-check", "peak_no_grid_heating": "mdi:transmission-tower-off", "peak_ahead_no_qualified_solar":
        "mdi:transmission-tower-off", "peak_solar_qualified": "mdi:solar-power-variant", "peak_solar_continues":
        "mdi:solar-power-variant", "peak_solar_withdrawn": "mdi:weather-cloudy", "peak_meter_unavailable":
        "mdi:lan-disconnect", "peak_command_reserved": "mdi:timer-sand", "solar_opportunity": "mdi:solar-power",
        "solar_opportunity_continues": "mdi:solar-power", "solar_opportunity_ended": "mdi:weather-sunset-down",
        "baseline": "mdi:water-thermometer-outline", "owner_override": "mdi:account-alert-outline", "heater_state_not_controlled":
        "mdi:account-alert-outline", "holiday": "mdi:airplane", "12hr_override": "mdi:account-clock",
        "command_spacing": "mdi:timer-sand"}.get(code, ''mdi:water-boiler'') %}

        <ha-alert alert-type="{{ kind }}"><h1><ha-icon icon="{{ icon }}"></ha-icon> {{ states(''sensor.thermann_shadow_policy_wanted_state'')
        | upper }}</h1>{{ code | replace(''_'', '' '') }} · mode {{ states(''sensor.thermann_shadow_policy_mode'')
        }} · 70 °C reached: {{ states(''sensor.thermann_shadow_storage_target_reached'') }}</ha-alert>


        {% if is_state(''switch.thermann_shadow_automatic_heater_control'', ''on'') %}**Automatic control
        is ON.** The controller applies this policy: OFF, Manual 45 °C or Manual 70 °C; the Thermann thermostat
        decides when the element runs.{% else %}**Shadow observation.** Automatic control is off: the
        policy runs on the observed heater state and nothing is sent. Would send: **{{ states(''sensor.thermann_shadow_shadow_command'')
        }}**.{% endif %}'
    - type: gauge
      entity: sensor.thermann_shadow_bottom_temperature
      name: Tank reading (T_Avg)
      min: 10
      max: 75
      severity:
        red: 10
        yellow: 42
        green: 60
    - type: tile
      entity: sensor.thermann_shadow_heater_element_state
      icon: mdi:heat-wave
    - type: tile
      entity: sensor.thermann_shadow_heater_state_confidence
      icon: mdi:help-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_storage_target_reached
      icon: mdi:thermometer-check
    - type: tile
      entity: sensor.thermann_shadow_heating_time_needed
      icon: mdi:timer-outline
  - type: grid
    cards:
    - type: heading
      heading: Plan before the evening peak
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.thermann_shadow_hypothetical_heating_start
      icon: mdi:play-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_latest_continuous_heating_start
      icon: mdi:clock-alert-outline
    - type: tile
      entity: sensor.thermann_shadow_soft_target_time
      icon: mdi:flag-checkered
    - type: tile
      entity: sensor.thermann_shadow_configured_afternoon_peak
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.thermann_shadow_measured_surplus_excluding_element
      icon: mdi:solar-panel
    - type: tile
      entity: sensor.thermann_shadow_shadow_command
      icon: mdi:eye-outline
    - type: markdown
      content: '**Cheapest window:** the start shown is when EMHASS and the measured surplus make heating
        to 70 °C cheapest while still finishing by the **soft target** (30 minutes before the peak). From
        the **latest start** it heats on off-peak power regardless. The soft target is a planning buffer,
        not a shutdown. In a peak only measured solar (3.3 kW for 10 minutes) may heat. Manual 70 °C is
        the *setpoint*; the tank is reported as reached only at 70 °C.'
  - type: grid
    cards:
    - type: heading
      heading: Energy & tariff
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_pv_ac_output
      icon: mdi:solar-power
    - type: tile
      entity: sensor.thermann_shadow_base_household_load_excluding_hot_water
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_export
      icon: mdi:transmission-tower-export
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_import
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.thermann_shadow_current_tariff
      icon: mdi:tag-outline
    - type: tile
      entity: sensor.thermann_shadow_current_tariff_rate
      icon: mdi:currency-usd
    - type: tile
      entity: sensor.thermann_shadow_next_tariff_change
      icon: mdi:timer-outline
    - type: tile
      entity: sensor.thermann_shadow_forecast_net_surplus
      icon: mdi:weather-sunny
    - type: tile
      entity: sensor.thermann_shadow_forecast_age
      icon: mdi:update
  - type: grid
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: history-graph
      title: Tank reading and heater state · 24 h
      hours_to_show: 24
      entities:
      - sensor.thermann_shadow_bottom_temperature
      - sensor.thermann_shadow_heater_element_state
    - type: history-graph
      title: Solar, house and grid · 12 h (kW)
      hours_to_show: 12
      entities:
      - sensor.thermann_shadow_measured_pv_ac_output
      - sensor.thermann_shadow_measured_house_load
      - sensor.thermann_shadow_base_household_load_excluding_hot_water
      - sensor.thermann_shadow_measured_signed_grid
- title: Settings
  path: settings
  icon: mdi:cog
  cards:
  - type: markdown
    content: '# Hot-water settings

      These controls and **Configure** edit **one** saved configuration. Every change is checked together
      with the rest (an invalid change saves nothing) and applies at once, without a restart. **System**
      settings and the tariff contract can only be changed while Automatic heater control is off. Nothing
      here contacts Thermann or changes the heater''s own settings.'
  - type: entities
    title: Advanced
    icon: mdi:tune
    show_header_toggle: false
    state_color: true
    entities:
    - switch.thermann_shadow_use_published_forecasts
    - number.thermann_shadow_forecast_uncertainty_margin
    - number.thermann_shadow_extra_forecast_household_load
    - select.thermann_shadow_tariff_clock
    - select.thermann_shadow_tariff_periods_mode
    - switch.thermann_shadow_use_peak_periods_on_weekends
    - number.thermann_shadow_off_peak_import_price
    - number.thermann_shadow_peak_import_price
    - number.thermann_shadow_shoulder_import_price
    - number.thermann_shadow_export_compensation
    - number.thermann_shadow_inverter_ac_output_limit
    - number.thermann_shadow_maximum_forecast_generation_age
    - time.thermann_shadow_peak_morning_start
    - time.thermann_shadow_peak_morning_end
    - time.thermann_shadow_peak_evening_start
    - time.thermann_shadow_peak_evening_end
  - type: markdown
    content: "### Advanced — current, recommended and original values\n\n**Use published forecasts** —\
      \ current **{{ states('switch.thermann_shadow_use_published_forecasts') }}** · recommended & original\
      \ **Off** · *restored by Restore*  \nOptional local PV AND household-load forecasts with generation\
      \ timestamps; missing forecasts never delay fallback.\n\n**Forecast uncertainty margin** — current\
      \ **{{ states('number.thermann_shadow_forecast_uncertainty_margin') }}** · recommended & original\
      \ **0.25** · *restored by Restore*  \nFraction: reduce PV and increase household load. 0.25 means\
      \ 25%; never guaranteed surplus.\n\n**Extra forecast household load** — current **{{ states('number.thermann_shadow_extra_forecast_household_load')\
      \ }} kW** · recommended & original **0.3 kW** · *restored by Restore*  \nAdditional allowance for\
      \ competing appliances, beyond forecast demand.\n\n**Tariff clock** — current **{{ states('select.thermann_shadow_tariff_clock')\
      \ }}** · recommended & original **standard** · *kept by Restore*  \nConfirmed Aurora 93 uses standard\
      \ (fixed AEST UTC+10), automatically one hour later in Hobart summer.\n\n**Tariff periods mode**\
      \ — current **{{ states('select.thermann_shadow_tariff_periods_mode') }}** · recommended & original\
      \ **aurora_93** · *kept by Restore*  \naurora_93 uses editable weekday peak times below; custom\
      \ retains advanced weekly JSON periods in Configure.\n\n**Use peak periods on weekends** — current\
      \ **{{ states('switch.thermann_shadow_use_peak_periods_on_weekends') }}** · recommended & original\
      \ **Off** · *kept by Restore*  \nOFF for confirmed Aurora 93, all weekend off-peak.\n\n**Off-peak\
      \ import price** — current **{{ states('number.thermann_shadow_off_peak_import_price') }} AUD/kWh**\
      \ · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh from your contract\
      \ (0-2).\n\n**Peak import price** — current **{{ states('number.thermann_shadow_peak_import_price')\
      \ }} AUD/kWh** · recommended & original **0.361878 AUD/kWh** · *kept by Restore*  \nAUD/kWh from\
      \ your contract (0-2).\n\n**Shoulder import price** — current **{{ states('number.thermann_shadow_shoulder_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh (0-2).\
      \ Used only by custom weekly periods with shoulder entries.\n\n**Export compensation** — current\
      \ **{{ states('number.thermann_shadow_export_compensation') }} AUD/kWh** · recommended & original\
      \ **0.09276 AUD/kWh** · *kept by Restore*  \nForegone feed-in revenue counts as a cost of solar\
      \ self-consumption.\n\n**Inverter AC output limit** — current **{{ states('number.thermann_shadow_inverter_ac_output_limit')\
      \ }} kW** · recommended & original **5 kW** · *restored by Restore*  \nCombined AC limit of the\
      \ single GoodWe inverter for BOTH arrays; forecasts above it are clipped.\n\n**Maximum forecast\
      \ generation age** — current **{{ states('number.thermann_shadow_maximum_forecast_generation_age')\
      \ }} min** · recommended & original **120 min** · *restored by Restore*  \nOlder forecasts are ignored\
      \ (no future solar is assumed). EMHASS publishes every 30 minutes, so at least 35. Republishing\
      \ an old forecast does not freshen it.\n\n**Peak morning start** — current **{{ states('time.thermann_shadow_peak_morning_start')\
      \ }}** · recommended & original **07:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak morning end**\
      \ — current **{{ states('time.thermann_shadow_peak_morning_end') }}** · recommended & original **10:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end.\n\n**Peak evening start** — current **{{ states('time.thermann_shadow_peak_evening_start')\
      \ }}** · recommended & original **16:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak evening end**\
      \ — current **{{ states('time.thermann_shadow_peak_evening_end') }}** · recommended & original **21:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end."
  - type: entities
    title: System
    icon: mdi:shield-check
    show_header_toggle: false
    state_color: true
    entities:
    - switch.thermann_shadow_meter_sign_and_units_verified
    - switch.thermann_shadow_tariff_contract_verified
    - switch.thermann_shadow_positive_grid_means_import
    - number.thermann_shadow_maximum_cloud_poll_age
    - number.thermann_shadow_maximum_power_reading_age
    - text.thermann_shadow_controller_command_topic
    - switch.thermann_shadow_three_state_commands_qualified_1_3_13
    - number.thermann_shadow_maximum_commands_per_day
    - number.thermann_shadow_command_confirmation_timeout
    - number.thermann_shadow_cloud_request_budget_per_day
    - text.thermann_shadow_notification_service
  - type: markdown
    content: "### System — current, recommended and original values\n\n**Meter sign and units verified**\
      \ — current **{{ states('switch.thermann_shadow_meter_sign_and_units_verified') }}** · recommended\
      \ & original **On** · *kept by Restore*  \nOwner verification, not an optimisation preference. Restore\
      \ recommendations preserves this flag.\n\n**Tariff contract verified** — current **{{ states('switch.thermann_shadow_tariff_contract_verified')\
      \ }}** · recommended & original **On** · *kept by Restore*  \nOwner confirmation of rates, periods\
      \ and clock. Restore preserves this flag.\n\n**Positive grid means import** — current **{{ states('switch.thermann_shadow_positive_grid_means_import')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nOFF means export-positive HK1000.\
      \ Never change without a load test; restore preserves direction.\n\n**Maximum cloud poll age** —\
      \ current **{{ states('number.thermann_shadow_maximum_cloud_poll_age') }} min** · recommended &\
      \ original **45 min** · *kept by Restore*  \nPlanner freshness gate for the heater status. Must\
      \ exceed the bridge's 30-minute polling; does not change polling or request a refresh.\n\n**Maximum\
      \ power reading age** — current **{{ states('number.thermann_shadow_maximum_power_reading_age')\
      \ }} s** · recommended & original **120 s** · *kept by Restore*  \nMissing/stale observations reset\
      \ economic holds; no cloud calls.\n\n**Controller command topic** — current **{{ states('text.thermann_shadow_controller_command_topic')\
      \ }}** · recommended & original **blank / unknown** · *kept by Restore*  \nCommissioning: the Thermowatt\
      \ MQTT mode command topic for your heater, exactly as written in the commissioning runbook (Stage\
      \ B). Blank = the controller can never command.\n\n**Three-state commands qualified (1.3.13)** —\
      \ current **{{ states('switch.thermann_shadow_three_state_commands_qualified_1_3_13') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nCommissioning: ON only after the supervised qualification\
      \ of Thermann Hot Water 1.3.13 showed every transition between OFF, Manual 45 °C and Manual 70 °C\
      \ reproduces the app result, and an owner change is refused (COMMISSIONING_SIMPLIFIED.md). Automatic\
      \ control cannot be enabled until it is ON.\n\n**Maximum commands per day** — current **{{ states('number.thermann_shadow_maximum_commands_per_day')\
      \ }}** · recommended & original **6** · *kept by Restore*  \nBackstop: rolling 24 h limit on commands\
      \ that start or change heating. A typical weekday needs 4 commands in all; a switch to OFF (the\
      \ park) is never held back by this limit.\n\n**Command confirmation timeout** — current **{{ states('number.thermann_shadow_command_confirmation_timeout')\
      \ }} min** · recommended & original **65 min** · *kept by Restore*  \nIf no status confirms a command\
      \ within this time, automatic control locks until you acknowledge. At least one poll interval plus\
      \ margin.\n\n**Cloud request budget per day** — current **{{ states('number.thermann_shadow_cloud_request_budget_per_day')\
      \ }}** · recommended & original **220** · *kept by Restore*  \nNo command is sent once the bridge's\
      \ local request count over 24 h reaches this. Normal 30-minute polling uses about 150/day.\n\n**Notification\
      \ service** — current **{{ states('text.thermann_shadow_notification_service') }}** · recommended\
      \ & original **blank / unknown** · *kept by Restore*  \nOptional phone notifications for faults,\
      \ unconfirmed commands and comfort risks: the notify service name only, for example mobile_app_phone\
      \ (no 'notify.' in front). Blank = Home Assistant notifications only."
  - type: markdown
    content: '### Advanced weekly periods

      Edit in **Configure** (no YAML). Custom tariff periods apply only in custom tariff mode; native
      periods are references, never device writes.

      {% for name, item in (state_attr(''sensor.thermann_shadow_controller'',''advanced_form_settings'')
      or {}).items() %}

      - **{{ name }}** · {{ ''changed from recommended'' if item.changed_from_recommended else ''recommended
      & original'' }}

      {% endfor %}'
  - type: button
    name: Configure mappings & weekly periods
    icon: mdi:cog-outline
    tap_action:
      action: navigate
      navigation_path: /config/integrations/integration/thermann_shadow
  - type: grid
    columns: 2
    square: false
    cards:
    - type: button
      entity: button.thermann_shadow_restore_recommended_preferences
      name: Restore recommended
      icon: mdi:restore
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_restore_recommended_preferences
        confirmation:
          text: Restore the recommended comfort, forecast and planning preferences? System settings, the
            tariff contract, sensor mappings and verifications are kept. You can undo this once. No heater
            command is sent.
    - type: button
      entity: button.thermann_shadow_undo_last_restore
      name: Undo last restore
      icon: mdi:undo-variant
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_undo_last_restore
        confirmation:
          text: Put back the preferences replaced by the last restore?
- title: Diagnostics
  path: diagnostics
  icon: mdi:information-outline
  cards:
  - type: markdown
    content: '## Policy

      **Automatic control active: {{ state_attr(''sensor.thermann_shadow_controller'',''controller_active'')
      }} · extra cloud requests: {{ state_attr(''sensor.thermann_shadow_controller'',''additional_cloud_requests'')
      }}**. One coordinated policy; heater commands come from the controller alone (Automatic heater control).
      Thermann Controller is unofficial community software, not a Thermann product.'
  - type: markdown
    content: '### Heater state evidence

      {% set h = state_attr(''sensor.thermann_shadow_controller'',''heater_state'') or {} %}- State **{{
      h.state }}** ({{ h.confidence }}) · basis: {{ (h.basis or []) | join('', '') }}

      - WaterHeaterSts raw {{ h.status_raw }} (bit 0 = {{ h.status_bit0 }}; {{ h.status_semantics }})

      - Base load excluding hot water: {{ states(''sensor.thermann_shadow_base_household_load_excluding_hot_water'')
      }} kW'
  - type: markdown
    content: '### Policy decision

      {% set d = state_attr(''sensor.thermann_shadow_controller'',''policy_plan'') or {} %}- **{{ d.state
      }}** · {{ d.reason }} (layer {{ d.layer }}) · command now: {{ d.command_now }}

      {% for item in (d.shadow_log or [])[-5:] %}- shadow {{ item.at }}: would send **{{ item.would_send
      }}** ({{ item.reason }})

      {% endfor %}'
  - type: entities
    title: Measured inputs (actual)
    entities:
    - sensor.thermann_shadow_bottom_temperature
    - sensor.thermann_shadow_reported_target
    - sensor.thermann_shadow_measured_signed_grid
    - sensor.thermann_shadow_derived_net_export
    - sensor.thermann_shadow_measured_pv
    - sensor.thermann_shadow_measured_pv_ac_output
    - sensor.thermann_shadow_measured_house_load
    - sensor.thermann_shadow_cloud_health
    - sensor.thermann_shadow_status_age
    - sensor.thermann_shadow_observed_request_attempts
    - sensor.thermann_shadow_observed_requests_per_hour
  - type: entities
    title: Policy and plan (not measurements)
    entities:
    - sensor.thermann_shadow_decision_code
    - sensor.thermann_shadow_policy_wanted_state
    - sensor.thermann_shadow_policy_mode
    - sensor.thermann_shadow_next_tariff_period
    - sensor.thermann_shadow_latest_continuous_heating_start
    - sensor.thermann_shadow_hypothetical_heating_start
    - sensor.thermann_shadow_soft_target_time
    - sensor.thermann_shadow_configured_afternoon_peak
    - sensor.thermann_shadow_afternoon_storage_target
    - sensor.thermann_shadow_controller
  - type: markdown
    content: '### Forecast

