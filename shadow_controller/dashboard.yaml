title: Hot Water
views:
- title: Hot Water
  path: thermann-shadow
  icon: mdi:water-boiler
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Automatic control
      icon: mdi:robot
    - type: markdown
      text_only: true
      content: '{% set s = states(''sensor.thermann_shadow_automatic_control_state'') %}{% set kind =
        {''fault_locked'':''error'',''owner_override'':''warning'',''confirming'':''info'',''disabled'':''info''}.get(s,
        ''success'') %}<ha-alert alert-type="{{ kind }}"><b>{{ s | replace(''_'', '' '') | upper }}</b>
        — {{ states(''sensor.thermann_shadow_automatic_control_reason'') | replace(''_'', '' '') }}</ha-alert>

        {{ state_attr(''sensor.thermann_shadow_automatic_control_state'', ''recovery_guidance'') or ''''
        }}


        {% set missing = state_attr(''switch.thermann_shadow_automatic_heater_control'', ''commissioning_missing'')
        %}{% if missing %}Commissioning still needed: {{ missing | join('', '') | replace(''_'', '' '')
        }}. The controller cannot send any command until these are done.{% endif %}'
    - type: tile
      entity: switch.thermann_shadow_automatic_heater_control
      icon: mdi:robot
      name: Automatic heater control
    - type: entities
      title: Controller status
      show_header_toggle: false
      entities:
      - sensor.thermann_shadow_automatic_control_state
      - sensor.thermann_shadow_automatic_control_reason
      - sensor.thermann_shadow_thermann_mode
      - sensor.thermann_shadow_thermann_target
      - sensor.thermann_shadow_next_intended_action
      - sensor.thermann_shadow_next_heating_start
      - sensor.thermann_shadow_next_heating_stop
      - sensor.thermann_shadow_last_command
      - sensor.thermann_shadow_last_command_result
      - sensor.thermann_shadow_last_command_time
      - sensor.thermann_shadow_commands_in_last_24_hours
      - sensor.thermann_shadow_cloud_requests_in_last_24_hours
      - sensor.thermann_shadow_controller_fault
    - type: entities
      title: Holiday (dates take effect at 00:00 Hobart)
      show_header_toggle: false
      entities:
      - sensor.thermann_shadow_hot_water_operating_mode
      - date.thermann_shadow_holiday_departure_date
      - date.thermann_shadow_holiday_return_date
      - button.thermann_shadow_cancel_holiday_mode
      - sensor.thermann_shadow_guest_mode_ends
    - type: button
      entity: button.thermann_shadow_hold_heater_owner_override
      name: Hold heater
      icon: mdi:hand-back-left
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_hold_heater_owner_override
        confirmation:
          text: 'Hold: automatic control will send NO further commands until you press Resume. The heater
            stays in its current mode; change it yourself in the Thermann app.'
    - type: button
      entity: button.thermann_shadow_resume_automatic_control
      name: Resume control
      icon: mdi:play-circle
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_resume_automatic_control
        confirmation:
          text: Resume automatic control? It first re-reads the heater from a NEW bridge status and only
            continues if the heater is OFF, Manual 45 °C or Manual 70 °C.
    - type: button
      entity: button.thermann_shadow_acknowledge_controller_fault
      name: Acknowledge fault
      icon: mdi:check-decagram
      show_state: false
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.thermann_shadow_acknowledge_controller_fault
        confirmation:
          text: Acknowledge the fault? Check the Thermann app first. The controller re-inspects the heater
            from a new status; nothing is re-sent.
  - type: grid
    cards:
    - type: heading
      heading: Right now
      icon: mdi:water-boiler
    - type: markdown
      text_only: true
      content: '{% set code = states(''sensor.thermann_shadow_decision_code'') %}{% set kind = {"storage_cheapest_now":
        "success", "storage_until_peak": "success", "storage_latest_start": "warning", "storage_target_may_be_missed":
        "error", "storage_waiting_for_cheaper_window": "info", "storage_waiting_no_forecast": "warning",
        "storage_paused_for_cheaper_window": "info", "storage_target_reached": "success", "storage_within_thermostat_band":
        "success", "peak_no_grid_heating": "info", "peak_ahead_no_qualified_solar": "info", "peak_solar_qualified":
        "success", "peak_solar_continues": "success", "peak_solar_withdrawn": "warning", "peak_meter_unavailable":
        "error", "peak_command_reserved": "info", "solar_opportunity": "success", "solar_opportunity_continues":
        "success", "solar_opportunity_ended": "info", "baseline": "info", "owner_override": "warning",
        "heater_state_not_controlled": "warning", "holiday": "info", "12hr_override": "info", "command_spacing":
        "info"}.get(code, ''info'') %}{% set icon = {"storage_cheapest_now": "mdi:water-boiler", "storage_until_peak":
        "mdi:water-boiler", "storage_latest_start": "mdi:transmission-tower", "storage_target_may_be_missed":
        "mdi:clock-alert-outline", "storage_waiting_for_cheaper_window": "mdi:weather-sunny", "storage_waiting_no_forecast":
        "mdi:weather-cloudy-alert", "storage_paused_for_cheaper_window": "mdi:pause-circle-outline", "storage_target_reached":
        "mdi:check-circle-outline", "storage_within_thermostat_band": "mdi:thermometer-check", "peak_no_grid_heating":
        "mdi:transmission-tower-off", "peak_ahead_no_qualified_solar": "mdi:transmission-tower-off", "peak_solar_qualified":
        "mdi:solar-power-variant", "peak_solar_continues": "mdi:solar-power-variant", "peak_solar_withdrawn":
        "mdi:weather-cloudy", "peak_meter_unavailable": "mdi:lan-disconnect", "peak_command_reserved":
        "mdi:timer-sand", "solar_opportunity": "mdi:solar-power", "solar_opportunity_continues": "mdi:solar-power",
        "solar_opportunity_ended": "mdi:weather-sunset-down", "baseline": "mdi:water-thermometer-outline",
        "owner_override": "mdi:account-alert-outline", "heater_state_not_controlled": "mdi:account-alert-outline",
        "holiday": "mdi:airplane", "12hr_override": "mdi:account-clock", "command_spacing": "mdi:timer-sand"}.get(code,
        ''mdi:water-boiler'') %}

        <ha-alert alert-type="{{ kind }}"><h1><ha-icon icon="{{ icon }}"></ha-icon> {{ states(''sensor.thermann_shadow_policy_wanted_state'')
        | upper }}</h1>{{ code | replace(''_'', '' '') }} · mode {{ states(''sensor.thermann_shadow_policy_mode'')
        }} · 70 °C reached: {{ states(''sensor.thermann_shadow_storage_target_reached'') }}</ha-alert>


        {% if is_state(''switch.thermann_shadow_automatic_heater_control'', ''on'') %}**Automatic control
        is ON.** The controller applies this policy: OFF, Manual 45 °C or Manual 70 °C; the Thermann thermostat
        decides when the element runs.{% else %}**Shadow observation.** Automatic control is off: the
        policy runs on the observed heater state and nothing is sent. Would send: **{{ states(''sensor.thermann_shadow_shadow_command'')
        }}**.{% endif %}'
    - type: gauge
      entity: sensor.thermann_shadow_bottom_temperature
      name: Tank reading (T_Avg)
      min: 10
      max: 75
      severity:
        red: 10
        yellow: 42
        green: 60
    - type: tile
      entity: sensor.thermann_shadow_heater_element_state
      icon: mdi:heat-wave
    - type: tile
      entity: sensor.thermann_shadow_heater_state_confidence
      icon: mdi:help-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_storage_target_reached
      icon: mdi:thermometer-check
    - type: tile
      entity: sensor.thermann_shadow_heating_time_needed
      icon: mdi:timer-outline
  - type: grid
    cards:
    - type: heading
      heading: Plan before the evening peak
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.thermann_shadow_hypothetical_heating_start
      icon: mdi:play-circle-outline
    - type: tile
      entity: sensor.thermann_shadow_latest_continuous_heating_start
      icon: mdi:clock-alert-outline
    - type: tile
      entity: sensor.thermann_shadow_soft_target_time
      icon: mdi:flag-checkered
    - type: tile
      entity: sensor.thermann_shadow_configured_afternoon_peak
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.thermann_shadow_measured_surplus_excluding_element
      icon: mdi:solar-panel
    - type: tile
      entity: sensor.thermann_shadow_shadow_command
      icon: mdi:eye-outline
    - type: markdown
      content: '**Cheapest window:** the start shown is when EMHASS and the measured surplus make heating
        to 70 °C cheapest while still finishing by the **soft target** (30 minutes before the peak). From
        the **latest start** it heats on off-peak power regardless. The soft target is a planning buffer,
        not a shutdown. In a peak only measured solar (3.3 kW for 10 minutes) may heat. Manual 70 °C is
        the *setpoint*; the tank is reported as reached only at 70 °C.'
  - type: grid
    cards:
    - type: heading
      heading: Energy & tariff
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_pv_ac_output
      icon: mdi:solar-power
    - type: tile
      entity: sensor.thermann_shadow_base_household_load_excluding_hot_water
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_export
      icon: mdi:transmission-tower-export
    - type: tile
      entity: sensor.thermann_shadow_measured_grid_import
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.thermann_shadow_current_tariff
      icon: mdi:tag-outline
    - type: tile
      entity: sensor.thermann_shadow_current_tariff_rate
      icon: mdi:currency-usd
    - type: tile
      entity: sensor.thermann_shadow_next_tariff_change
      icon: mdi:timer-outline
    - type: tile
      entity: sensor.thermann_shadow_forecast_net_surplus
      icon: mdi:weather-sunny
    - type: tile
      entity: sensor.thermann_shadow_forecast_age
      icon: mdi:update
  - type: grid
    cards:
    - type: heading
      heading: History
      icon: mdi:chart-line
    - type: history-graph
      title: Tank reading and heater state · 24 h
      hours_to_show: 24
      entities:
      - sensor.thermann_shadow_bottom_temperature
      - sensor.thermann_shadow_heater_element_state
    - type: history-graph
      title: Solar, house and grid · 12 h (kW)
      hours_to_show: 12
      entities:
      - sensor.thermann_shadow_measured_pv_ac_output
      - sensor.thermann_shadow_measured_house_load
      - sensor.thermann_shadow_base_household_load_excluding_hot_water
      - sensor.thermann_shadow_measured_signed_grid
- title: Settings
  path: settings
  icon: mdi:cog
  cards:
  - type: markdown
    content: '# Hot-water settings

      These controls and **Configure** edit **one** saved configuration. Every change is checked together
      with the rest (an invalid change saves nothing) and applies at once, without a restart. **System**
      settings and the tariff contract can only be changed while Automatic heater control is off. Nothing
      here contacts Thermann or changes the heater''s own settings.'
  - type: entities
    title: Everyday
    icon: mdi:home-thermometer
    show_header_toggle: false
    state_color: true
    entities:
    - select.thermann_shadow_overnight_baseline_temperature
    - select.thermann_shadow_normal_weekday_storage_temperature
    - select.thermann_shadow_optional_solar_storage_temperature
    - switch.thermann_shadow_enable_optional_solar_boost
    - select.thermann_shadow_heating_during_peak_periods
    - number.thermann_shadow_preferred_completion_before_peak
    - time.thermann_shadow_weekday_storage_window_starts
    - time.thermann_shadow_weekday_storage_ready_time_without_peak
    - time.thermann_shadow_return_to_overnight_baseline_without_peak
  - type: markdown
    content: "### Everyday — current, recommended and original values\n\n**Overnight baseline temperature**\
      \ — current **{{ states('select.thermann_shadow_overnight_baseline_temperature') }} °C** · recommended\
      \ & original **45 °C** · *kept by Restore*  \nSupported native thermostat target during permitted\
      \ nights/weekends; does not prove achieved whole-tank temperature or independently establish compliance.\
      \ Follow appliance/plumbing requirements; native protective behaviour is not verified by this software.\n\
      \n**Normal weekday storage temperature** — current **{{ states('select.thermann_shadow_normal_weekday_storage_temperature')\
      \ }} °C** · recommended & original **62 °C** · *kept by Restore*  \nRequired weekday thermostat\
      \ target. Only bridge-supported values; 62 is the economical default.\n\n**Optional solar storage\
      \ temperature** — current **{{ states('select.thermann_shadow_optional_solar_storage_temperature')\
      \ }} °C** · recommended & original **70 °C** · *kept by Restore*  \nUpper optional target, at least\
      \ the normal target. Equal targets avoid a separate top-up.\n\n**Enable optional solar boost** —\
      \ current **{{ states('switch.thermann_shadow_enable_optional_solar_boost') }}** · recommended &\
      \ original **On** · *kept by Restore*  \nAllow extra storage with either a commissioned dedicated\
      \ hot-water circuit meter (CT) or the separately configured experimental CT-free GoodWe grid-meter\
      \ setup. Turning this switch on alone does not start boosting: automatic control must be enabled,\
      \ and measurement, solar surplus, cost, peak-policy and safety checks must all pass. Required storage\
      \ still works without a CT; the separate 12-hour Override is unchanged.\n\n**Heating during peak\
      \ periods** — current **{{ states('select.thermann_shadow_heating_during_peak_periods') }}** · recommended\
      \ & original **Never schedule heating during peak** · *kept by Restore*  \nThe Never option takes\
      \ priority over routine solar opportunities. Solar-only requires fresh verified grid measurements,\
      \ qualified circuit or CT-free operation and all command safeguards. Explicit owner override/native\
      \ protections remain independent.\n\n**Preferred completion before peak** — current **{{ states('number.thermann_shadow_preferred_completion_before_peak')\
      \ }} min** · recommended & original **30 min** · *kept by Restore*  \nSoft planning margin; required\
      \ heating may continue until the hard peak boundary.\n\n**Weekday storage window starts** — current\
      \ **{{ states('time.thermann_shadow_weekday_storage_window_starts') }}** · recommended & original\
      \ **09:00** · *kept by Restore*  \nHousehold local clock. Used for required weekday storage when\
      \ the electricity plan has no peak deadline. Start < ready < baseline return. Not an electrical\
      \ peak or a hygiene guarantee.\n\n**Weekday storage ready time without peak** — current **{{ states('time.thermann_shadow_weekday_storage_ready_time_without_peak')\
      \ }}** · recommended & original **16:00** · *kept by Restore*  \nHousehold local clock. Used for\
      \ required weekday storage when the electricity plan has no peak deadline. Start < ready < baseline\
      \ return. Not an electrical peak or a hygiene guarantee.\n\n**Return to overnight baseline without\
      \ peak** — current **{{ states('time.thermann_shadow_return_to_overnight_baseline_without_peak')\
      \ }}** · recommended & original **21:00** · *kept by Restore*  \nHousehold local clock. Used for\
      \ required weekday storage when the electricity plan has no peak deadline. Start < ready < baseline\
      \ return. Not an electrical peak or a hygiene guarantee."
  - type: entities
    title: Advanced
    icon: mdi:tune
    show_header_toggle: false
    state_color: true
    entities:
    - switch.thermann_shadow_use_published_forecasts
    - number.thermann_shadow_forecast_uncertainty_margin
    - number.thermann_shadow_extra_forecast_household_load
    - select.thermann_shadow_tariff_clock
    - select.thermann_shadow_tariff_periods_mode
    - switch.thermann_shadow_use_peak_periods_on_weekends
    - number.thermann_shadow_off_peak_import_price
    - number.thermann_shadow_peak_import_price
    - number.thermann_shadow_shoulder_import_price
    - number.thermann_shadow_export_compensation
    - number.thermann_shadow_inverter_ac_output_limit
    - number.thermann_shadow_maximum_forecast_generation_age
    - time.thermann_shadow_peak_morning_start
    - time.thermann_shadow_peak_morning_end
    - time.thermann_shadow_peak_evening_start
    - time.thermann_shadow_peak_evening_end
    - number.thermann_shadow_optional_heat_minimum_saving
    - number.thermann_shadow_minimum_saving_to_pause_weekday_heat
    - number.thermann_shadow_tank_capacity
    - number.thermann_shadow_nominal_element_power
    - number.thermann_shadow_expected_useful_fraction_of_extra_solar_heat
    - select.thermann_shadow_household_time_zone
    - number.thermann_shadow_minimum_benefit_of_optional_solar_boost
    - switch.thermann_shadow_weekend_solar_led_normal_storage
    - number.thermann_shadow_weekend_daylight_trigger
    - number.thermann_shadow_weekend_daylight_qualification
    - time.thermann_shadow_weekend_latest_return_to_baseline
    - number.thermann_shadow_weekend_late_day_pv_threshold
    - number.thermann_shadow_weekend_low_pv_ending_delay
    - number.thermann_shadow_wait_after_confirmed_solar_withdrawal
    - number.thermann_shadow_check_hot_water_before_peak
    - number.thermann_shadow_request_peak_off_this_much_early
    - number.thermann_shadow_low_bottom_temperature_warning
    - select.thermann_shadow_cloud_polling_mode
  - type: markdown
    content: "### Advanced — current, recommended and original values\n\n**Use published forecasts** —\
      \ current **{{ states('switch.thermann_shadow_use_published_forecasts') }}** · recommended & original\
      \ **Off** · *kept by Restore*  \nThe EMHASS PV AND household-load forecasts with generation timestamps.\
      \ Optional for basic no-solar tariff control. Settings cannot change while automatic control is\
      \ on. If the forecast is missing, weekday grid heating waits for the latest start instead of starting\
      \ at once, and an alert is raised after an hour.\n\n**Forecast uncertainty margin** — current **{{\
      \ states('number.thermann_shadow_forecast_uncertainty_margin') }}** · recommended & original **0.25**\
      \ · *restored by Restore*  \nFraction: reduce PV and increase household load. 0.25 means 25%; never\
      \ guaranteed surplus.\n\n**Extra forecast household load** — current **{{ states('number.thermann_shadow_extra_forecast_household_load')\
      \ }} kW** · recommended & original **0.3 kW** · *restored by Restore*  \nAdditional allowance for\
      \ competing appliances, beyond forecast demand.\n\n**Tariff clock** — current **{{ states('select.thermann_shadow_tariff_clock')\
      \ }}** · recommended **local** · original **standard** · *kept by Restore*  \nUse your verified\
      \ contract: standard is fixed AEST UTC+10; local is Australia/Hobart with DST. Other time zones\
      \ are not qualified.\n\n**Tariff periods mode** — current **{{ states('select.thermann_shadow_tariff_periods_mode')\
      \ }}** · recommended & original **aurora_93** · *kept by Restore*  \naurora_93 uses editable weekday\
      \ peak times below; custom retains advanced weekly JSON periods in Configure.\n\n**Use peak periods\
      \ on weekends** — current **{{ states('switch.thermann_shadow_use_peak_periods_on_weekends') }}**\
      \ · recommended & original **Off** · *kept by Restore*  \nOFF for confirmed Aurora 93, all weekend\
      \ off-peak.\n\n**Off-peak import price** — current **{{ states('number.thermann_shadow_off_peak_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh from your\
      \ contract (0-2).\n\n**Peak import price** — current **{{ states('number.thermann_shadow_peak_import_price')\
      \ }} AUD/kWh** · recommended & original **0.361878 AUD/kWh** · *kept by Restore*  \nAUD/kWh from\
      \ your contract (0-2).\n\n**Shoulder import price** — current **{{ states('number.thermann_shadow_shoulder_import_price')\
      \ }} AUD/kWh** · recommended & original **0.1702 AUD/kWh** · *kept by Restore*  \nAUD/kWh (0-2).\
      \ Used only by custom weekly periods with shoulder entries.\n\n**Export compensation** — current\
      \ **{{ states('number.thermann_shadow_export_compensation') }} AUD/kWh** · recommended & original\
      \ **0.09276 AUD/kWh** · *kept by Restore*  \nForegone feed-in revenue counts as a cost of solar\
      \ self-consumption.\n\n**Inverter AC output limit** — current **{{ states('number.thermann_shadow_inverter_ac_output_limit')\
      \ }} kW** · recommended & original **5 kW** · *restored by Restore*  \nCombined AC limit of the\
      \ single GoodWe inverter for BOTH arrays; forecasts above it are clipped.\n\n**Maximum forecast\
      \ generation age** — current **{{ states('number.thermann_shadow_maximum_forecast_generation_age')\
      \ }} min** · recommended & original **120 min** · *restored by Restore*  \nOlder forecasts are ignored\
      \ (no future solar is assumed). EMHASS publishes every 30 minutes, so at least 35. Republishing\
      \ an old forecast does not freshen it.\n\n**Peak morning start** — current **{{ states('time.thermann_shadow_peak_morning_start')\
      \ }}** · recommended & original **07:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak morning end**\
      \ — current **{{ states('time.thermann_shadow_peak_morning_end') }}** · recommended & original **10:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end.\n\n**Peak evening start** — current **{{ states('time.thermann_shadow_peak_evening_start')\
      \ }}** · recommended & original **16:00** · *kept by Restore*  \nTariff-clock HH:MM, not Hobart\
      \ comfort time. Must be increasing: morning start/end, evening start/end.\n\n**Peak evening end**\
      \ — current **{{ states('time.thermann_shadow_peak_evening_end') }}** · recommended & original **21:00**\
      \ · *kept by Restore*  \nTariff-clock HH:MM, not Hobart comfort time. Must be increasing: morning\
      \ start/end, evening start/end.\n\n**Optional heat minimum saving** — current **{{ states('number.thermann_shadow_optional_heat_minimum_saving')\
      \ }} AUD/kWh** · recommended & original **0.02 AUD/kWh** · *kept by Restore*  \nMinimum prospective\
      \ saving against off-peak grid, including lost feed-in value. Does not relax measured-power or import\
      \ guards.\n\n**Minimum saving to pause weekday heat** — current **{{ states('number.thermann_shadow_minimum_saving_to_pause_weekday_heat')\
      \ }} AUD** · recommended & original **0.3 AUD** · *kept by Restore*  \nA later window must save\
      \ this much and still fit before the soft target.\n\n**Tank capacity** — current **{{ states('number.thermann_shadow_tank_capacity')\
      \ }} L** · recommended & original **315 L** · *kept by Restore*  \nNominal tank volume for conservative\
      \ energy/time estimates, not measured hot-water availability.\n\n**Nominal element power** — current\
      \ **{{ states('number.thermann_shadow_nominal_element_power') }} kW** · recommended & original **3\
      \ kW** · *kept by Restore*  \nSupported resistive-element planning reference. CT-free operation\
      \ never treats this as verified draw.\n\n**Expected useful fraction of extra solar heat** — current\
      \ **{{ states('number.thermann_shadow_expected_useful_fraction_of_extra_solar_heat') }}** · recommended\
      \ & original **0.9** · *kept by Restore*  \nPlanning assumption 0–1 for extra heat used before the\
      \ next cheap opportunity. Includes a bounded standby-loss allowance. Zero prevents optional boosts;\
      \ not learned evidence.\n\n**Household time zone** — current **{{ states('select.thermann_shadow_household_time_zone')\
      \ }}** · recommended & original **Australia/Hobart** · *kept by Restore*  \nIANA zone; a new installation\
      \ starts from Home Assistant's configured zone. Tariff local/fixed standard basis is separate. Changing\
      \ this requires control disabled.\n\n**Minimum benefit of optional solar boost** — current **{{\
      \ states('number.thermann_shadow_minimum_benefit_of_optional_solar_boost') }} AUD** · recommended\
      \ & original **0.1 AUD** · *kept by Restore*  \nExpected net dollars saved must exceed this per\
      \ boost as well as the existing per-kWh margin; avoids extra commands for trivial benefit.\n\n**Weekend\
      \ solar-led normal storage** — current **{{ states('switch.thermann_shadow_weekend_solar_led_normal_storage')\
      \ }}** · recommended & original **On** · *kept by Restore*  \nUse sustained measured PV to select\
      \ normal storage on weekends. This deliberately allows off-peak grid assistance; it is not solar-only\
      \ heating.\n\n**Weekend daylight trigger** — current **{{ states('number.thermann_shadow_weekend_daylight_trigger')\
      \ }} kW** · recommended & original **0.5 kW** · *kept by Restore*  \nMeasured PV production in kW,\
      \ sustained continuously. 0.5 kW means 500 W; household grid import may supply the remaining element\
      \ demand.\n\n**Weekend daylight qualification** — current **{{ states('number.thermann_shadow_weekend_daylight_qualification')\
      \ }} min** · recommended & original **15 min** · *kept by Restore*  \nMinutes of fresh continuous\
      \ PV reports required before selecting weekend normal storage. Short cloud dips restart qualification.\n\
      \n**Weekend latest return to baseline** — current **{{ states('time.thermann_shadow_weekend_latest_return_to_baseline')\
      \ }}** · recommended & original **18:00** · *kept by Restore*  \nHousehold local clock: return to\
      \ baseline by this time. A sustained measured low-PV condition after noon can end the solar day\
      \ earlier.\n\n**Weekend late-day PV threshold** — current **{{ states('number.thermann_shadow_weekend_late_day_pv_threshold')\
      \ }} kW** · recommended & original **0.2 kW** · *kept by Restore*  \nAfter noon, PV below this kW\
      \ threshold for the full ending delay ends the daylight storage window. A momentary cloud does not.\n\
      \n**Weekend low-PV ending delay** — current **{{ states('number.thermann_shadow_weekend_low_pv_ending_delay')\
      \ }} min** · recommended & original **30 min** · *kept by Restore*  \nContinuous minutes below the\
      \ late-day threshold after noon. Missing readings never vote for sunset; the hard end time still\
      \ bounds the window.\n\n**Wait after confirmed solar withdrawal** — current **{{ states('number.thermann_shadow_wait_after_confirmed_solar_withdrawal')\
      \ }} min** · recommended & original **10 min** · *kept by Restore*  \nMinutes after confirmed withdrawal\
      \ OFF before another optional solar start. Fresh qualification can overlap this wait. Ordinary 15-minute\
      \ command spacing also applies.\n\n**Check hot water before peak** — current **{{ states('number.thermann_shadow_check_hot_water_before_peak')\
      \ }} min** · recommended & original **30 min** · *kept by Restore*  \nMinutes before a configured\
      \ peak to arrange a meaningful status observation and low-water assessment. Tariff-clock/DST conversion\
      \ is automatic.\n\n**Request peak OFF this much early** — current **{{ states('number.thermann_shadow_request_peak_off_this_much_early')\
      \ }} min** · recommended & original **2 min** · *kept by Restore*  \nMinutes reserved for local\
      \ evaluation, cloud command and confirmation before peak. This is not a guaranteed electrical cutoff.\n\
      \n**Low bottom-temperature warning** — current **{{ states('number.thermann_shadow_low_bottom_temperature_warning')\
      \ }} °C** · recommended & original **35 °C** · *kept by Restore*  \nWarn only on a fresh bottom-probe\
      \ reading below this temperature near peak. It is not a thermostat target, whole-tank measurement\
      \ or automatic emergency.\n\n**Cloud polling mode** — current **{{ states('select.thermann_shadow_cloud_polling_mode')\
      \ }}** · recommended & original **existing** · *kept by Restore*  \nKeep existing preserves upgrade\
      \ choices. Smart uses useful decisions and bounded quiet checks; Minimum requests accepts longer\
      \ owner-change detection delays; Fixed 30 minutes retains compatibility."
  - type: entities
    title: System
    icon: mdi:shield-check
    show_header_toggle: false
    state_color: true
    entities:
    - switch.thermann_shadow_meter_sign_and_units_verified
    - switch.thermann_shadow_tariff_contract_verified
    - switch.thermann_shadow_positive_grid_means_import
    - number.thermann_shadow_maximum_cloud_poll_age
    - number.thermann_shadow_maximum_power_reading_age
    - text.thermann_shadow_controller_command_topic
    - switch.thermann_shadow_three_state_commands_qualified_1_3_13
    - number.thermann_shadow_maximum_commands_per_day
    - number.thermann_shadow_command_confirmation_timeout
    - number.thermann_shadow_cloud_request_budget_per_day
    - text.thermann_shadow_notification_service
    - text.thermann_shadow_commissioned_hot_water_power_entity_and_unit
    - switch.thermann_shadow_compare_adaptive_polling_shadow_only
    - number.thermann_shadow_shadow_heating_poll_maximum
    - number.thermann_shadow_shadow_stable_poll_maximum
    - switch.thermann_shadow_four_state_commands_qualified_1_3_14
    - switch.thermann_shadow_send_adaptive_cloud_scheduling_plans
    - switch.thermann_shadow_allow_longer_checks_during_quiet_periods
    - number.thermann_shadow_maximum_time_between_app_change_checks
    - switch.thermann_shadow_use_validated_conservative_learned_heating_rate
    - switch.thermann_shadow_heating_learning_independently_qualified
    - text.thermann_shadow_ct_free_solar_commissioning_record
  - type: markdown
    content: "### System — current, recommended and original values\n\n**Meter sign and units verified**\
      \ — current **{{ states('switch.thermann_shadow_meter_sign_and_units_verified') }}** · recommended\
      \ **Off** · original **On** · *kept by Restore*  \nOwner verification, not an optimisation preference.\
      \ Restore recommendations preserves this flag.\n\n**Tariff contract verified** — current **{{ states('switch.thermann_shadow_tariff_contract_verified')\
      \ }}** · recommended **Off** · original **On** · *kept by Restore*  \nOwner confirmation of rates,\
      \ periods and clock. Restore preserves this flag.\n\n**Positive grid means import** — current **{{\
      \ states('switch.thermann_shadow_positive_grid_means_import') }}** · recommended **On** · original\
      \ **Off** · *kept by Restore*  \nOFF means export-positive. Verify the actual meter with a known\
      \ load; restore preserves direction.\n\n**Maximum cloud poll age** — current **{{ states('number.thermann_shadow_maximum_cloud_poll_age')\
      \ }} min** · recommended & original **45 min** · *kept by Restore*  \nPlanner freshness gate for\
      \ the heater status. Must exceed the bridge's 30-minute polling; does not change polling or request\
      \ a refresh.\n\n**Maximum power reading age** — current **{{ states('number.thermann_shadow_maximum_power_reading_age')\
      \ }} s** · recommended & original **120 s** · *kept by Restore*  \nMissing/stale observations reset\
      \ economic holds; no cloud calls.\n\n**Controller command topic** — current **{{ states('text.thermann_shadow_controller_command_topic')\
      \ }}** · recommended & original **blank / unknown** · *kept by Restore*  \nCommissioning: the Thermowatt\
      \ MQTT mode command topic for your heater, exactly as written in the commissioning runbook (Stage\
      \ B). Blank = the controller can never command.\n\n**Three-state commands qualified (1.3.13)** —\
      \ current **{{ states('switch.thermann_shadow_three_state_commands_qualified_1_3_13') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nCommissioning: ON only after the supervised qualification\
      \ of Thermann Hot Water 1.3.13 showed every transition between OFF, Manual 45 °C and Manual 70 °C\
      \ reproduces the app result, and an owner change is refused (COMMISSIONING_SIMPLIFIED.md). Automatic\
      \ control cannot be enabled until it is ON.\n\n**Maximum commands per day** — current **{{ states('number.thermann_shadow_maximum_commands_per_day')\
      \ }}** · recommended & original **6** · *kept by Restore*  \nRolling 24 h limit for OPTIONAL solar\
      \ starts: none is sent once this many commands have gone out. Essential commands (normal storage,\
      \ baseline maintenance and the 12hr Override 62°C) may go 6 beyond it, so optional solar activity\
      \ cannot consume their reserved capacity; that higher cap still stops a fault that loops. A switch\
      \ to OFF is never held back. A typical weekday needs about 4 commands.\n\n**Command confirmation\
      \ timeout** — current **{{ states('number.thermann_shadow_command_confirmation_timeout') }} min**\
      \ · recommended & original **65 min** · *kept by Restore*  \nIf no status confirms a command within\
      \ this time, automatic control locks until you acknowledge. At least one poll interval plus margin.\n\
      \n**Cloud request budget per day** — current **{{ states('number.thermann_shadow_cloud_request_budget_per_day')\
      \ }}** · recommended & original **220** · *kept by Restore*  \nNo command is sent once the bridge's\
      \ local request count over 24 h reaches this. Normal 30-minute polling uses about 150/day.\n\n**Notification\
      \ service** — current **{{ states('text.thermann_shadow_notification_service') }}** · recommended\
      \ & original **blank / unknown** · *kept by Restore*  \nOptional phone notifications for faults,\
      \ unconfirmed commands and comfort risks: the notify service name only, for example mobile_app_phone\
      \ (no 'notify.' in front). Blank = Home Assistant notifications only.\n\n**Commissioned hot-water\
      \ power entity and unit** — current **{{ states('text.thermann_shadow_commissioned_hot_water_power_entity_and_unit')\
      \ }}** · recommended & original **blank / unknown** · *kept by Restore*  \nAfter an electrician\
      \ verifies the exclusive hot-water circuit, sign, units, reporting cadence, OFF/ON and outage tests,\
      \ enter entity_id|W or entity_id|kW. Empty disables optional heating. Remapping the power sensor\
      \ clears this record; no relay control is used.\n\n**Compare adaptive polling (shadow only)** —\
      \ current **{{ states('switch.thermann_shadow_compare_adaptive_polling_shadow_only') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nRecord bounded would-be reads only. Actual bridge polling,\
      \ authentication, budgets and confirmations are unchanged.\n\n**Shadow heating poll maximum** —\
      \ current **{{ states('number.thermann_shadow_shadow_heating_poll_maximum') }} min** · recommended\
      \ & original **60 min** · *kept by Restore*  \nAdvisory heating cap, at most 60 minutes. Does not\
      \ change actual reads.\n\n**Shadow stable poll maximum** — current **{{ states('number.thermann_shadow_shadow_stable_poll_maximum')\
      \ }} min** · recommended & original **90 min** · *kept by Restore*  \nAdvisory stable cap, at most\
      \ 90 minutes. Vendor inactivity expiry remains unverified.\n\n**Four-state commands qualified (1.3.14)**\
      \ — current **{{ states('switch.thermann_shadow_four_state_commands_qualified_1_3_14') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nOnly after separately authorised supervised qualification\
      \ of OFF/45/62/70 transitions. Does not authorise live operation by itself.\n\n**Send adaptive cloud\
      \ scheduling plans** — current **{{ states('switch.thermann_shadow_send_adaptive_cloud_scheduling_plans')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nDisabled until independent review\
      \ and supervised validation. Sends bounded expiring hints only; the bridge needs its separate enabled\
      \ and qualified options. Fixed fallback and every cloud/command guard remain.\n\n**Allow longer\
      \ checks during quiet periods** — current **{{ states('switch.thermann_shadow_allow_longer_checks_during_quiet_periods')\
      \ }}** · recommended & original **Off** · *kept by Restore*  \nDefault off. Requires adaptive polling\
      \ and the reviewed event-aware bridge. May hold a confirmed baseline/OFF setting longer, without\
      \ trusting an old temperature. App changes can remain unseen until the selected check limit; brief\
      \ changes can be missed. Command prior checks and confirmation are unchanged.\n\n**Maximum time\
      \ between app-change checks** — current **{{ states('number.thermann_shadow_maximum_time_between_app_change_checks')\
      \ }} min** · recommended & original **60 min** · *kept by Restore*  \nHealthy-cloud maximum between\
      \ ordinary observations in quiet periods, 30–90 minutes. Longer saves requests but delays detecting\
      \ external changes. Outages can delay detection further. Applies only with longer quiet checks enabled;\
      \ temperatures still expire normally.\n\n**Use validated conservative learned heating rate** — current\
      \ **{{ states('switch.thermann_shadow_use_validated_conservative_learned_heating_rate') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nDisabled until real independent samples, held-out accuracy\
      \ and hardware qualification pass. A learned lower bound may advance required heating, never delay\
      \ it beyond nominal/live-watt planning.\n\n**Heating learning independently qualified** — current\
      \ **{{ states('switch.thermann_shadow_heating_learning_independently_qualified') }}** · recommended\
      \ & original **Off** · *kept by Restore*  \nOwner commissioning gate, never set from synthetic tests.\
      \ Remapping the meter, changing its unit or nominal tank/power clears this flag.\n\n**CT-free solar\
      \ commissioning record** — current **{{ states('text.thermann_shadow_ct_free_solar_commissioning_record')\
      \ }}** · recommended & original **blank / unknown** · *kept by Restore*  \nLeave blank until supervised\
      \ grid-sign, continuity, command and protective OFF tests pass. Exact grid_entity|W_or_kW|import_positive_or_export_positive|nominal_kW\
      \ record. Does not prove element operation. A mapped circuit meter must remain valid instead."
