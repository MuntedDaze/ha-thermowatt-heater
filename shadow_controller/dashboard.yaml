title: Thermann Hot Water
views:
- title: Hot Water
  path: thermann-shadow
  icon: mdi:water-boiler
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Right now
      icon: mdi:water-boiler
    - type: markdown
      text_only: true
      content: '{% set code = states(''sensor.thermann_shadow_decision_code'') %}{% set kind = {"heat_now_solar":
        "success", "heat_now_partial_solar": "success", "heat_now_grace_period": "success", "begin_grid_fallback":
        "warning", "insufficient_time": "error", "qualifying_solar": "info", "wait_for_forecast_solar":
        "info", "wait_for_cheaper_window": "info", "forecast_unavailable_conservative_fallback": "warning",
        "no_topup_required": "success", "data_unavailable": "error", "owner_review_required": "warning",
        "paused": "info"}.get(code, ''info'') %}{% set icon = {"heat_now_solar": "mdi:solar-power-variant",
        "heat_now_partial_solar": "mdi:solar-power", "heat_now_grace_period": "mdi:weather-partly-cloudy",
        "begin_grid_fallback": "mdi:transmission-tower", "insufficient_time": "mdi:clock-alert-outline",
        "qualifying_solar": "mdi:timer-sand", "wait_for_forecast_solar": "mdi:weather-sunny", "wait_for_cheaper_window":
        "mdi:clock-outline", "forecast_unavailable_conservative_fallback": "mdi:weather-cloudy-alert",
        "no_topup_required": "mdi:check-circle-outline", "data_unavailable": "mdi:lan-disconnect", "owner_review_required":
        "mdi:account-alert-outline", "paused": "mdi:pause-circle-outline"}.get(code, ''mdi:water-boiler'')
        %}

        <ha-alert alert-type="{{ kind }}"><h1><ha-icon icon="{{ icon }}"></ha-icon> {{ states(''sensor.thermann_shadow_recommendation'')
        }}</h1>{{ state_attr(''sensor.thermann_shadow_controller'',''decision_explanation'') or ''Waiting
        for fresh heater and meter readings.'' }}</ha-alert>


        **Shadow recommendation only.** No heater command is sent; the native Schedule still controls
        the real heater.'
    - type: gauge
      entity: sensor.thermann_shadow_bottom_temperature
      name: Tank · bottom sensor
      min: 10
      max: 75
      severity:
        red: 10
        yellow: 40
        green: 60
    - type: tile
