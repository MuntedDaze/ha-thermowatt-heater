# Optional Home Assistant package (generated by tools/build_home_dashboard.py).
# Save as /config/packages/thermowatt_home_energy.yaml with 'homeassistant: packages: !include_dir_named packages'.
# Daily meters start when installed; derived daily figures stay unavailable until the first full day,
# and need energy.battery_present: false in the mapping. Reload (not reset) to load it.
utility_meter:
  home_grid_import_meter:
    name: Home grid import meter
    unique_id: home_grid_import_meter
    source: sensor.goodwe_inverter_meter_total_energy_import
    cycle: daily
  home_grid_export_meter:
    name: Home grid export meter
    unique_id: home_grid_export_meter
    source: sensor.goodwe_inverter_meter_total_energy_export
    cycle: daily
  home_consumption_meter:
    name: Home consumption meter
    unique_id: home_consumption_meter
    source: sensor.home_house_energy_total
    cycle: daily
sensor:
- platform: integration
  name: Home house energy total
  unique_id: home_house_energy_total
  source: sensor.goodwe_inverter_house_consumption
  unit_prefix: k
  unit_time: h
  round: 3
  method: left
  max_sub_interval: 00:05:00
template:
- sensor:
  - name: Home solar power kW
    unique_id: home_solar_power_kw
    state: '{{ ([states(''sensor.goodwe_inverter_pv_power'') | float, 0] | max / 1000) | round(3)
      }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_pv_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home house power kW
    unique_id: home_house_power_kw
    state: '{{ ([states(''sensor.goodwe_inverter_house_consumption'') | float, 0] | max / 1000) |
      round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_house_consumption'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid import kW
    unique_id: home_grid_import_kw
    state: '{{ (([0 - (states(''sensor.goodwe_inverter_meter_active_power'') | float), 0] | max)
      / 1000) | round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid export kW
    unique_id: home_grid_export_kw
    state: '{{ (([(states(''sensor.goodwe_inverter_meter_active_power'') | float), 0] | max) / 1000)
      | round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid state
    unique_id: home_grid_state
    state: '{% set g = (states(''sensor.goodwe_inverter_meter_active_power'') | float) %}{% if g
      > 5.0 %}Grid Export{% elif g < -5.0 %}Grid Import{% else %}Grid Idle{% endif %}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    icon: mdi:transmission-tower
  - name: Home grid import today
    unique_id: home_grid_import_today
    state: '{{ states(''sensor.home_grid_import_meter'') | float | round(3) }}'
    availability: '{{ is_number(states(''sensor.home_grid_import_meter'')) and (state_attr(''sensor.home_grid_import_meter'',
      ''last_reset'') is not none and (state_attr(''sensor.home_grid_import_meter'', ''last_reset'')
      | as_datetime) is not none and (state_attr(''sensor.home_grid_import_meter'', ''last_reset'')
      | as_datetime) <= now().replace(hour=0, minute=5, second=0, microsecond=0)) and (states[''sensor.goodwe_inverter_meter_total_energy_import'']
      is not none and (now() - states[''sensor.goodwe_inverter_meter_total_energy_import''].last_reported).total_seconds()
      < 1800) }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:transmission-tower-import
  - name: Home grid export today
    unique_id: home_grid_export_today
    state: '{{ states(''sensor.home_grid_export_meter'') | float | round(3) }}'
    availability: '{{ is_number(states(''sensor.home_grid_export_meter'')) and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') is not none and (state_attr(''sensor.home_grid_export_meter'', ''last_reset'')
      | as_datetime) is not none and (state_attr(''sensor.home_grid_export_meter'', ''last_reset'')
      | as_datetime) <= now().replace(hour=0, minute=5, second=0, microsecond=0)) and (states[''sensor.goodwe_inverter_meter_total_energy_export'']
      is not none and (now() - states[''sensor.goodwe_inverter_meter_total_energy_export''].last_reported).total_seconds()
      < 1800) }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:transmission-tower-export
  - name: Home consumption today
    unique_id: home_consumption_today
    state: '{{ states(''sensor.home_consumption_meter'') | float | round(3) }}'
    availability: '{{ is_number(states(''sensor.home_consumption_meter'')) and (state_attr(''sensor.home_consumption_meter'',
      ''last_reset'') is not none and (state_attr(''sensor.home_consumption_meter'', ''last_reset'')
      | as_datetime) is not none and (state_attr(''sensor.home_consumption_meter'', ''last_reset'')
      | as_datetime) <= now().replace(hour=0, minute=5, second=0, microsecond=0)) and (states[''sensor.goodwe_inverter_house_consumption'']
      is not none and (now() - states[''sensor.goodwe_inverter_house_consumption''].last_reported).total_seconds()
      < 900) }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:home-lightning-bolt
  - name: Home solar used directly today
    unique_id: home_solar_used_directly_today
    state: '{{ ((states(''sensor.goodwe_inverter_today_s_pv_generation'') | float - states(''sensor.home_grid_export_meter'')
      | float) | round(3)) }}'
    availability: '{{ false and is_number(states(''sensor.goodwe_inverter_today_s_pv_generation''))
      and is_number(states(''sensor.goodwe_inverter_meter_total_energy_export'')) and is_number(states(''sensor.home_grid_export_meter''))
      and (state_attr(''sensor.home_grid_export_meter'', ''last_reset'') is not none and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') | as_datetime) is not none and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') | as_datetime) <= now().replace(hour=0, minute=5, second=0, microsecond=0))
      and (states[''sensor.goodwe_inverter_today_s_pv_generation''] is not none and (now() - states[''sensor.goodwe_inverter_today_s_pv_generation''].last_reported).total_seconds()
      < 1800) and (states[''sensor.goodwe_inverter_meter_total_energy_export''] is not none and (now()
      - states[''sensor.goodwe_inverter_meter_total_energy_export''].last_reported).total_seconds()
      < 1800) and states(''sensor.goodwe_inverter_today_s_pv_generation'') | float >= 0 and states(''sensor.home_grid_export_meter'')
      | float <= states(''sensor.goodwe_inverter_today_s_pv_generation'') | float + 0.3 }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:home-battery
  - name: Home self-consumption today
    unique_id: home_self_consumption_today
    state: '{{ (((states(''sensor.goodwe_inverter_today_s_pv_generation'') | float - states(''sensor.home_grid_export_meter'')
      | float) / states(''sensor.goodwe_inverter_today_s_pv_generation'') | float * 100) | round(0))
      }}'
    availability: '{{ false and is_number(states(''sensor.goodwe_inverter_today_s_pv_generation''))
      and is_number(states(''sensor.goodwe_inverter_meter_total_energy_export'')) and is_number(states(''sensor.home_grid_export_meter''))
      and (state_attr(''sensor.home_grid_export_meter'', ''last_reset'') is not none and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') | as_datetime) is not none and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') | as_datetime) <= now().replace(hour=0, minute=5, second=0, microsecond=0))
      and (states[''sensor.goodwe_inverter_today_s_pv_generation''] is not none and (now() - states[''sensor.goodwe_inverter_today_s_pv_generation''].last_reported).total_seconds()
      < 1800) and (states[''sensor.goodwe_inverter_meter_total_energy_export''] is not none and (now()
      - states[''sensor.goodwe_inverter_meter_total_energy_export''].last_reported).total_seconds()
      < 1800) and states(''sensor.goodwe_inverter_today_s_pv_generation'') | float >= 0 and states(''sensor.home_grid_export_meter'')
      | float <= states(''sensor.goodwe_inverter_today_s_pv_generation'') | float + 0.3 and states(''sensor.goodwe_inverter_today_s_pv_generation'')
      | float >= 1.0 }}'
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:percent-circle
