# Optional Home Assistant package (generated by tools/build_home_dashboard.py).
# Save as /config/packages/thermowatt_home_energy.yaml. Existing unique IDs are unchanged, so it
# upgrades in place; the daily meters and the integration sensor keep their accumulated data.
# Daily figures stay 'collecting' until the meters cover a whole local day.
utility_meter:
  home_grid_import_meter:
    name: Home grid import meter
    unique_id: home_grid_import_meter
    source: sensor.goodwe_inverter_meter_total_energy_import
    cycle: daily
  home_grid_export_meter:
    name: Home grid export meter
    unique_id: home_grid_export_meter
    source: sensor.goodwe_inverter_meter_total_energy_export
    cycle: daily
  home_consumption_meter:
    name: Home consumption meter
    unique_id: home_consumption_meter
    source: sensor.home_house_energy_total
    cycle: daily
sensor:
- platform: integration
  name: Home house energy total
  unique_id: home_house_energy_total
  source: sensor.goodwe_inverter_house_consumption
  unit_prefix: k
  unit_time: h
  round: 3
  method: left
  max_sub_interval: 00:05:00
template:
- sensor:
  - name: Home solar power kW
    unique_id: home_solar_power_kw
    state: '{{ ([states(''sensor.goodwe_inverter_pv_power'') | float, 0] | max / 1000) | round(3)
      }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_pv_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home house power kW
    unique_id: home_house_power_kw
    state: '{{ ([states(''sensor.goodwe_inverter_house_consumption'') | float, 0] | max / 1000) |
      round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_house_consumption'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid import kW
    unique_id: home_grid_import_kw
    state: '{{ (([0 - (states(''sensor.goodwe_inverter_meter_active_power'') | float), 0] | max)
      / 1000) | round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid export kW
    unique_id: home_grid_export_kw
    state: '{{ (([(states(''sensor.goodwe_inverter_meter_active_power'') | float), 0] | max) / 1000)
      | round(3) }}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
  - name: Home grid state
    unique_id: home_grid_state
    state: '{% set g = (states(''sensor.goodwe_inverter_meter_active_power'') | float) %}{% if g
      > 5.0 %}Grid Export{% elif g < -5.0 %}Grid Import{% else %}Grid Idle{% endif %}'
    availability: '{{ is_number(states(''sensor.goodwe_inverter_meter_active_power'')) }}'
    icon: mdi:transmission-tower
  - name: Home energy status
    unique_id: home_energy_status
    state: '{% if not true %}battery_unconfirmed{% elif not ((is_number(states(''sensor.goodwe_inverter_today_s_pv_generation''))
      and state_attr(''sensor.goodwe_inverter_today_s_pv_generation'', ''unit_of_measurement'') ==
      ''kWh'' and states(''sensor.goodwe_inverter_today_s_pv_generation'') | float >= 0 and states(''sensor.goodwe_inverter_today_s_pv_generation'')
      | float < 500 and (states[''sensor.goodwe_inverter_today_s_pv_generation''] is not none and
      (now() - states[''sensor.goodwe_inverter_today_s_pv_generation''].last_reported).total_seconds()
      < 1800)) and (is_number(states(''sensor.goodwe_inverter_meter_total_energy_import'')) and state_attr(''sensor.goodwe_inverter_meter_total_energy_import'',
      ''unit_of_measurement'') == ''kWh'' and states(''sensor.goodwe_inverter_meter_total_energy_import'')
      | float >= 0 and (states[''sensor.goodwe_inverter_meter_total_energy_import''] is not none
      and (now() - states[''sensor.goodwe_inverter_meter_total_energy_import''].last_reported).total_seconds()
      < 1800)) and (is_number(states(''sensor.goodwe_inverter_meter_total_energy_export'')) and state_attr(''sensor.goodwe_inverter_meter_total_energy_export'',
      ''unit_of_measurement'') == ''kWh'' and states(''sensor.goodwe_inverter_meter_total_energy_export'')
      | float >= 0 and (states[''sensor.goodwe_inverter_meter_total_energy_export''] is not none
      and (now() - states[''sensor.goodwe_inverter_meter_total_energy_export''].last_reported).total_seconds()
      < 1800))) %}sources_unavailable{% elif not ((is_number(states(''sensor.home_grid_import_meter''))
      and states(''sensor.home_grid_import_meter'') | float >= 0 and states(''sensor.home_grid_import_meter'')
      | float < 500 and state_attr(''sensor.home_grid_import_meter'', ''last_valid_state'') not in
      [none, ''None'']) and (is_number(states(''sensor.home_grid_export_meter'')) and states(''sensor.home_grid_export_meter'')
      | float >= 0 and states(''sensor.home_grid_export_meter'') | float < 500 and state_attr(''sensor.home_grid_export_meter'',
      ''last_valid_state'') not in [none, ''None'']) and ((state_attr(''sensor.home_grid_import_meter'',
      ''last_reset'') | as_datetime(none)) is not none and (state_attr(''sensor.home_grid_import_meter'',
      ''last_reset'') | as_datetime(none)) >= now().replace(hour=0, minute=0, second=0, microsecond=0)
      - timedelta(minutes=10) and (state_attr(''sensor.home_grid_import_meter'', ''last_reset'')
      | as_datetime(none)) <= now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=10))
      and ((state_attr(''sensor.home_grid_export_meter'', ''last_reset'') | as_datetime(none)) is
      not none and (state_attr(''sensor.home_grid_export_meter'', ''last_reset'') | as_datetime(none))
      >= now().replace(hour=0, minute=0, second=0, microsecond=0) - timedelta(minutes=10) and (state_attr(''sensor.home_grid_export_meter'',
      ''last_reset'') | as_datetime(none)) <= now().replace(hour=0, minute=0, second=0, microsecond=0)
      + timedelta(minutes=10))) %}collecting_first_day{% elif not (states(''sensor.home_grid_export_meter'')
      | float <= states(''sensor.goodwe_inverter_today_s_pv_generation'') | float) %}inconsistent{%
      else %}ready{% endif %}'
    icon: mdi:chart-timeline-variant
    attributes:
      meaning: ready = full-day figures valid; collecting_first_day = the daily meters do not yet
        cover a whole local day; sources_unavailable = an inverter counter is missing, stale or not
        kWh; inconsistent = export exceeds generation; battery_unconfirmed = battery_present is not
        confirmed false in the mapping
  - name: Home grid import today
    unique_id: home_grid_import_today
    state: '{{ states(''sensor.home_grid_import_meter'') | float | round(3) }}'
    availability: '{{ is_state(''sensor.home_energy_status'', ''ready'') }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:transmission-tower-import
    attributes:
      basis: daily utility meter on the inverter import counter (measured). If the inverter is offline
        overnight, the gap is added to the day its counter returns.
  - name: Home grid export today
    unique_id: home_grid_export_today
    state: '{{ states(''sensor.home_grid_export_meter'') | float | round(3) }}'
    availability: '{{ is_state(''sensor.home_energy_status'', ''ready'') }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:transmission-tower-export
    attributes:
      basis: daily utility meter on the inverter export counter (measured). If the inverter is offline
        overnight, the gap is added to the day its counter returns.
  - name: Home consumption today
    unique_id: home_consumption_today
    state: '{{ (states(''sensor.goodwe_inverter_today_s_pv_generation'') | float + states(''sensor.home_grid_import_meter'')
      | float - states(''sensor.home_grid_export_meter'') | float) | round(3) }}'
    availability: '{{ is_state(''sensor.home_energy_status'', ''ready'') }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:home-lightning-bolt
    attributes:
      basis: 'energy balance: solar + import - export (battery-free), all inverter counters'
  - name: Home consumption estimate today
    unique_id: home_consumption_estimate_today
    state: '{{ states(''sensor.home_consumption_meter'') | float | round(3) }}'
    availability: '{{ (is_number(states(''sensor.home_consumption_meter'')) and states(''sensor.home_consumption_meter'')
      | float >= 0 and states(''sensor.home_consumption_meter'') | float < 500 and state_attr(''sensor.home_consumption_meter'',
      ''last_valid_state'') not in [none, ''None'']) and ((state_attr(''sensor.home_consumption_meter'',
      ''last_reset'') | as_datetime(none)) is not none and (state_attr(''sensor.home_consumption_meter'',
      ''last_reset'') | as_datetime(none)) >= now().replace(hour=0, minute=0, second=0, microsecond=0)
      - timedelta(minutes=10) and (state_attr(''sensor.home_consumption_meter'', ''last_reset'')
      | as_datetime(none)) <= now().replace(hour=0, minute=0, second=0, microsecond=0) + timedelta(minutes=10))
      and (states[''sensor.goodwe_inverter_house_consumption''] is not none and (now() - states[''sensor.goodwe_inverter_house_consumption''].last_reported).total_seconds()
      < 900) }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:home-lightning-bolt-outline
    attributes:
      basis: integrated estimate from sampled house power; outages leave gaps (not a measured total)
  - name: Home solar used directly today
    unique_id: home_solar_used_directly_today
    state: '{{ (states(''sensor.goodwe_inverter_today_s_pv_generation'') | float - states(''sensor.home_grid_export_meter'')
      | float) | round(3) }}'
    availability: '{{ is_state(''sensor.home_energy_status'', ''ready'') }}'
    unit_of_measurement: kWh
    device_class: energy
    icon: mdi:home-battery
    attributes:
      basis: solar generated minus exported (battery-free)
  - name: Home self-consumption today
    unique_id: home_self_consumption_today
    state: '{{ (((states(''sensor.goodwe_inverter_today_s_pv_generation'') | float - states(''sensor.home_grid_export_meter'')
      | float) / states(''sensor.goodwe_inverter_today_s_pv_generation'') | float * 100) | round(0))
      }}'
    availability: '{{ is_state(''sensor.home_energy_status'', ''ready'') and states(''sensor.goodwe_inverter_today_s_pv_generation'')
      | float >= 1.0 }}'
    unit_of_measurement: '%'
    state_class: measurement
    icon: mdi:percent-circle
    attributes:
      basis: direct use / solar generated; needs at least 1 kWh generated
