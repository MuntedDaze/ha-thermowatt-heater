# GENERIC profile: assumption-free defaults for a household that is NOT this owner's. It assumes no
# battery, no weather entity, no light entities and no particular device names. Copy this file, fill in
# your own entity IDs, and run:  python tools/build_home_dashboard.py --mapping path/to/your_mapping.yaml
# (status values: verified / owner-confirmed / unverified / unmapped; see homeowner/home_mapping.yaml).
version: 2
profile: generic
place: ""
energy:
  grid_power: {entity: sensor.goodwe_inverter_meter_active_power, status: unverified}
  grid_export_positive: true
  solar_power: {entity: sensor.goodwe_inverter_pv_power, status: unverified}
  house_power: {entity: sensor.goodwe_inverter_house_consumption, status: unverified}
  solar_today_energy: {entity: sensor.goodwe_inverter_today_s_pv_generation, status: unverified}
  grid_import_total: {entity: sensor.goodwe_inverter_meter_total_energy_import, status: unverified}
  grid_export_total: {entity: sensor.goodwe_inverter_meter_total_energy_export, status: unverified}
  # Unknown until you confirm: set false (no battery) to enable the derived daily figures.
  battery_present: unknown
weather: {entity: "", status: unmapped}
# Lights are discovered at run time (nothing to list). Hide one with the Home Assistant label below, or
# list its entity ID in `exclude`. `names` renames lights (and is the list the no-custom-card fallback shows).
lights:
  discover: true
  exclude: []
  exclude_label: hide_from_dashboard
  names: {}
bathrooms:
  - name: Main Bathroom
    original: {}      # leave empty to chart the Tapo controller's own sensors
  - name: Ensuite
    original: {}
doors:
  garage_contact: {entity: "", status: unmapped}
  front_contact: {entity: "", status: unmapped}

# Individual device energy. Devices are discovered at run time. Rates are NOT assumed: add your own.
# rates (append-only; older periods keep the rate in force then), AUD or your currency per kWh:
#   - {effective_from: "2026-07-01", offpeak: 0.15, peak: 0.20}
device_energy:
  platforms: [tplink, tapo]
  exclude: []
  include_only: []
  exclude_label: ""
  history_months: 6
  rates: []
