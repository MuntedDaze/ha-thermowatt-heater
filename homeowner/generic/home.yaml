        \ %}\n{% set bg = states('sensor.tapo_smart_controller_main_bathroom_background_humidity')\
        \ %}\n{% set reason = state_attr('sensor.tapo_smart_controller_main_bathroom_fan_status',\
        \ 'reason') %}\n{% set fan_s = state_attr('binary_sensor.tapo_smart_controller_main_bathroom_fan_running',\
