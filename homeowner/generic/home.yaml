- title: Lights
  path: lights
  type: sections
  max_columns: 2
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-lights-card
      discover: true
      exclude_label: hide_from_dashboard
      diagnostics: true
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      model:
        title: Evening lights schedule
        icon: mdi:weather-sunset
        lines:
        - 'When switched on below: lights with the "Evening lights" label turn ON two hours before
          sunset (it follows the seasons and Tasmanian daylight saving by itself) and OFF at 01:00.'
        - 'Switching a light yourself at any time always works: the schedule only acts at those two
          moments and never turns a light back on or off afterwards.'
        - Nothing is scheduled until the optional schedule file is installed (the install notes explain
          how). Add the label to a light in Settings, Areas, labels and zones, Labels.
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: automation.evening_lights_on
          state: 'on'
        - condition: state
          entity: automation.evening_lights_on
          state: 'off'
      card:
        type: tile
        entity: automation.evening_lights_on
        name: Evening lights on (2 h before sunset)
        icon: mdi:weather-sunset-down
        color: orange
        state_content: state
        tap_action:
          action: perform-action
          perform_action: automation.toggle
          target:
            entity_id: automation.evening_lights_on
          confirmation:
            text: Switch the "Evening lights on (2 h before sunset)" schedule on or off?
        icon_tap_action:
          action: perform-action
          perform_action: automation.toggle
          target:
            entity_id: automation.evening_lights_on
          confirmation:
            text: Switch the "Evening lights on (2 h before sunset)" schedule on or off?
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: automation.evening_lights_off
          state: 'on'
        - condition: state
          entity: automation.evening_lights_off
          state: 'off'
      card:
        type: tile
        entity: automation.evening_lights_off
        name: Evening lights off (01:00)
        icon: mdi:weather-night
        color: orange
        state_content: state
        tap_action:
          action: perform-action
          perform_action: automation.toggle
          target:
            entity_id: automation.evening_lights_off
          confirmation:
            text: Switch the "Evening lights off (01:00)" schedule on or off?
        icon_tap_action:
          action: perform-action
          perform_action: automation.toggle
          target:
            entity_id: automation.evening_lights_off
          confirmation:
            text: Switch the "Evening lights off (01:00)" schedule on or off?
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: automation.evening_lights_on
        state_not: 'on'
      - condition: state
        entity: automation.evening_lights_on
        state_not: 'off'
      card:
        type: markdown
        content: The evening schedule is not installed, so no lights are scheduled. See docs/owner/HOME_DASHBOARD.md
          (Lighting schedule) for the optional file.
        grid_options:
          columns: 12
      grid_options:
        columns: 12
    - type: tile
      entity: sun.sun
      hide_state: true
      name: Edit automations
      icon: mdi:cog-outline
      vertical: false
      tap_action:
        action: navigate
        navigation_path: /config/automation/dashboard
      icon_tap_action:
        action: navigate
        navigation_path: /config/automation/dashboard
      grid_options:
        columns: 12
    - type: tile
      entity: sun.sun
      hide_state: true
      name: Light labels
      icon: mdi:cog-outline
      vertical: false
      tap_action:
        action: navigate
        navigation_path: /config/labels
      icon_tap_action:
        action: navigate
        navigation_path: /config/labels
      grid_options:
        columns: 12
- title: Doors
  path: doors
  type: sections
  max_columns: 2
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set gp = states('sensor.tapo_smart_controller_garage_door_position') %}\n{% set gs = state_attr('sensor.tapo_smart_controller_garage_door_status',\
        \ 'summary') %}\n{% set fo = states('binary_sensor.tapo_smart_controller_front_door_open')\
        \ %}\n{% set fs = state_attr('sensor.tapo_smart_controller_front_door_lock_status', 'summary')\
        \ %}\n{% macro tail(v) -%}{{ v.split(' — ')[1] if v and ' — ' in v else '' }}{%- endmacro\
        \ %}\n{{ {\n  'title': 'Doors',\n  'icon': 'mdi:shield-home',\n  'badge': {'text': 'Monitoring\
        \ only', 'tone': 'idle'},\n  'stats': [\n    {'label': 'Garage door', 'value': gp if gp in\
        \ ['Closed', 'Not closed'] else 'Unknown',\n     'tone': 'ok' if gp == 'Closed' else ('warn'\
        \ if gp == 'Not closed' else 'idle'), 'detail': tail(gs) or none},\n    {'label': 'Front\
        \ door', 'value': 'Open' if fo == 'on' else ('Closed' if fo == 'off' else 'Unknown'),\n \
        \    'tone': 'warn' if fo == 'on' else ('ok' if fo == 'off' else 'idle'), 'detail': tail(fs)\
        \ or none}\n  ],\n  'columns': 2,\n  'lines': [\"Monitoring only: no garage Open/Close/Stop\
        \ and no lock controls. The garage is operated by its physical Tapo button, and a closed\
        \ door contact does not mean the front door is locked.\"]\n} | tojson }}\n"
      model: 12
- title: System
  path: system
  type: sections
  max_columns: 2
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set cloud = {'ok': 'Connected', 'disabled': 'Disabled', 'auth_locked': 'Sign-in locked:\
        \ check the Thermann app', 'quota_limited': 'Request limit reached', 'backoff': 'Backing\
        \ off after an error', 'unavailable': 'Unavailable'} %}\n{% set sup = {'observing': 'Observing:\
        \ checking the heater before acting', 'parked': 'Heater confirmed off', 'baseline_45': 'Holding\
        \ the 45 °C baseline', 'normal_storage_62': 'Holding 62 °C storage', 'storage_70': 'Holding\
        \ the 70 °C boost', 'change_requested': 'A change is needed but is waiting for conditions',\
        \ 'confirming': 'Command sent: waiting for confirmation', 'owner_override': 'On hold: you\
        \ pressed Hold', 'disabled': 'Automatic control is off', 'fault_locked': 'Fault: needs acknowledgement'}\
        \ %}\n{% set tariff = {'off_peak': 'Off-peak', 'peak': 'Peak', 'shoulder': 'Shoulder', 'unknown':\
        \ 'Unknown'} %}\n{% set fault = states('sensor.thermann_shadow_controller_fault') %}\n{%\
        \ set c = states('sensor.thermann_shadow_cloud_health') %}\n{% set s = states('sensor.thermann_shadow_automatic_control_state')\
        \ %}\n{% set t = states('sensor.tapo_smart_controller_electricity_tariff_status') %}\n{%\
        \ set w = states('sensor.tapo_smart_controller_active_health_warnings') %}\n{% set good_sup\
        \ = ['observing', 'parked', 'baseline_45', 'normal_storage_62', 'storage_70'] %}\n{% set\
        \ wait_sup = ['change_requested', 'confirming', 'owner_override', 'disabled'] %}\n{{ {\n\
        \  'title': 'System status',\n  'icon': 'mdi:stethoscope',\n  'groups': [\n    {'title':\
        \ 'Thermowatt', 'rows': [\n      {'label': 'Cloud connection', 'value': cloud.get(c, nice(c))\
        \ if c not in bad else 'Unknown',\n       'tone': 'ok' if c == 'ok' else ('warn' if c in\
        \ ['disabled', 'quota_limited', 'backoff'] else ('bad' if c in ['auth_locked', 'unavailable']\
        \ else 'idle'))},\n      {'label': 'Heating control problem', 'value': 'No problems detected'\
        \ if fault in ['none', 'None', ''] else ('Unknown' if fault in ['unknown', 'unavailable']\
        \ else nice(fault)),\n       'tone': 'ok' if fault in ['none', 'None', ''] else ('idle' if\
        \ fault in ['unknown', 'unavailable'] else 'bad')},\n      {'label': 'Supervision', 'value':\
        \ sup.get(s, nice(s)) if s not in bad else 'Unknown',\n       'tone': 'ok' if s in good_sup\
        \ else ('warn' if s in wait_sup else ('bad' if s == 'fault_locked' else 'idle'))}\n    ]},\n\
        \    {'title': 'Tapo Smart Controller', 'rows': [\n      {'label': 'Health', 'value': ('Problem\
        \ reported' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'on') else ('No problems detected' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'off') else 'Unknown')) ~ ((' (' ~ w ~ ' active warnings)') if w not in bad else ''),\n\
        \       'tone': 'bad' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'on') else ('ok' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'off') else 'idle')},\n      {'label': 'Mode', 'value': 'Simulation: no devices are switched'\
        \ if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active', 'on') else ('Live\
        \ control' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active', 'off')\
        \ else 'Unknown'),\n       'tone': 'warn' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active',\
        \ 'on') else ('ok' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active',\
        \ 'off') else 'idle')},\n      {'label': 'Tariff read by the controller', 'value': tariff.get(t,\
        \ nice(t)) if t not in bad else 'Unknown'}\n    ]}\n  ]\n} | tojson }}\n"
      model: 12
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      model:
        title: Settings
        icon: mdi:cog-outline
        lines:
        - Tuning, schedules and diagnostic reports live in the two integrations' own settings pages.
      actions:
      - label: Thermowatt settings and diagnostic report
        detail: Hot-water heating, tariff and cloud settings
        icon: mdi:water-boiler
        path: /config/integrations/integration/thermann_shadow
      - label: Tapo Smart Controller settings
        detail: Bathroom tuning, towel-rail schedules and relays
        icon: mdi:shower-head
        path: /config/integrations/integration/tapo_smart_controller
