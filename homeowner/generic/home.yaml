        \ 'summary') %}\n{% set left = states('sensor.tapo_smart_controller_main_bathroom_towel_rail_remaining_time')\
        \ %}\n{% set waiting = state_attr('sensor.tapo_smart_controller_main_bathroom_towel_rail_remaining_time',\
        \ 'waiting_for_off_peak') %}\n{% set rows = [\n  {'label': 'Learned background humidity',\
