# Home dashboard (generated by tools/build_home_dashboard.py; edit the mapping file instead)
# Requires the dependency-free custom card /local/thermowatt/thermowatt-power-flow-card.js
# (homeowner/www/thermowatt-power-flow-card.js). Use home_no_custom_card.yaml without it.
title: Home
views:
- title: Home
  path: home
  type: panel
  cards:
  - type: custom:thermowatt-home-page
    flow:
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
      today:
        solar: sensor.goodwe_inverter_today_s_pv_generation
        import: sensor.goodwe_inverter_meter_total_energy_import
        export: sensor.goodwe_inverter_meter_total_energy_export
        used: sensor.home_solar_used_directly_today
        status: sensor.home_energy_status
    hot_water:
      temperature: sensor.thermann_shadow_bottom_temperature
      mode: sensor.thermann_shadow_thermann_mode
      target: sensor.thermann_shadow_thermann_target
      automatic: switch.thermann_shadow_automatic_heater_control
      operating: sensor.thermann_shadow_hot_water_operating_mode
      tariff: sensor.thermann_shadow_current_tariff
      boost: sensor.thermann_shadow_solar_boost_status
      boost_enabled: switch.thermann_shadow_enable_optional_solar_boost
      next_action: sensor.thermann_shadow_next_intended_action
      last_poll: sensor.home_last_successful_poll
      next_poll: sensor.thermann_shadow_next_cloud_poll
    doors:
      garage_position: sensor.tapo_smart_controller_garage_door_position
      front_open: binary_sensor.tapo_smart_controller_front_door_open
    bathrooms:
    - name: Main Bathroom
      humidity: sensor.tapo_smart_controller_main_bathroom_humidity
      temperature: sensor.tapo_smart_controller_main_bathroom_temperature
      shower: binary_sensor.tapo_smart_controller_main_bathroom_shower_detected
      fan_running: binary_sensor.tapo_smart_controller_main_bathroom_fan_running
      towel_heating: binary_sensor.tapo_smart_controller_main_bathroom_towel_rail_heating
      towel_remaining: sensor.tapo_smart_controller_main_bathroom_towel_rail_remaining_time
      fan_switch: switch.tapo_smart_controller_main_bathroom_fan_manual_override
    - name: Ensuite
      humidity: sensor.tapo_smart_controller_ensuite_humidity
      temperature: sensor.tapo_smart_controller_ensuite_temperature
      shower: binary_sensor.tapo_smart_controller_ensuite_shower_detected
      fan_running: binary_sensor.tapo_smart_controller_ensuite_fan_running
      towel_heating: binary_sensor.tapo_smart_controller_ensuite_towel_rail_heating
      towel_remaining: sensor.tapo_smart_controller_ensuite_towel_rail_remaining_time
      fan_switch: switch.tapo_smart_controller_ensuite_fan_manual_override
    lights:
      discover: true
      exclude_label: hide_from_dashboard
- title: Energy
  path: energy
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-power-flow-card
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
      today:
        solar: sensor.goodwe_inverter_today_s_pv_generation
        import: sensor.goodwe_inverter_meter_total_energy_import
        export: sensor.goodwe_inverter_meter_total_energy_export
        used: sensor.home_solar_used_directly_today
        status: sensor.home_energy_status
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set s = states('sensor.home_energy_status') %}\n{% macro kwh(e) -%}{{ ('%.2f' | format(states(e)\
        \ | float(0)) ~ ' kWh') if is_number(states(e)) else '—' }}{%- endmacro %}\n{% set figures\
        \ = [\n  {'label': 'Household today', 'value': kwh('sensor.home_consumption_today'), 'tone':\
        \ 'info'},\n  {'label': 'Solar used directly', 'value': kwh('sensor.home_solar_used_directly_today'),\
        \ 'tone': 'ok'},\n  {'label': 'Self-consumption', 'value': (('%d' | format(states('sensor.home_self_consumption_today')\
        \ | float(0))) ~ ' %') if is_number(states('sensor.home_self_consumption_today')) else '—',\
        \ 'tone': 'ok'}\n] %}\n{% set meters = [\n  {'label': 'Grid import since the meter started',\
        \ 'value': kwh('sensor.home_grid_import_meter')},\n  {'label': 'Grid export since the meter\
        \ started', 'value': kwh('sensor.home_grid_export_meter')},\n  {'label': 'Household, integrated\
        \ from power (estimate)', 'value': kwh('sensor.home_consumption_meter')}\n] %}\n{% set lines\
        \ = {\n  'collecting_first_day': 'Household, direct-use and self-consumption appear once\
        \ the daily meters cover a full day (after the next midnight). Solar, import and export are\
        \ shown from existing statistics.',\n  'sources_unavailable': 'Check the inverter integration;\
        \ figures are withheld, not zero.',\n  'inconsistent': 'Daily counters disagree (export exceeds\
        \ generation); figures are withheld until they agree.',\n  'battery_unconfirmed': 'Set battery_present:\
        \ false in the mapping if there is no battery.'\n} %}\n{% set badges = {\n  'ready': {'text':\
        \ 'Complete day', 'tone': 'ok'},\n  'collecting_first_day': {'text': 'Collecting daily data',\
        \ 'tone': 'info'},\n  'sources_unavailable': {'text': 'Readings unavailable', 'tone': 'bad'},\n\
        \  'inconsistent': {'text': 'Counters disagree', 'tone': 'bad'},\n  'battery_unconfirmed':\
        \ {'text': 'Battery not confirmed', 'tone': 'warn'}\n} %}\n{{ {\n  'title': \"Today's energy\"\
        ,\n  'icon': 'mdi:chart-bar',\n  'badge': badges.get(s, {'text': 'Status unknown', 'tone':\
        \ 'idle'}),\n  'stats': figures if s == 'ready' else [],\n  'columns': 3,\n  'groups': []\
        \ if s == 'ready' else [{'title': 'Daily meters (partial on the day installed)', 'rows':\
        \ meters}],\n  'lines': [lines[s]] if s in lines else []\n} | tojson }}\n"
      model: 12
  - type: grid
    cards:
    - type: history-graph
      title: Power, last 24 hours
      hours_to_show: 24
      entities:
      - sensor.goodwe_inverter_pv_power
      - sensor.goodwe_inverter_house_consumption
      - sensor.goodwe_inverter_meter_active_power
      grid_options:
        columns: 12
- title: Hot water
  path: hot-water
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set t = states('sensor.thermann_shadow_bottom_temperature') %}\n{% set age = states('sensor.thermann_shadow_status_age')\
        \ %}\n{% set mode_r = states('sensor.thermann_shadow_thermann_mode') %}\n{% set tgt_r = states('sensor.thermann_shadow_thermann_target')\
        \ %}\n{% set tgt_d = states('sensor.thermann_shadow_desired_thermostat_temperature') %}\n\
        {% set ctrl = states('sensor.thermann_shadow_hot_water_operating_mode') %}\n{% set tariff\
        \ = states('sensor.thermann_shadow_current_tariff') %}\n{% set boost = states('sensor.thermann_shadow_solar_boost_status')\
        \ %}\n{% set nxt = states('sensor.thermann_shadow_next_intended_action') %}\n{% set poll\
        \ = states('sensor.thermann_shadow_next_cloud_poll') %}\n{% set last = states('sensor.home_last_successful_poll')\
        \ %}\n{% set ends = states('sensor.thermann_shadow_guest_mode_ends') %}\n{% set ctrl_names\
        \ = {'automatic': 'Automatic', 'guest': '12 h override', 'holiday': 'Holiday', 'disabled':\
        \ 'Off'} %}\n{% set tariff_names = {'off_peak': 'Off-peak', 'peak': 'Peak', 'shoulder': 'Shoulder'}\
        \ %}\n{% set target = ('Target ' ~ ('%d' | format(tgt_r | float(0) | round(0)) ) ~ ' °C')\
        \ if tgt_r not in bad else none %}\n{% set desired = (' · desired ' ~ ('%d' | format(tgt_d\
        \ | float(0) | round(0))) ~ ' °C') if (tgt_d not in bad and tgt_r not in bad and (tgt_d |\
        \ float(0) | round(0)) != (tgt_r | float(0) | round(0))) else '' %}\n{% set stats = [\n \
        \ {'label': 'Heater', 'value': nice(mode_r) if mode_r not in bad else none, 'detail': (target\
        \ ~ desired) if target else none},\n  {'label': 'Tariff', 'value': tariff_names.get(tariff,\
        \ nice(tariff)) if tariff not in bad else none, 'tone': 'warn' if tariff == 'peak' else ('ok'\
        \ if tariff == 'off_peak' else 'idle')},\n  {'label': 'Solar boost', 'value': nice(boost)\
        \ if boost not in bad else none},\n  {'label': 'Next', 'value': nice(nxt) if nxt not in bad\
        \ else none, 'detail': ('Next poll ' ~ hhmm(poll)) if poll not in bad else none}\n] %}\n\
        {% if ctrl == 'guest' and ends not in bad %}{% set left = ((as_datetime(ends, none) - now()).total_seconds()\
        \ // 60) | int(0) if as_datetime(ends, none) is not none else none %}{% set stats = stats\
        \ + [{'label': '12 h override ends', 'value': hhmm(ends), 'tone': 'warn', 'detail': ((((left\
        \ // 60) | string) ~ ' h ' ~ ((left % 60) | string) ~ ' min left') if left is not none and\
        \ left > 0 else none)}] %}{% endif %}\n{{ {\n  'title': 'Hot water',\n  'icon': 'mdi:water-boiler',\n\
        \  'badge': {'text': ctrl_names.get(ctrl, nice(ctrl)) if ctrl not in bad else 'Status unknown',\
        \ 'tone': 'warn' if ctrl == 'guest' else ('idle' if ctrl in bad else 'info')},\n  'hero':\
        \ {'label': 'Water temperature', 'value': ('%.1f' | format(t | float(0))) if t not in bad\
        \ else none, 'unit': '°C',\n           'caption': (('Updated ' ~ (age | int(0)) ~ ' min ago')\
        \ if age not in bad else 'Age unknown') ~ ' · last poll ' ~ (hhmm(last) if last not in bad\
        \ else '—')},\n  'stats': stats,\n  'columns': 2\n} | tojson }}\n"
      model: 12
    - type: heading
      heading: Everyday controls
      heading_style: subtitle
      icon: mdi:tune-variant
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'on'
      card:
        type: tile
        entity: switch.thermann_shadow_automatic_heater_control
        name: 'Automatic heater control: ON'
        icon: mdi:robot
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.thermann_shadow_automatic_heater_control
          confirmation:
            text: Turn automatic heater control OFF? Thermowatt stops sending commands to the heater
              (the heater keeps its current mode) until you turn it on again.
        icon_tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.thermann_shadow_automatic_heater_control
          confirmation:
            text: Turn automatic heater control OFF? Thermowatt stops sending commands to the heater
              (the heater keeps its current mode) until you turn it on again.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'off'
      card:
        type: tile
        entity: switch.thermann_shadow_automatic_heater_control
        name: 'Automatic heater control: OFF'
        icon: mdi:robot-off
        color: grey
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.thermann_shadow_automatic_heater_control
          confirmation:
            text: Turn automatic heater control ON? Thermowatt will start managing the heater. It
              refuses to start until commissioning is complete.
        icon_tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.thermann_shadow_automatic_heater_control
          confirmation:
            text: Turn automatic heater control ON? Thermowatt will start managing the heater. It
              refuses to start until commissioning is complete.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: switch.thermann_shadow_automatic_heater_control
          state: unavailable
        - condition: state
          entity: switch.thermann_shadow_automatic_heater_control
          state: unknown
      card:
        type: tile
        entity: switch.thermann_shadow_automatic_heater_control
        name: 'Automatic heater control: status unknown'
        icon: mdi:robot-confused
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'on'
      - condition: state
        entity: switch.thermann_shadow_enable_optional_solar_boost
        state: 'on'
      card:
        type: tile
        entity: switch.thermann_shadow_enable_optional_solar_boost
        name: 'Optional solar boost: enabled (locked while automatic heater control is on)'
        icon: mdi:solar-power-variant
        color: grey
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'on'
      - condition: state
        entity: switch.thermann_shadow_enable_optional_solar_boost
        state: 'off'
      card:
        type: tile
        entity: switch.thermann_shadow_enable_optional_solar_boost
        name: 'Optional solar boost: disabled (locked while automatic heater control is on)'
        icon: mdi:solar-power-variant-outline
        color: grey
        hide_state: true
        tap_action:
          action: none
        icon_tap_action:
          action: none
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'off'
      - condition: state
        entity: switch.thermann_shadow_enable_optional_solar_boost
        state: 'on'
      card:
        type: tile
        entity: switch.thermann_shadow_enable_optional_solar_boost
        name: 'Optional solar boost: enabled'
        icon: mdi:solar-power-variant
        color: orange
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.thermann_shadow_enable_optional_solar_boost
          confirmation:
            text: Disable optional solar boost? This only stops extra solar storage; it does not
              turn the heater on or off.
        icon_tap_action:
          action: perform-action
          perform_action: switch.turn_off
          target:
            entity_id: switch.thermann_shadow_enable_optional_solar_boost
          confirmation:
            text: Disable optional solar boost? This only stops extra solar storage; it does not
              turn the heater on or off.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: switch.thermann_shadow_automatic_heater_control
        state: 'off'
      - condition: state
        entity: switch.thermann_shadow_enable_optional_solar_boost
        state: 'off'
      card:
        type: tile
        entity: switch.thermann_shadow_enable_optional_solar_boost
        name: 'Optional solar boost: disabled'
        icon: mdi:solar-power-variant-outline
        color: grey
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.thermann_shadow_enable_optional_solar_boost
          confirmation:
            text: 'Enable optional solar boost? It does not start boosting by itself: automatic control
              and every safety check still apply.'
        icon_tap_action:
          action: perform-action
          perform_action: switch.turn_on
          target:
            entity_id: switch.thermann_shadow_enable_optional_solar_boost
          confirmation:
            text: 'Enable optional solar boost? It does not start boosting by itself: automatic control
              and every safety check still apply.'
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: switch.thermann_shadow_automatic_heater_control
          state: unavailable
        - condition: state
          entity: switch.thermann_shadow_automatic_heater_control
          state: unknown
        - condition: state
          entity: switch.thermann_shadow_enable_optional_solar_boost
          state: unavailable
        - condition: state
          entity: switch.thermann_shadow_enable_optional_solar_boost
          state: unknown
      card:
        type: tile
        entity: switch.thermann_shadow_enable_optional_solar_boost
        name: 'Optional solar boost: status unknown'
        icon: mdi:solar-power-variant-outline
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state: guest
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12-hour 62 °C override: ON'
        icon: mdi:water-boiler
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_cancel_guest_mode
          confirmation:
            text: Cancel the 12-hour 62 °C override? Normal automatic control resumes.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_cancel_guest_mode
          confirmation:
            text: Cancel the 12-hour 62 °C override? Normal automatic control resumes.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: guest
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: unavailable
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: unknown
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: holiday
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: disabled
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12-hour 62 °C override: OFF'
        icon: mdi:water-boiler-off
        color: grey
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_start_guest_mode_12_h
          confirmation:
            text: Start the 12-hour 62 °C override? It may heat during peak hours; controller safeguards
              still apply.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_start_guest_mode_12_h
          confirmation:
            text: Start the 12-hour 62 °C override? It may heat during peak hours; controller safeguards
              still apply.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: unavailable
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: unknown
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12-hour 62 °C override: status unknown'
        icon: mdi:water-boiler-alert
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: holiday
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: disabled
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12-hour 62 °C override: not available now'
        icon: mdi:water-boiler-off
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set plan = states('sensor.thermann_shadow_current_heating_plan') %}\n{% set nxt = states('sensor.thermann_shadow_next_intended_action')\
        \ %}\n{% set start = states('sensor.thermann_shadow_next_heating_start') %}\n{% set boost\
        \ = states('sensor.thermann_shadow_solar_boost_status') %}\n{% set why = states('sensor.thermann_shadow_why_thermowatt_made_this_decision')\
        \ %}\n{% set last = states('sensor.thermann_shadow_last_command_result') %}\n{% set reqs\
        \ = states('sensor.thermann_shadow_cloud_requests_in_last_24_hours') %}\n{{ {\n  'title':\
        \ 'Plan and diagnostics',\n  'icon': 'mdi:text-box-search-outline',\n  'rows': [\n    {'label':\
        \ 'Plan', 'value': plan if plan not in bad else none},\n    {'label': 'Next action', 'value':\
        \ nice(nxt) if nxt not in bad else none},\n    {'label': 'Next heating start', 'value': hhmm(start)\
        \ if start not in bad else 'none planned'},\n    {'label': 'Solar boost', 'value': nice(boost)\
        \ if boost not in bad else none},\n    {'label': 'Why this decision', 'value': nice(why)\
        \ if why not in bad else none},\n    {'label': 'Last command', 'value': nice(last) if last\
        \ not in bad else none},\n    {'label': 'Cloud requests in 24 h', 'value': reqs if reqs not\
        \ in bad else none}\n  ]\n} | tojson }}\n"
      model: 12
    - type: heading
      heading: Advanced
      heading_style: subtitle
      icon: mdi:cog-outline
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermann_shadow_automatic_control_state
        state: owner_override
      card:
        type: tile
        entity: sensor.thermann_shadow_automatic_control_state
        name: 'Automatic heating: on hold'
        icon: mdi:pause-circle
        color: orange
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_resume_automatic_control
          confirmation:
            text: Resume automatic heating? The controller re-inspects the heater first.
        icon_tap_action:
