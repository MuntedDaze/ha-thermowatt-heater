        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set gp = states('sensor.tapo_smart_controller_garage_door_position') %}\n{% set gs = state_attr('sensor.tapo_smart_controller_garage_door_status',\
        \ 'summary') %}\n{% set fo = states('binary_sensor.tapo_smart_controller_front_door_open')\
        \ %}\n{% set fs = state_attr('sensor.tapo_smart_controller_front_door_lock_status', 'summary')\
        \ %}\n{% macro tail(v) -%}{{ v.split(' — ')[1] if v and ' — ' in v else '' }}{%- endmacro\
        \ %}\n{{ {\n  'title': 'Doors',\n  'icon': 'mdi:shield-home',\n  'badge': {'text': 'Monitoring\
        \ only', 'tone': 'idle'},\n  'stats': [\n    {'label': 'Garage door', 'value': gp if gp in\
        \ ['Closed', 'Not closed'] else 'Unknown',\n     'tone': 'ok' if gp == 'Closed' else ('warn'\
        \ if gp == 'Not closed' else 'idle'), 'detail': tail(gs) or none},\n    {'label': 'Front\
        \ door', 'value': 'Open' if fo == 'on' else ('Closed' if fo == 'off' else 'Unknown'),\n \
        \    'tone': 'warn' if fo == 'on' else ('ok' if fo == 'off' else 'idle'), 'detail': tail(fs)\
        \ or none}\n  ],\n  'columns': 2,\n  'lines': [\"Monitoring only: no garage Open/Close/Stop\
        \ and no lock controls. The garage is operated by its physical Tapo button, and a closed\
        \ door contact does not mean the front door is locked.\"]\n} | tojson }}\n"
      model: 12
    - type: history-graph
      title: Door contacts, last 7 days
      hours_to_show: 168
      entities:
      - binary_sensor.garage_door
      - binary_sensor.front_door_door
      grid_options:
        columns: 12
