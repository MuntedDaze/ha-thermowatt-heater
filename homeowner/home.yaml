# Home dashboard (generated by tools/build_home_dashboard.py; edit the mapping file instead)
# Requires the dependency-free custom card /local/thermowatt/thermowatt-power-flow-card.js
# (homeowner/www/thermowatt-power-flow-card.js). Use home_no_custom_card.yaml without it.
title: Home
views:
- title: Home
  path: home
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-power-flow-card
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
      today:
        solar: sensor.goodwe_inverter_today_s_pv_generation
        import: sensor.goodwe_inverter_meter_total_energy_import
        export: sensor.goodwe_inverter_meter_total_energy_export
      timezone: Australia/Hobart
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set t = states('sensor.thermann_shadow_bottom_temperature') %}\n{% set age = states('sensor.thermann_shadow_status_age')\
        \ %}\n{% set mode_r = states('sensor.thermann_shadow_thermann_mode') %}\n{% set tgt_r = states('sensor.thermann_shadow_thermann_target')\
        \ %}\n{% set tgt_d = states('sensor.thermann_shadow_desired_thermostat_temperature') %}\n\
        {% set ctrl = states('sensor.thermann_shadow_hot_water_operating_mode') %}\n{% set tariff\
        \ = states('sensor.thermann_shadow_current_tariff') %}\n{% set boost = states('sensor.thermann_shadow_solar_boost_status')\
        \ %}\n{% set nxt = states('sensor.thermann_shadow_next_intended_action') %}\n{% set poll\
        \ = states('sensor.thermann_shadow_next_cloud_poll') %}\n{% set last = states('sensor.home_last_successful_poll')\
        \ %}\n{% set ends = states('sensor.thermann_shadow_guest_mode_ends') %}\n{% set ctrl_names\
        \ = {'automatic': 'Automatic', 'guest': '12 h override', 'holiday': 'Holiday', 'disabled':\
        \ 'Off'} %}\n{% set tariff_names = {'off_peak': 'Off-peak', 'peak': 'Peak', 'shoulder': 'Shoulder'}\
        \ %}\n{% set target = ('Target ' ~ ('%d' | format(tgt_r | float(0) | round(0)) ) ~ ' °C')\
        \ if tgt_r not in bad else none %}\n{% set desired = (' · desired ' ~ ('%d' | format(tgt_d\
        \ | float(0) | round(0))) ~ ' °C') if (tgt_d not in bad and tgt_r not in bad and (tgt_d |\
        \ float(0) | round(0)) != (tgt_r | float(0) | round(0))) else '' %}\n{% set stats = [\n \
        \ {'label': 'Heater', 'value': nice(mode_r) if mode_r not in bad else none, 'detail': (target\
        \ ~ desired) if target else none},\n  {'label': 'Tariff', 'value': tariff_names.get(tariff,\
        \ nice(tariff)) if tariff not in bad else none, 'tone': 'warn' if tariff == 'peak' else ('ok'\
        \ if tariff == 'off_peak' else 'idle')},\n  {'label': 'Solar boost', 'value': nice(boost)\
        \ if boost not in bad else none},\n  {'label': 'Next', 'value': nice(nxt) if nxt not in bad\
        \ else none, 'detail': ('Next poll ' ~ hhmm(poll)) if poll not in bad else none}\n] %}\n\
        {% if ctrl == 'guest' and ends not in bad %}{% set stats = stats + [{'label': 'Override ends',\
        \ 'value': hhmm(ends), 'tone': 'warn'}] %}{% endif %}\n{{ {\n  'title': 'Hot water',\n  'icon':\
        \ 'mdi:water-boiler',\n  'badge': {'text': ctrl_names.get(ctrl, nice(ctrl)) if ctrl not in\
        \ bad else 'Status unknown', 'tone': 'warn' if ctrl == 'guest' else ('idle' if ctrl in bad\
        \ else 'info')},\n  'hero': {'label': 'Tank bottom', 'value': ('%.1f' | format(t | float(0)))\
        \ if t not in bad else none, 'unit': '°C',\n           'caption': (('Updated ' ~ (age | int(0))\
        \ ~ ' min ago') if age not in bad else 'Age unknown') ~ ' · last poll ' ~ (hhmm(last) if\
        \ last not in bad else '—')},\n  'stats': stats,\n  'columns': 2\n} | tojson }}\n"
      model: 12
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state: guest
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12 h override: ON'
        icon: mdi:water-boiler
        color: blue
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_cancel_guest_mode
          confirmation:
            text: Cancel the 12 hour 62 °C override? Normal automatic control resumes.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_cancel_guest_mode
          confirmation:
            text: Cancel the 12 hour 62 °C override? Normal automatic control resumes.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: guest
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: unavailable
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: unknown
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: holiday
      - condition: state
        entity: sensor.thermann_shadow_hot_water_operating_mode
        state_not: disabled
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12 h override: OFF'
        icon: mdi:water-boiler-off
        color: grey
        hide_state: true
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_start_guest_mode_12_h
          confirmation:
            text: Start the 12 hour 62 °C override? It may heat during peak hours; controller safeguards
              still apply.
        icon_tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.thermann_shadow_start_guest_mode_12_h
          confirmation:
            text: Start the 12 hour 62 °C override? It may heat during peak hours; controller safeguards
              still apply.
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: unavailable
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: unknown
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12 h override: status unknown'
        icon: mdi:water-boiler-alert
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: holiday
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: disabled
      card:
        type: tile
        entity: sensor.thermann_shadow_hot_water_operating_mode
        name: '12 h override: not available now'
        icon: mdi:water-boiler-off
        color: grey
        hide_state: true
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: weather-forecast
