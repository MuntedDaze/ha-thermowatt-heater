- title: Energy
  path: energy
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: custom:thermowatt-power-flow-card
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
      today:
        solar: sensor.goodwe_inverter_today_s_pv_generation
        import: sensor.goodwe_inverter_meter_total_energy_import
        export: sensor.goodwe_inverter_meter_total_energy_export
      timezone: Australia/Hobart
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: custom:thermowatt-panel-card
      grid_options:
        columns: 12
      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set s = states('sensor.home_energy_status') %}\n{% macro kwh(e) -%}{{ ('%.2f' | format(states(e)\
        \ | float(0)) ~ ' kWh') if is_number(states(e)) else '—' }}{%- endmacro %}\n{% set figures\
        \ = [\n  {'label': 'Household today', 'value': kwh('sensor.home_consumption_today'), 'tone':\
        \ 'info'},\n  {'label': 'Solar used directly', 'value': kwh('sensor.home_solar_used_directly_today'),\
        \ 'tone': 'ok'},\n  {'label': 'Self-consumption', 'value': (('%d' | format(states('sensor.home_self_consumption_today')\
        \ | float(0))) ~ ' %') if is_number(states('sensor.home_self_consumption_today')) else '—',\
        \ 'tone': 'ok'}\n] %}\n{% set meters = [\n  {'label': 'Grid import since the meter started',\
        \ 'value': kwh('sensor.home_grid_import_meter')},\n  {'label': 'Grid export since the meter\
        \ started', 'value': kwh('sensor.home_grid_export_meter')},\n  {'label': 'Household, integrated\
        \ from power (estimate)', 'value': kwh('sensor.home_consumption_meter')}\n] %}\n{% set lines\
        \ = {\n  'collecting_first_day': 'Household, direct-use and self-consumption appear once\
        \ the daily meters cover a full day (after the next midnight). Solar, import and export are\
        \ shown from existing statistics.',\n  'sources_unavailable': 'Check the inverter integration;\
        \ figures are withheld, not zero.',\n  'inconsistent': 'Daily counters disagree (export exceeds\
        \ generation); figures are withheld until they agree.',\n  'battery_unconfirmed': 'Set battery_present:\
        \ false in the mapping if there is no battery.'\n} %}\n{% set badges = {\n  'ready': {'text':\
        \ 'Complete day', 'tone': 'ok'},\n  'collecting_first_day': {'text': 'Collecting daily data',\
        \ 'tone': 'info'},\n  'sources_unavailable': {'text': 'Readings unavailable', 'tone': 'bad'},\n\
        \  'inconsistent': {'text': 'Counters disagree', 'tone': 'bad'},\n  'battery_unconfirmed':\
        \ {'text': 'Battery not confirmed', 'tone': 'warn'}\n} %}\n{{ {\n  'title': \"Today's energy\"\
        ,\n  'icon': 'mdi:chart-bar',\n  'badge': badges.get(s, {'text': 'Status unknown', 'tone':\
        \ 'idle'}),\n  'stats': figures if s == 'ready' else [],\n  'columns': 3,\n  'groups': []\
        \ if s == 'ready' else [{'title': 'Daily meters (partial on the day installed)', 'rows':\
        \ meters}],\n  'lines': [lines[s]] if s in lines else []\n} | tojson }}\n"
      model: 12
    - type: custom:thermowatt-device-energy-card
      tariff:
        clock: standard
        utc_offset_hours: 10
        peak_windows:
        - days:
          - 0
          - 1
          - 2
          - 3
          - 4
          start: '07:00'
          end: '10:00'
        - days:
          - 0
          - 1
          - 2
          - 3
          - 4
          start: '16:00'
          end: '21:00'
      rates:
      - effective_from: null
        offpeak: 0.1419
        peak: 0.1907
      platforms:
      - tplink
      - tapo
      history_months: 6
      grid_options:
        columns: 12
      house:
        solar: sensor.goodwe_inverter_today_s_pv_generation
        import: sensor.goodwe_inverter_meter_total_energy_import
        export: sensor.goodwe_inverter_meter_total_energy_export
        battery_present: false
      timezone: Australia/Hobart
      part: balancemini
  - type: grid
    cards:
    - type: history-graph
      title: Power, last 24 hours
      hours_to_show: 24
