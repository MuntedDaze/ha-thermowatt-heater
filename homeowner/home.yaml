        \ 'Unknown'} %}\n{% set fault = states('sensor.thermann_shadow_controller_fault') %}\n{%\
        \ set c = states('sensor.thermann_shadow_cloud_health') %}\n{% set s = states('sensor.thermann_shadow_automatic_control_state')\
        \ %}\n{% set t = states('sensor.tapo_smart_controller_electricity_tariff_status') %}\n{%\
        \ set w = states('sensor.tapo_smart_controller_active_health_warnings') %}\n{% set good_sup\
        \ = ['observing', 'parked', 'baseline_45', 'normal_storage_62', 'storage_70'] %}\n{% set\
        \ wait_sup = ['change_requested', 'confirming', 'owner_override', 'disabled'] %}\n{{ {\n\
        \  'title': 'System status',\n  'icon': 'mdi:stethoscope',\n  'groups': [\n    {'title':\
        \ 'Thermowatt', 'rows': [\n      {'label': 'Cloud connection', 'value': cloud.get(c, nice(c))\
        \ if c not in bad else 'Unknown',\n       'tone': 'ok' if c == 'ok' else ('warn' if c in\
        \ ['disabled', 'quota_limited', 'backoff'] else ('bad' if c in ['auth_locked', 'unavailable']\
        \ else 'idle'))},\n      {'label': 'Heating control problem', 'value': 'No problems detected'\
        \ if fault in ['none', 'None', ''] else ('Unknown' if fault in ['unknown', 'unavailable']\
        \ else nice(fault)),\n       'tone': 'ok' if fault in ['none', 'None', ''] else ('idle' if\
        \ fault in ['unknown', 'unavailable'] else 'bad')},\n      {'label': 'Supervision', 'value':\
        \ sup.get(s, nice(s)) if s not in bad else 'Unknown',\n       'tone': 'ok' if s in good_sup\
        \ else ('warn' if s in wait_sup else ('bad' if s == 'fault_locked' else 'idle'))}\n    ]},\n\
        \    {'title': 'Tapo Smart Controller', 'rows': [\n      {'label': 'Health', 'value': ('Problem\
        \ reported' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'on') else ('No problems detected' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'off') else 'Unknown')) ~ ((' (' ~ w ~ ' active warnings)') if w not in bad else ''),\n\
        \       'tone': 'bad' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'on') else ('ok' if is_state('binary_sensor.tapo_smart_controller_controller_health_problem',\
        \ 'off') else 'idle')},\n      {'label': 'Mode', 'value': 'Simulation: no devices are switched'\
        \ if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active', 'on') else ('Live\
        \ control' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active', 'off')\
        \ else 'Unknown'),\n       'tone': 'warn' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active',\
        \ 'on') else ('ok' if is_state('binary_sensor.tapo_smart_controller_simulation_mode_active',\
        \ 'off') else 'idle')},\n      {'label': 'Tariff read by the controller', 'value': tariff.get(t,\
        \ nice(t)) if t not in bad else 'Unknown'}\n    ]}\n  ]\n} | tojson }}\n"
