      template: "{% set bad = ['unknown', 'unavailable', 'none', ''] %}\n{% macro nice(v) -%}{{ v\
        \ | replace('_', ' ') | capitalize }}{%- endmacro %}\n{% macro hhmm(v) -%}{% set d = as_datetime(v,\
        \ none) %}{{ as_local(d).strftime('%H:%M') if d is not none else '—' }}{%- endmacro %}\n\
        {% set t = states('sensor.thermann_shadow_bottom_temperature') %}\n{% set age = states('sensor.thermann_shadow_status_age')\
        \ %}\n{% set mode_r = states('sensor.thermann_shadow_thermann_mode') %}\n{% set tgt_r = states('sensor.thermann_shadow_thermann_target')\
        \ %}\n{% set tgt_d = states('sensor.thermann_shadow_desired_thermostat_temperature') %}\n\
        {% set ctrl = states('sensor.thermann_shadow_hot_water_operating_mode') %}\n{% set tariff\
        \ = states('sensor.thermann_shadow_current_tariff') %}\n{% set boost = states('sensor.thermann_shadow_solar_boost_status')\
        \ %}\n{% set nxt = states('sensor.thermann_shadow_next_intended_action') %}\n{% set poll\
        \ = states('sensor.thermann_shadow_next_cloud_poll') %}\n{% set last = states('sensor.home_last_successful_poll')\
        \ %}\n{% set ends = states('sensor.thermann_shadow_guest_mode_ends') %}\n{% set ctrl_names\
        \ = {'automatic': 'Automatic', 'guest': '12 h override', 'holiday': 'Holiday', 'disabled':\
        \ 'Off'} %}\n{% set tariff_names = {'off_peak': 'Off-peak', 'peak': 'Peak', 'shoulder': 'Shoulder'}\
        \ %}\n{% set target = ('Target ' ~ ('%d' | format(tgt_r | float(0) | round(0)) ) ~ ' °C')\
        \ if tgt_r not in bad else none %}\n{% set desired = (' · desired ' ~ ('%d' | format(tgt_d\
        \ | float(0) | round(0))) ~ ' °C') if (tgt_d not in bad and tgt_r not in bad and (tgt_d |\
        \ float(0) | round(0)) != (tgt_r | float(0) | round(0))) else '' %}\n{% set stats = [\n \
        \ {'label': 'Heater', 'value': nice(mode_r) if mode_r not in bad else none, 'detail': (target\
        \ ~ desired) if target else none},\n  {'label': 'Tariff', 'value': tariff_names.get(tariff,\
        \ nice(tariff)) if tariff not in bad else none, 'tone': 'warn' if tariff == 'peak' else ('ok'\
        \ if tariff == 'off_peak' else 'idle')},\n  {'label': 'Solar boost', 'value': nice(boost)\
        \ if boost not in bad else none},\n  {'label': 'Next', 'value': nice(nxt) if nxt not in bad\
        \ else none, 'detail': ('Next poll ' ~ hhmm(poll)) if poll not in bad else none}\n] %}\n\
        {% if ctrl == 'guest' and ends not in bad %}{% set stats = stats + [{'label': 'Override ends',\
        \ 'value': hhmm(ends), 'tone': 'warn'}] %}{% endif %}\n{{ {\n  'title': 'Hot water',\n  'icon':\
