        \ float(0) | round(0))) if h not in bad else none, 'unit': '%', 'tone': 'info' if shower\
        \ == 'on' else 'idle'},\n    {'label': 'Temperature', 'value': ('%.1f' | format(t | float(0)))\
        \ if t not in bad else none, 'unit': '°C'}\n  ]\n} | tojson }}\n"
