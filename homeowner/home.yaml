# Home dashboard (generated by tools/build_home_dashboard.py; edit homeowner/home_mapping.yaml)
# Requires the dependency-free custom card /local/thermowatt/thermowatt-power-flow-card.js
# (homeowner/www/thermowatt-power-flow-card.js). Use home_no_custom_card.yaml without it.
title: Home
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Energy
      heading_style: title
      icon: mdi:solar-power
    - type: custom:thermowatt-power-flow-card
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.goodwe_inverter_today_s_pv_generation
        name: Solar today
        icon: mdi:solar-power-variant
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_consumption_today
        name: Household today
        icon: mdi:home-lightning-bolt
        color: blue
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_grid_import_today
        name: Grid import today
        icon: mdi:transmission-tower-import
        color: orange
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_grid_export_today
        name: Grid export today
        icon: mdi:transmission-tower-export
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_solar_used_directly_today
        name: Solar used directly
        icon: mdi:home-battery
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_self_consumption_today
        name: Self-consumption
        icon: mdi:percent-circle
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Weather
      heading_style: title
      icon: mdi:weather-partly-cloudy
    - type: markdown
      content: '**Rokeby TAS weather: mapping needed.** Set `weather.entity` in `homeowner/home_mapping.yaml`
        to the real entity ID (Developer Tools -> States), then run `python tools/build_home_dashboard.py`.
        Nothing is guessed.'
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Hot water
        heading_style: title
        icon: mdi:water-boiler
      - type: entities
        show_header_toggle: false
        entities:
        - entity: sensor.thermann_shadow_bottom_temperature
          name: Tank bottom temperature
        - entity: sensor.thermann_shadow_status_age
          name: Reading age (min)
        - entity: sensor.thermann_shadow_hot_water_operating_mode
          name: Mode
        - entity: sensor.thermann_shadow_current_heating_plan
          name: Plan
        - entity: sensor.thermann_shadow_next_intended_action
          name: Next action
        - entity: sensor.thermann_shadow_current_tariff
          name: Tariff
        - entity: sensor.thermann_shadow_solar_boost_status
          name: Solar boost
        - entity: sensor.home_last_successful_poll
          name: Last successful poll
        - entity: sensor.thermann_shadow_next_cloud_poll
          name: Next poll
        - entity: sensor.thermann_shadow_guest_mode_ends
          name: Override ends
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state: guest
        card:
          type: tile
          entity: sensor.thermann_shadow_hot_water_operating_mode
          name: '12 h override: ON'
          icon: mdi:water-boiler
          color: blue
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.thermann_shadow_cancel_guest_mode
            confirmation:
              text: Cancel the 12 hour 62 °C override? Normal automatic control resumes.
          icon_tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.thermann_shadow_cancel_guest_mode
            confirmation:
              text: Cancel the 12 hour 62 °C override? Normal automatic control resumes.
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state_not: guest
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state_not: unavailable
        - condition: state
          entity: sensor.thermann_shadow_hot_water_operating_mode
          state_not: unknown
        card:
          type: tile
          entity: sensor.thermann_shadow_hot_water_operating_mode
          name: '12 h override: OFF'
          icon: mdi:water-boiler-off
          color: grey
          hide_state: true
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.thermann_shadow_start_guest_mode_12_h
            confirmation:
              text: Start the 12 hour 62 °C override? It may heat during peak hours; controller safeguards
                still apply.
          icon_tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.thermann_shadow_start_guest_mode_12_h
            confirmation:
              text: Start the 12 hour 62 °C override? It may heat during peak hours; controller safeguards
                still apply.
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: or
          conditions:
          - condition: state
            entity: sensor.thermann_shadow_hot_water_operating_mode
            state: unavailable
          - condition: state
            entity: sensor.thermann_shadow_hot_water_operating_mode
            state: unknown
        card:
          type: tile
          entity: sensor.thermann_shadow_hot_water_operating_mode
          name: '12 h override: status unknown'
          icon: mdi:water-boiler-alert
          color: grey
          hide_state: true
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
  - type: grid
    cards:
    - type: heading
      heading: Lights
      heading_style: title
      icon: mdi:lightbulb-group
    - type: markdown
      content: '**Dining room light: mapping needed.** Set `lights.dining_room.entity` in `homeowner/home_mapping.yaml`
        to the real entity ID (Developer Tools -> States), then run `python tools/build_home_dashboard.py`.
        Nothing is guessed.'
    - type: markdown
      content: '**Living room light: mapping needed.** Set `lights.living_room.entity` in `homeowner/home_mapping.yaml`
        to the real entity ID (Developer Tools -> States), then run `python tools/build_home_dashboard.py`.
        Nothing is guessed.'
  - type: grid
    cards:
    - type: heading
      heading: Doors
      heading_style: title
      icon: mdi:door
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.tapo_smart_controller_garage_door_position
        state: Closed
      card:
        type: tile
        entity: sensor.tapo_smart_controller_garage_door_position
        name: Garage door
        icon: mdi:garage-variant
        color: grey
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.tapo_smart_controller_garage_door_position
        state: Not closed
      card:
        type: tile
        entity: sensor.tapo_smart_controller_garage_door_position
        name: Garage door
        icon: mdi:garage-open-variant
        color: orange
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.tapo_smart_controller_garage_door_position
        state_not: Closed
      - condition: state
        entity: sensor.tapo_smart_controller_garage_door_position
        state_not: Not closed
      card:
        type: tile
        entity: sensor.tapo_smart_controller_garage_door_position
        name: Garage door
        icon: mdi:garage-alert-variant
        color: grey
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
    - type: tile
      entity: binary_sensor.tapo_smart_controller_front_door_open
      name: Front door
      icon: mdi:door
      color: orange
      state_content: state
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      hold_action:
        action: none
      vertical: false
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: heading
        heading: Main Bathroom
        heading_style: title
        icon: mdi:shower-head
      - type: grid
        columns: 2
        square: false
        cards:
        - type: tile
          entity: sensor.tapo_smart_controller_main_bathroom_humidity
          name: Humidity
          icon: mdi:water-percent
          color: blue
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.tapo_smart_controller_main_bathroom_temperature
          name: Temperature
          icon: mdi:thermometer
          color: orange
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: binary_sensor.tapo_smart_controller_main_bathroom_shower_detected
          name: Shower
          icon: mdi:shower-head
          color: blue
          state_content: state
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.tapo_smart_controller_main_bathroom_fan_status
          name: Extraction
          icon: mdi:fan-clock
          state_content: summary
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          state: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_main_bathroom_fan_running
          name: Fan
          icon: mdi:fan
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          state_not: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_main_bathroom_fan_running
          name: Fan
          icon: mdi:fan
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_fan_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
          state: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_main_bathroom_towel_rail_heating
          name: Towel rail
          icon: mdi:radiator
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
          state_not: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_main_bathroom_towel_rail_heating
          name: Towel rail
          icon: mdi:radiator
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
            confirmation:
              text: Request one towel-rail drying cycle? It only heats during off-peak.
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_main_bathroom_towel_rail_manual_override
            confirmation:
              text: Request one towel-rail drying cycle? It only heats during off-peak.
          hold_action:
            action: none
          vertical: false
    - type: vertical-stack
      cards:
      - type: heading
        heading: Ensuite
        heading_style: title
        icon: mdi:shower-head
      - type: grid
        columns: 2
        square: false
        cards:
        - type: tile
          entity: sensor.tapo_smart_controller_ensuite_humidity
          name: Humidity
          icon: mdi:water-percent
          color: blue
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.tapo_smart_controller_ensuite_temperature
          name: Temperature
          icon: mdi:thermometer
          color: orange
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: binary_sensor.tapo_smart_controller_ensuite_shower_detected
          name: Shower
          icon: mdi:shower-head
          color: blue
          state_content: state
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.tapo_smart_controller_ensuite_fan_status
          name: Extraction
          icon: mdi:fan-clock
          state_content: summary
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_ensuite_fan_manual_override
          state: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_ensuite_fan_running
          name: Fan
          icon: mdi:fan
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_ensuite_fan_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_ensuite_fan_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_ensuite_fan_manual_override
          state_not: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_ensuite_fan_running
          name: Fan
          icon: mdi:fan
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_ensuite_fan_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_ensuite_fan_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
          state: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_ensuite_towel_rail_heating
          name: Towel rail
          icon: mdi:radiator
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_off
            target:
              entity_id: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
          hold_action:
            action: none
          vertical: false
      - type: conditional
        conditions:
        - condition: state
          entity: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
          state_not: 'on'
        card:
          type: tile
          entity: binary_sensor.tapo_smart_controller_ensuite_towel_rail_heating
          name: Towel rail
          icon: mdi:radiator
          color: blue
          state_content: summary
          tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
            confirmation:
              text: Request one towel-rail drying cycle? It only heats during off-peak.
          icon_tap_action:
            action: perform-action
            perform_action: switch.turn_on
            target:
              entity_id: switch.tapo_smart_controller_ensuite_towel_rail_manual_override
            confirmation:
              text: Request one towel-rail drying cycle? It only heats during off-peak.
          hold_action:
            action: none
          vertical: false
    column_span: 2
- title: Energy
  path: energy
  icon: mdi:solar-power
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Live power flow
      heading_style: title
      icon: mdi:flash
    - type: custom:thermowatt-power-flow-card
      solar_entity: sensor.goodwe_inverter_pv_power
      house_entity: sensor.goodwe_inverter_house_consumption
      grid_entity: sensor.goodwe_inverter_meter_active_power
      grid_export_positive: true
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.goodwe_inverter_today_s_pv_generation
        name: Solar today
        icon: mdi:solar-power-variant
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_consumption_today
        name: Household today
        icon: mdi:home-lightning-bolt
        color: blue
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_grid_import_today
        name: Grid import today
        icon: mdi:transmission-tower-import
        color: orange
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_grid_export_today
        name: Grid export today
        icon: mdi:transmission-tower-export
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_solar_used_directly_today
        name: Solar used directly
        icon: mdi:home-battery
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      - type: tile
        entity: sensor.home_self_consumption_today
        name: Self-consumption
        icon: mdi:percent-circle
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
  - type: grid
    cards:
    - type: heading
      heading: Today (long-term statistics)
      heading_style: title
      icon: mdi:chart-bar
    - type: statistic
      entity: sensor.goodwe_inverter_today_s_pv_generation
      name: Solar generated (statistics)
      stat_type: change
      period:
        calendar:
          period: day
    - type: statistic
      entity: sensor.goodwe_inverter_meter_total_energy_import
      name: Grid import (statistics)
      stat_type: change
      period:
        calendar:
          period: day
    - type: statistic
      entity: sensor.goodwe_inverter_meter_total_energy_export
      name: Grid export (statistics)
      stat_type: change
      period:
        calendar:
          period: day
    - type: history-graph
      title: Power (24 h)
      hours_to_show: 24
      entities:
      - sensor.goodwe_inverter_pv_power
      - sensor.goodwe_inverter_house_consumption
      - sensor.goodwe_inverter_meter_active_power
    - type: markdown
      content: Daily household, import and export figures come from the optional `home_energy_package.yaml`
        and begin counting when it is installed; the statistics cards above are retroactive. EMHASS
        forecasts are never shown as measurements.
