# Home dashboard, native power-flow fallback (generated by tools/build_home_dashboard.py)
title: Home
views:
- title: Home
  path: home
  type: sections
  max_columns: 4
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: vertical-stack
      grid_options:
        columns: 12
      cards:
      - type: horizontal-stack
        cards:
        - type: tile
          entity: sensor.home_solar_power_kw
          name: Solar
          icon: mdi:solar-power
          color: green
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.home_house_power_kw
          name: House
          icon: mdi:home-lightning-bolt
          color: blue
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
      - type: horizontal-stack
        cards:
        - type: tile
          entity: sensor.home_grid_state
          name: Grid
          icon: mdi:transmission-tower
          color: orange
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.home_grid_import_kw
          name: Import
          icon: mdi:transmission-tower-import
          color: orange
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
        - type: tile
          entity: sensor.home_grid_export_kw
          name: Export
          icon: mdi:transmission-tower-export
          color: green
          tap_action:
            action: more-info
          icon_tap_action:
            action: more-info
          hold_action:
            action: none
          vertical: false
  - type: grid
    cards:
    - type: tile
      entity: sensor.goodwe_inverter_today_s_pv_generation
      name: Solar today
      icon: mdi:solar-power-variant
      color: green
      tap_action:
        action: more-info
      icon_tap_action:
        action: more-info
      hold_action:
        action: none
      vertical: false
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.goodwe_inverter_meter_total_energy_import
      name: Grid import today
      stat_type: change
      period:
        calendar:
          period: day
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.goodwe_inverter_meter_total_energy_export
      name: Grid export today
      stat_type: change
      period:
        calendar:
          period: day
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.home_energy_status
        state: ready
      card:
        type: tile
        entity: sensor.home_consumption_today
        name: Household today
        icon: mdi:home-lightning-bolt
        color: blue
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.home_energy_status
        state: ready
      card:
        type: tile
        entity: sensor.home_solar_used_directly_today
        name: Solar used directly
        icon: mdi:home-battery
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.home_energy_status
        state: ready
      card:
        type: tile
        entity: sensor.home_self_consumption_today
        name: Self-consumption
        icon: mdi:percent-circle
        color: green
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info
        hold_action:
          action: none
        vertical: false
      grid_options:
        columns: 6
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.home_energy_status
        state_not: ready
      card:
        type: markdown
        content: '{% set s = states(''sensor.home_energy_status'') %}{% if s == ''collecting_first_day''
          %}**Collecting daily data.** Household, direct-use and self-consumption appear once the
          daily meters cover a full day (after the next midnight). Solar, import and export are shown
          from existing statistics.{% elif s == ''sources_unavailable'' %}**Energy readings unavailable.**
          Check the inverter integration; figures are withheld, not zero.{% elif s == ''inconsistent''
          %}**Daily counters disagree** (export exceeds generation); figures are withheld until they
          agree.{% elif s == ''battery_unconfirmed'' %}**Battery not confirmed.** Set `battery_present:
          false` in the mapping if there is no battery.{% elif s == ''ready'' %}{% else %}**Energy
          status unknown.**{% endif %}'
      grid_options:
        columns: 12
  - type: grid
    cards:
    - type: markdown
      content: '{% macro nice(v) -%}{{ v | replace(''_'', '' '') | capitalize }}{%- endmacro %}

        {% macro hhmm(v) -%}{% set d = as_datetime(v, none) %}{{ as_local(d).strftime(''%H:%M'')
        if d is not none else ''—'' }}{%- endmacro %}

        {% set bad = [''unknown'', ''unavailable'', ''none'', ''''] %}

        {% set t = states(''sensor.thermann_shadow_bottom_temperature'') %}

        {% set age = states(''sensor.thermann_shadow_status_age'') %}

        {% set mode_r = states(''sensor.thermann_shadow_thermann_mode'') %}

        {% set tgt_r = states(''sensor.thermann_shadow_thermann_target'') %}

        {% set tgt_d = states(''sensor.thermann_shadow_desired_thermostat_temperature'') %}

        {% set ctrl = states(''sensor.thermann_shadow_hot_water_operating_mode'') %}

        {% set tariff = states(''sensor.thermann_shadow_current_tariff'') %}

        {% set boost = states(''sensor.thermann_shadow_solar_boost_status'') %}

        {% set nxt = states(''sensor.thermann_shadow_next_intended_action'') %}

        {% set poll = states(''sensor.thermann_shadow_next_cloud_poll'') %}

        {% set last = states(''sensor.home_last_successful_poll'') %}

        {% set ends = states(''sensor.thermann_shadow_guest_mode_ends'') %}

        {% set ctrl_names = {''automatic'': ''Automatic'', ''guest'': ''12 h override'', ''holiday'':
        ''Holiday'', ''disabled'': ''Off''} %}

        {% set tariff_names = {''off_peak'': ''Off-peak'', ''peak'': ''Peak'', ''shoulder'': ''Shoulder''}
        %}

        # {{ (t | float(0) | round(1) ~ '' °C'') if t not in bad else ''—'' }}

        Water temperature · {{ (''updated '' ~ (age | int(0)) ~ '' min ago'') if age not in bad else
        ''age unknown'' }} · last poll {{ hhmm(last) if last not in bad else ''—'' }}


        **Heater** {{ nice(mode_r) if mode_r not in bad else ''—'' }} · target {{ (tgt_r | float(0)
        | round(0) | int ~ '' °C'') if tgt_r not in bad else ''—'' }}{% if tgt_d not in bad and tgt_r
        not in bad and (tgt_d | float(0) | round(0)) != (tgt_r | float(0) | round(0)) %} · desired
        {{ tgt_d | float(0) | round(0) | int }} °C{% endif %}

        **Control** {{ ctrl_names.get(ctrl, nice(ctrl)) if ctrl not in bad else ''—'' }} · **Tariff**
        {{ tariff_names.get(tariff, nice(tariff)) if tariff not in bad else ''—'' }} · **Solar boost**
        {{ nice(boost) if boost not in bad else ''—'' }}

        **Next** {{ nice(nxt) if nxt not in bad else ''—'' }} · next poll {{ hhmm(poll) if poll not
        in bad else ''—'' }}{% if ctrl == ''guest'' and ends not in bad %}

        **Override ends** {{ hhmm(ends) }}{% endif %}

        '
      grid_options:
        columns: 12
