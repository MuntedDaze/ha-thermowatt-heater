- title: System
  path: system
  type: sections
  max_columns: 3
  dense_section_placement: true
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Status
      heading_style: subtitle
      icon: mdi:stethoscope
    - type: markdown
      content: '{% set bad = [''unknown'', ''unavailable'', ''none'', ''''] %}

        {% macro nice(v) -%}{{ v | replace(''_'', '' '') | capitalize }}{%- endmacro %}

        {% set cloud = {''ok'': ''Connected'', ''disabled'': ''Disabled'', ''auth_locked'': ''Sign-in
        locked: check the Thermann app'', ''quota_limited'': ''Request limit reached'', ''backoff'':
        ''Backing off after an error'', ''unavailable'': ''Unavailable''} %}

        {% set sup = {''observing'': ''Observing: checking the heater before acting'', ''parked'':
        ''Heater confirmed off'', ''baseline_45'': ''Holding the 45 °C baseline'', ''normal_storage_62'':
        ''Holding 62 °C storage'', ''storage_70'': ''Holding the 70 °C boost'', ''change_requested'':
        ''A change is needed but is waiting for conditions'', ''confirming'': ''Command sent: waiting
        for confirmation'', ''owner_override'': ''On hold: you pressed Hold'', ''disabled'': ''Automatic
        control is off'', ''fault_locked'': ''Fault: needs acknowledgement''} %}

        {% set tariff = {''off_peak'': ''Off-peak'', ''peak'': ''Peak'', ''shoulder'': ''Shoulder'',
        ''unknown'': ''Unknown''} %}

        {% set fault = states(''sensor.thermann_shadow_controller_fault'') %}

        {% set c = states(''sensor.thermann_shadow_cloud_health'') %}

        {% set s = states(''sensor.thermann_shadow_automatic_control_state'') %}

        {% set t = states(''sensor.tapo_smart_controller_electricity_tariff_status'') %}

        {% set w = states(''sensor.tapo_smart_controller_active_health_warnings'') %}

        **Thermowatt**

        - Cloud connection: {{ cloud.get(c, nice(c)) if c not in bad else ''Unknown'' }}

        - Heating control problem: {% if fault in [''none'', ''None'', ''''] %}No problems detected{%
        elif fault in [''unknown'', ''unavailable''] %}Unknown{% else %}{{ nice(fault) }}{% endif
        %}

        - Supervision: {{ sup.get(s, nice(s)) if s not in bad else ''Unknown'' }}


        **Tapo Smart Controller**

        - Health: {% if is_state(''binary_sensor.tapo_smart_controller_controller_health_problem'',
        ''on'') %}Problem reported{% elif is_state(''binary_sensor.tapo_smart_controller_controller_health_problem'',
        ''off'') %}No problems detected{% else %}Unknown{% endif %}{% if w not in bad %} ({{ w }}
        active warnings){% endif %}

        - Mode: {% if is_state(''binary_sensor.tapo_smart_controller_simulation_mode_active'', ''on'')
        %}Simulation: no devices are switched{% elif is_state(''binary_sensor.tapo_smart_controller_simulation_mode_active'',
        ''off'') %}Live control{% else %}Unknown{% endif %}

        - Tariff read by the controller: {{ tariff.get(t, nice(t)) if t not in bad else ''Unknown''
        }}

        '
      grid_options:
        columns: 12
    column_span: 2
  - type: grid
    cards:
    - type: tile
      entity: sensor.thermann_shadow_automatic_control_state
      hide_state: true
      name: Thermowatt settings and diagnostic report
      icon: mdi:cog-outline
      vertical: false
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/thermann_shadow
      icon_tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/thermann_shadow
      grid_options:
        columns: 12
    - type: tile
      entity: binary_sensor.tapo_smart_controller_controller_health_problem
      hide_state: true
      name: Tapo Smart Controller settings
      icon: mdi:cog-outline
      vertical: false
      tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/tapo_smart_controller
      icon_tap_action:
        action: navigate
        navigation_path: /config/integrations/integration/tapo_smart_controller
      grid_options:
        columns: 12
