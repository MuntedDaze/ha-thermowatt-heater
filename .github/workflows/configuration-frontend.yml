name: Configuration usability (real frontend, isolated)

on:
  pull_request:
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  frontend:
    name: Settings frontend HA ${{ matrix.version }} (desktop/mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["2026.10.4", "2026.11.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare browser dependencies before isolating all test networking
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" @playwright/test@1.64.1
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble
          docker pull ghcr.io/home-assistant/home-assistant:${{ matrix.version }}
          mkdir -p "$RUNNER_TEMP/private" frontend-results
          chmod a+rwx "$RUNNER_TEMP/private" frontend-results
      - name: Start a disposable HA frontend (no network, no bridge)
        run: |
          docker run -d --name thermann-ui --network none --entrypoint python3 \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/private,dst=/private" \
            ghcr.io/home-assistant/home-assistant:${{ matrix.version }} \
            /workspace/tools/readiness/configuration_frontend_server.py
          for i in $(seq 1 90); do
            test -f "$RUNNER_TEMP/private/browser.json" && exit 0
            test "$(docker inspect -f '{{.State.Running}}' thermann-ui)" = true || break
            sleep 1
          done
          docker logs thermann-ui
          exit 1
      - name: Exercise the actual frontend on desktop and phone widths
        run: |
          docker run --rm --init --network container:thermann-ui --shm-size=512m \
            -e NODE_PATH=/browser/node_modules \
            --mount "type=bind,src=$RUNNER_TEMP/browser,dst=/browser,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/private,dst=/private,readonly" \
            --mount "type=bind,src=$PWD,dst=/workspace,readonly" \
            --mount "type=bind,src=$PWD/frontend-results,dst=/results" \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            node /workspace/tools/readiness/configuration_frontend.cjs
      - name: Stop disposable test instance
        if: always()
        run: |
          docker logs thermann-ui
          docker rm -f thermann-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-ui-${{ matrix.version }}
          path: frontend-results/
