name: "Thermann Hot Water"
description: "Unofficial community app (not a Thermann product): connects a Thermann smart electric water heater to Home Assistant through the Thermowatt cloud."
version: "1.3.12"
slug: "thermowatt_boiler"
arch:
  - aarch64
  - amd64
init: false
boot: manual
breaking_versions:
  - "1.3.2"
  - "1.3.3"
  - "1.3.4"
  - "1.3.6"
  - "1.3.7"
  - "1.3.8"
  - "1.3.9"
  - "1.3.10"
  - "1.3.11"
  - "1.3.12"
options:
  email: ""
  password: ""
  cloud_enabled: false
  commands_enabled: false
  command_policy: automation
  poll_interval_minutes: 30
  poll_interval_unit: minutes
  min_cloud_retry_minutes: 60
  on_demand_refresh_enabled: false
  auth_retry_generation: 0
schema:
  email: str
  password: password
  cloud_enabled: bool
  commands_enabled: bool
  command_policy: list(automation|legacy)
  poll_interval_minutes: int(1,7200)
  poll_interval_unit: list(seconds|minutes)
  min_cloud_retry_minutes: int(5,1440)
  on_demand_refresh_enabled: bool
  auth_retry_generation: int(0,)
services:
  - mqtt:need
