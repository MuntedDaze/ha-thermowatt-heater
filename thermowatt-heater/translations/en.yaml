configuration:
  email:
    name: Account email
  password:
    name: Account password
  cloud_enabled:
    name: Enable cloud access
  commands_enabled:
    name: Enable heater commands
    description: Leave disabled for read-only use. Separate owner approval is required for control.
  command_policy:
    name: Command policy
    description: automation accepts only the closed exact-prior OFF/45/62/70 transition protocol used by the Thermann Controller. Other setpoints and malformed commands are refused. legacy is the owner's manual-control protocol (plain modes and temperature writes) and must not be used to bypass qualification.
  cloud_polling:
    name: Cloud polling
    description: smart (recommended, the single normal mode) reads the heater when the Thermann Controller's plans say a reading is useful, up to 8 hours apart for a confirmed quiet 45 or OFF overnight; the controller follows this choice automatically. Whenever no valid plan is in force (startup, communication problems, a missing or rejected plan, scheduler failure) the app reads every 30 minutes. fixed is for recovery only - always every 30 minutes. Neither choice changes command freshness checks, confirmation, request protections or authentication lockouts.
  min_cloud_retry_minutes:
    name: Minimum cloud error cooldown (minutes)
    description: Default 60. Ordinary errors wait at least this and the normal polling interval, with bounded exponential backoff. This does not reset authentication lockouts.
  auth_retry_generation:
    name: Authentication retry generation
    description: Do not change during an update or to investigate quota errors. Increasing it permits another authentication cycle.
  on_demand_refresh_enabled:
    name: Allow read-only on-demand refresh
    description: Disabled by default. Accepts non-retained refresh requests for known devices, coalesced in the existing worker. Waits at least 5 minutes after any status attempt and never bypasses guards or cloud-error cooldowns. Do not trigger from rapidly changing solar values.
